<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán - VIPER SHOP</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

<div class="container">
    <h2>CHỌN GÓI NẠP & THANH TOÁN</h2>
    <div class="success-text" id="infoText" style="color: #00ffcc; font-weight: bold; text-align: center; margin-bottom: 15px; font-size: 13px;">Đang tải thông tin...</div>

    <div style="margin-bottom: 6px;"><label style="margin-bottom: 0;">Chọn mốc nạp ưu đãi:</label></div>
    <div class="filter-box" style="display: flex; gap: 6px; margin-bottom: 10px;">
        <div class="filter-btn active" onclick="filterPackages('all', this)" style="flex: 1; background: #00ffcc; color: #0b0f19; border: 1px solid #00ffcc; padding: 6px; border-radius: 6px; font-size: 11px; cursor: pointer; text-align: center; font-weight: bold;">Tất cả</div>
        <div class="filter-btn" onclick="filterPackages('small', this)" style="flex: 1; background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; color: #cbd5e1; padding: 6px; border-radius: 6px; font-size: 11px; cursor: pointer; text-align: center; font-weight: bold;">≤ 50K</div>
        <div class="filter-btn" onclick="filterPackages('large', this)" style="flex: 1; background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; color: #cbd5e1; padding: 6px; border-radius: 6px; font-size: 11px; cursor: pointer; text-align: center; font-weight: bold;">> 50K</div>
    </div>

    <div class="packages-grid" id="packagesContainer" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px;"></div>

    <div class="form-group">
        <label>Mã giảm giá (Coupon):</label>
        <div class="coupon-box" style="display: flex; gap: 8px; margin-bottom: 15px;">
            <input type="text" id="couponCode" placeholder="Nhập mã (VD: VIPER2026)" style="text-transform: uppercase;">
            <button type="button" onclick="applyCoupon()" style="width: 100px; margin-top: 0; padding: 0; background: #ff007f; color: white; font-size: 13px;">Áp dụng</button>
        </div>
        <p id="couponMsg" style="font-size: 12px; margin-top: 4px; font-weight: bold;"></p>
    </div>

    <div class="form-group">
        <label>Chọn phương thức thanh toán:</label>
        <select id="paymentMethod" onchange="changePaymentMethod()">
            <option value="">-- Chọn hình thức --</option>
            <option value="transfer">Chuyển khoản ngân hàng (Auto)</option>
            <option value="card">Thẻ cào điện thoại (Gửi đơn chờ duyệt)</option>
        </select>
    </div>

    <!-- Phần Chuyển Khoản Ngân Hàng -->
    <div id="section-transfer" class="hidden">
        <div class="admin-box" style="background: rgba(26, 34, 54, 0.9); padding: 15px; border-radius: 10px; border: 1px dashed #00ffcc; margin-bottom: 15px; color: #cbd5e1; font-size: 13px;">
            <p style="margin: 4px 0;"><strong>Ngân hàng:</strong> MB Bank</p>
            <div class="copy-row" style="display: flex; justify-content: space-between; align-items: center; margin: 6px 0; background: rgba(11, 15, 25, 0.8); padding: 6px 10px; border-radius: 6px; border: 1px dashed #2a3b6c; font-size: 12px;">
                <span>STK: <b id="stkVal" style="color: #00ffcc;">8877945567</b></span>
                <button type="button" class="copy-btn" onclick="copyText('stkVal')" style="background: linear-gradient(135deg, #00ffcc, #00bfff); color: #0b0f19; border: none; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer;">📋 COPY</button>
            </div>
            <p style="margin: 4px 0;"><strong>Chủ TK:</strong> VI THI HA</p>
            <div class="copy-row" style="display: flex; justify-content: space-between; align-items: center; margin: 6px 0; background: rgba(11, 15, 25, 0.8); padding: 6px 10px; border-radius: 6px; border: 1px dashed #2a3b6c; font-size: 12px;">
                <span>Nội dung: <b id="transferSyntax" style="color: #00ffcc;">NAP</b></span>
                <button type="button" class="copy-btn" onclick="copyText('transferSyntax')" style="background: linear-gradient(135deg, #00ffcc, #00bfff); color: #0b0f19; border: none; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer;">📋 COPY</button>
            </div>
        </div>
        <button type="button" id="btnTransfer" onclick="finishOrder()">XÁC NHẬN ĐÃ CHUYỂN KHOẢN</button>
    </div>

    <!-- Phần Nạp Thẻ Cào (Lưu đơn chờ duyệt thủ công) -->
    <div id="section-card" class="hidden">
        <div style="background: rgba(26, 34, 54, 0.9); padding: 15px; border-radius: 10px; border: 1px solid #2a3b6c; margin-bottom: 15px;">
            <div class="form-group">
                <label>Loại thẻ:</label>
                <select id="cardType">
                    <option value="Viettel">Viettel</option>
                    <option value="Vinaphone">Vinaphone</option>
                    <option value="Mobifone">Mobifone</option>
                    <option value="Garena">Garena</option>
                    <option value="Zing">Zing</option>
                </select>
            </div>
            <div class="form-group"><label>Mệnh giá:</label><select id="cardPrice"><option value="10000">10.000 VNĐ</option><option value="20000">20.000 VNĐ</option><option value="50000">50.000 VNĐ</option><option value="100000">100.000 VNĐ</option><option value="200000">200.000 VNĐ</option><option value="500000">500.000 VNĐ</option></select></div>
            <div class="form-group"><label>Mã thẻ (PIN):</label><input type="text" id="cardCode" placeholder="Nhập mã thẻ..."></div>
            <div class="form-group"><label>Số Seri:</label><input type="text" id="cardSerial" placeholder="Nhập số seri..."></div>
        </div>
        <button type="button" id="btnCard" onclick="submitCardManual()">GỬI THẺ CÀO XỬ LÝ</button>
    </div>

    <button type="button" onclick="goBack()" style="background: #2a3b6c; color: #ffffff; margin-top: 8px;">⬅ QUAY LẠI TRANG CHỦ</button>
</div>

<div class="support-widget">
    <div class="support-tooltip">💬 Cần hỗ trợ nạp tiền? Chat ngay!</div>
    <a href="https://zalo.me" target="_blank" class="support-btn" title="Hỗ trợ 24/7">💬</a>
</div>

<script>
    let checkoutData = JSON.parse(localStorage.getItem("viper_checkout"));
    let currentPackage = "";
    let discountApplied = false;
    let allPkgs = [];

    window.onload = function() {
        if (!checkoutData) { alert("Không tìm thấy thông tin đơn hàng!"); window.location.href = "index.html"; return; }
        document.getElementById("infoText").innerText = `✔ Game: ${checkoutData.game} - ID: ${checkoutData.fullId}`;
        loadPackagesData(checkoutData.game);
        renderPackages(allPkgs);
        document.getElementById("transferSyntax").innerText = "NAP " + checkoutData.fullId;
    };

    function playSuccessSound() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const playNote = (freq, startTime, duration) => {
                let osc = ctx.createOscillator();
                let gainNode = ctx.createGain();
                osc.frequency.setValueAtTime(freq, startTime);
                gainNode.gain.setValueAtTime(0.6, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                osc.connect(gainNode); gainNode.connect(ctx.destination);
                osc.start(startTime); osc.stop(startTime + duration);
            };
            let now = ctx.currentTime;
            playNote(523.25, now, 0.35); playNote(659.25, now + 0.12, 0.35);
            playNote(783.99, now + 0.24, 0.45); playNote(1046.50, now + 0.36, 0.8);
        } catch (e) {}
    }

    function triggerFireworks() {
        var duration = 1.5 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 99999 };
        function randomInRange(min, max) { return Math.random() * (max - min) + min; }
        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return clearInterval(interval);
            var particleCount = 50 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
            confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);
    }

    function loadPackagesData(game) {
        if (game === 'Free Fire') {
            allPkgs = [{name: '10k = 110💎', price: 10}, {name: '20k = 230💎', price: 20}, {name: '50k = 600💎', price: 50, hot: true}, {name: '100k = 1300💎', price: 100, hot: true}];
        } else if (game === 'Liên Quân') {
            allPkgs = [{name: '20k = 90 QH', price: 20}, {name: '50k = 230 QH', price: 50, hot: true}, {name: '100k = 480 QH', price: 100}, {name: '200k = 1000 QH', price: 200, hot: true}];
        } else if (game === 'Roblox') {
            allPkgs = [{name: '20k = 160 Robux', price: 20}, {name: '50k = 400 Robux', price: 50}, {name: '100k = 850 Robux', price: 100, hot: true}, {name: '200k = 1800 Robux', price: 200, hot: true}];
        }
    }

    function renderPackages(pkgs) {
        let container = document.getElementById("packagesContainer");
        container.innerHTML = "";
        pkgs.forEach(pkg => {
            let div = document.createElement("div");
            div.className = "package-btn";
            div.style.background = "rgba(26, 34, 54, 0.9)"; div.style.border = "2px solid #2a3b6c"; div.style.color = "#e2e8f0";
            div.style.padding = "10px 8px"; div.style.borderRadius = "10px"; div.style.textAlign = "center"; div.style.cursor = "pointer";
            div.style.fontWeight = "700"; div.style.fontSize = "12px"; div.style.position = "relative";
            div.innerHTML = `${pkg.name} ${pkg.hot ? '<span class="badge-hot" style="position: absolute; top: 0; right: 0; background: #ff007f; color: white; font-size: 9px; padding: 2px 5px; border-bottom-left-radius: 6px;">HOT</span>' : ''}`;
            if(currentPackage === pkg.name) {
                div.style.background = "linear-gradient(135deg, #00ffcc, #0072ff)"; div.style.borderColor = "#00ffcc"; div.style.color = "#0b0f19";
            }
            div.onclick = function() {
                document.querySelectorAll(".package-btn").forEach(b => {
                    b.style.background = "rgba(26, 34, 54, 0.9)"; b.style.borderColor = "#2a3b6c"; b.style.color = "#e2e8f0";
                });
                div.style.background = "linear-gradient(135deg, #00ffcc, #0072ff)"; div.style.borderColor = "#00ffcc"; div.style.color = "#0b0f19";
                currentPackage = pkg.name;
            };
            container.appendChild(div);
        });
    }

    function filterPackages(type, el) {
        document.querySelectorAll(".filter-btn").forEach(b => {
            b.style.background = "rgba(26, 34, 54, 0.9)"; b.style.color = "#cbd5e1"; b.style.borderColor = "#2a3b6c";
        });
        el.style.background = "#00ffcc"; el.style.color = "#0b0f19"; el.style.borderColor = "#00ffcc";
        if (type === 'all') renderPackages(allPkgs);
        else if (type === 'small') renderPackages(allPkgs.filter(p => p.price <= 50));
        else if (type === 'large') renderPackages(allPkgs.filter(p => p.price > 50));
    }

    function applyCoupon() {
        let code = document.getElementById("couponCode").value.trim().toUpperCase();
        let msg = document.getElementById("couponMsg");
        if (code === "VIPER2026") {
            discountApplied = true; msg.style.color = "#00ffcc"; msg.innerText = "✔ Áp dụng mã thành công! (+20% KM)";
        } else {
            discountApplied = false; msg.style.color = "#ff3366"; msg.innerText = "❌ Mã không hợp lệ!";
        }
    }

    function changePaymentMethod() {
        let method = document.getElementById("paymentMethod").value;
        document.getElementById("section-transfer").classList.add("hidden");
        document.getElementById("section-card").classList.add("hidden");
        if (method === "transfer") document.getElementById("section-transfer").classList.remove("hidden");
        if (method === "card") document.getElementById("section-card").classList.remove("hidden");
    }

    function copyText(elementId) {
        let text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => alert("Đã sao chép!"));
    }

    function finishOrder() {
        if (!currentPackage) { alert("Vui lòng chọn mốc nạp!"); return; }
        let activeBtn = document.getElementById("btnTransfer");
        activeBtn.disabled = true;
        activeBtn.innerHTML = `<span class="spinner"></span> Đang xử lý...`;

        let finalPkgName = discountApplied ? currentPackage + " (+20% KM)" : currentPackage;
        let newTx = { game: checkoutData.game, fullId: checkoutData.fullId, package: finalPkgName, payment: "Chuyển khoản", time: new Date().toLocaleString('vi-VN') };

        let history = JSON.parse(localStorage.getItem('viper_history')) || [];
        history.unshift(newTx);
        localStorage.setItem('viper_history', JSON.stringify(history));

        playSuccessSound();
        triggerFireworks();

        setTimeout(() => {
            alert("Giao dịch thành công!");
            localStorage.removeItem('viper_checkout');
            window.location.href = "index.html";
        }, 1500);
    }

    // Xử lý nạp thẻ cào dạng lưu đơn an toàn tuyệt đối, không lỗi API
    function submitCardManual() {
        if (!currentPackage) { alert("Vui lòng chọn mốc nạp!"); return; }
        let telco = document.getElementById("cardType").value;
        let amount = parseInt(document.getElementById("cardPrice").value);
        let code = document.getElementById("cardCode").value.trim();
        let serial = document.getElementById("cardSerial").value.trim();

        if(!code || !serial) {
            alert("Vui lòng nhập đầy đủ Mã thẻ và Số Seri!");
            return;
        }

        let activeBtn = document.getElementById("btnCard");
        activeBtn.disabled = true;
        activeBtn.innerHTML = "Đang gửi đơn lên hệ thống...";

        setTimeout(() => {
            activeBtn.disabled = false;
            activeBtn.innerHTML = "GỬI THẺ CÀO XỬ LÝ";

            let finalPkgName = discountApplied ? currentPackage + " (+20% KM)" : currentPackage;
            let newTx = { 
                game: checkoutData.game, 
                fullId: checkoutData.fullId, 
                package: finalPkgName, 
                payment: "Thẻ cào (Chờ duyệt)", 
                card: { cardType: telco, cardPrice: amount + "đ", cardCode: code, cardSerial: serial }, 
                time: new Date().toLocaleString('vi-VN') 
            };

            let history = JSON.parse(localStorage.getItem('viper_history')) || [];
            history.unshift(newTx);
            localStorage.setItem('viper_history', JSON.stringify(history));

            playSuccessSound();
            triggerFireworks();
            alert("Gửi thẻ thành công! Đơn hàng của bạn đang chờ hệ thống xử lý.");

            setTimeout(() => {
                localStorage.removeItem('viper_checkout');
                window.location.href = "index.html";
            }, 1000);
        }, 800);
    }

    function goBack() { window.location.href = "index.html"; }
</script>

</body>
</html>
