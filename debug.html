<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra LocalStorage</title>
    <style>
        body { background: #0b0f19; color: #00ffcc; font-family: monospace; padding: 20px; }
        pre { background: #1a2236; padding: 15px; border-radius: 8px; border: 1px solid #2a3b6c; white-space: pre-wrap; word-wrap: break-word; }
        button { background: #00ffcc; color: #0b0f19; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 6px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>🔍 KIỂM TRA DỮ LIỆU HỆ THỐNG</h2>
    <button onclick="clearData()">Xóa toàn bộ dữ liệu (Reset Shop)</button>
    <h3>1. viper_wallet_requests (Admin duyệt nạp ví):</h3>
    <pre id="walletData"></pre>

    <h3>2. viper_history (Lịch sử chung):</h3>
    <pre id="historyData"></pre>

    <h3>3. viper_checkout (Thông tin đang mua dở):</h3>
    <pre id="checkoutData"></pre>

    <script>
        document.getElementById('walletData').innerText = localStorage.getItem('viper_wallet_requests') || 'Trống (null)';
        document.getElementById('historyData').innerText = localStorage.getItem('viper_history') || 'Trống (null)';
        document.getElementById('checkoutData').innerText = localStorage.getItem('viper_checkout') || 'Trống (null)';

        function clearData() {
            if(confirm("Bạn có chắc muốn xóa sạch dữ liệu để test lại không?")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
