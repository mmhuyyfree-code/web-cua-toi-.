<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Nạp Game Tự Động</title>
    <style>
        body {
            background: #0b0f19;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }
        .container {
            background: #121826;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #00ffcc;
            box-sizing: border-box;
        }
        h2 { text-align: center; color: #00ffcc; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #2a3b6c;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .game-btn {
            background: #1a2236;
            border: 2px solid #2a3b6c;
            color: #fff;
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .game-btn.active {
            background: #00ffcc;
            color: #0b0f19;
            border-color: #00ffcc;
        }
        .main-btn {
            width: 100%;
            background: #00ffcc;
            color: #0b0f19;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .hidden { display: none !important; }
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .pkg-btn {
            background: #1a2236;
            border: 2px solid #2a3b6c;
            color: #fff;
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .pkg-btn.active {
            background: #0072ff;
            border-color: #00ffcc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>VIPER SHOP</h2>

    <!-- BƯỚC 1 -->
    <div id="step1">
        <div class="form-group">
            <label>Chọn game:</label>
            <div class="game-grid">
                <div class="game-btn active" onclick="selectGame('Free Fire', this)">Free Fire</div>
                <div class="game-btn" onclick="selectGame('Liên Quân', this)">Liên Quân</div>
                <div class="game-btn" onclick="selectGame('Roblox', this)">Roblox</div>
            </div>
        </div>

        <div class="form-group">
            <label id="lblId">Nhập ID Game:</label>
            <input type="text" id="txtId" placeholder="Nhập ID tài khoản...">
        </div>

        <button class="main-btn" onclick="goToStep2()">TIẾP TỤC</button>
        <p id="errMsg" style="color: #ff3366; font-size: 13px; font-weight: bold; text-align: center;"></p>
    </div>

    <!-- BƯỚC 2 -->
    <div id="step2" class="hidden">
        <p id="infoText" style="color: #00ffcc; font-size: 14px; font-weight: bold; text-align: center;"></p>
        
        <div class="form-group">
            <label>Chọn gói nạp:</label>
            <div class="packages-grid" id="pkgContainer"></div>
        </div>

        <button class="main-btn" onclick="finishOrder()">XÁC NHẬN HOÀN TẤT</button>
        <button class="main-btn" onclick="goToStep1()" style="background: #2a3b6c; color: #fff; margin-top: 10px;">QUAY LẠI</button>
    </div>
</div>

<script>
    let currentGame = "Free Fire";
    let currentPkg = "";

    function selectGame(gameName, el) {
        currentGame = gameName;
        document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');

        let lbl = document.getElementById('lblId');
        if(gameName === 'Roblox') {
            lbl.innerText = "Nhập Tên Tài Khoản Roblox:";
        } else if(gameName === 'Liên Quân') {
            lbl.innerText = "Nhập Tên Nhân Vật Liên Quân:";
        } else {
            lbl.innerText = "Nhập ID Game (Free Fire):";
        }
    }

    function goToStep2() {
        let idVal = document.getElementById('txtId').value.trim();
        if(!idVal) {
            document.getElementById('errMsg').innerText = "Vui lòng nhập ID hoặc tên tài khoản!";
            return;
        }
        document.getElementById('errMsg').innerText = "";
        
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
        document.getElementById('infoText').innerText = `Game: ${currentGame} - ID: ${idVal}`;

        let container = document.getElementById('pkgContainer');
        container.innerHTML = "";
        
        let list = currentGame === 'Free Fire' ? ['10k = 110💎', '20k = 230💎', '50k = 600💎', '100k = 1300💎'] :
                   currentGame === 'Liên Quân' ? ['20k = 90 QH', '50k = 230 QH', '100k = 480 QH', '200k = 1000 QH'] :
                   ['20k = 160 Robux', '50k = 400 Robux', '100k = 850 Robux', '200k = 1800 Robux'];

        list.forEach(p => {
            let div = document.createElement('div');
            div.className = 'pkg-btn';
            div.innerText = p;
            div.onclick = function() {
                document.querySelectorAll('.pkg-btn').forEach(b => b.classList.remove('active'));
                div.classList.add('active');
                currentPkg = p;
            };
            container.appendChild(div);
        });
    }

    function goToStep1() {
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step1').classList.remove('hidden');
    }

    function finishOrder() {
        if(!currentPkg) {
            alert("Vui lòng chọn mốc nạp!");
            return;
        }
        alert("Giao dịch thành công!");
        location.reload();
    }
</script>

</body>
</html>
