<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - VIPER SHOP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 24, 38, 0.95); padding: 10px 12px; border-bottom: 1px solid #2a3b6c; margin-bottom: 12px; border-radius: 8px; font-size: 12px; }
        .nav-links { display: flex; gap: 10px; align-items: center; }
        .nav-links a { color: #cbd5e1; text-decoration: none; font-weight: bold; font-size: 11px; }
        .nav-links a:hover, .nav-links a.active { color: #00ffcc; }
        
        .welcome-card { background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; border-radius: 8px; padding: 14px; text-align: center; margin-bottom: 12px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .menu-btn { background: #0b0f19; border: 1px solid #2a3b6c; color: #00ffcc; padding: 14px 10px; border-radius: 8px; font-weight: bold; text-align: center; text-decoration: none; font-size: 12px; display: block; transition: 0.2s; }
        .menu-btn:hover { background: rgba(0, 255, 204, 0.1); border-color: #00ffcc; }
    </style>
</head>
<body>

<div class="container" style="max-width: 480px;">
    <div class="navbar">
        <div class="nav-links">
            <a href="index.html" class="active">Trang Chủ</a>
            <a href="goi-nap.html">Gói Nạp</a>
            <a href="nap-tien.html">Nạp Ví</a>
            <a href="lich-su.html">Lịch Sử</a>
        </div>
        <div>
            <span id="userBalance" style="color: #00ffcc; font-weight: bold; font-size: 12px;">0đ</span>
        </div>
    </div>

    <div class="welcome-card">
        <h3 style="color: #00ffcc; margin-bottom: 6px; font-size: 15px;">⚡ VIPER SHOP ⚡</h3>
        <p style="color: #cbd5e1; font-size: 12px;" id="welcomeMsg">Hệ thống nạp game tự động 24/7.</p>
    </div>

    <div class="menu-grid" id="menuGrid">
        <a href="goi-nap.html" class="menu-btn">🎮 Mua Gói Nạp</a>
        <a href="nap-tien.html" class="menu-btn">💳 Nạp Tiền Ví</a>
        <a href="lich-su.html" class="menu-btn">📜 Lịch Sử Đơn</a>
        <a href="admin.html" class="menu-btn" id="adminBtn" style="display: none; color: #ffaa00; border-color: #ffaa00;">🛠️ Quản Trị</a>
    </div>

    <div id="authArea" style="text-align: center; margin-top: 12px;"></div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        let authArea = document.getElementById('authArea');
        let balanceSpan = document.getElementById('userBalance');
        let adminBtn = document.getElementById('adminBtn');

        if (currentUser) {
            balanceSpan.innerText = Number(currentUser.balance || 0).toLocaleString('vi-VN') + 'đ';
            document.getElementById('welcomeMsg').innerText = "Xin chào, " + currentUser.username + "!";
            authArea.innerHTML = `<button onclick="handleLogout()" style="background: #ff3366; color: white; border: none; padding: 8px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 12px;">ĐĂNG XUẤT</button>`;

            if (currentUser.username === 'admin' || currentUser.isAdmin) {
                adminBtn.style.display = 'block';
            }
        } else {
            balanceSpan.innerText = "Chưa đăng nhập";
            authArea.innerHTML = `
                <a href="login.html" style="background: #00ffcc; color: #0b0f19; padding: 8px 16px; text-decoration: none; font-weight: bold; border-radius: 6px; font-size: 12px; display: inline-block; margin-right: 6px;">ĐĂNG NHẬP</a>
                <a href="register.html" style="background: #2a3b6c; color: white; padding: 8px 16px; text-decoration: none; font-weight: bold; border-radius: 6px; font-size: 12px; display: inline-block;">ĐĂNG KÝ</a>
            `;
        }
    });

    function handleLogout() {
        localStorage.removeItem('viper_current_user');
        alert("Đã đăng xuất tài khoản!");
        window.location.reload();
    }
</script>

</body>
</html>
