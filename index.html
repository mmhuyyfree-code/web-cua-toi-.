<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Hệ Thống Nạp Game Tự Động</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS bổ sung gọn gàng cho trang chủ */
        body { background: #0b0f19; color: #e2e8f0; font-family: Arial, sans-serif; padding: 15px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; background: rgba(18, 24, 38, 0.95); padding: 20px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); border: 1px solid #2a3b6c; }
        h2 { text-align: center; color: #00ffcc; margin-bottom: 15px; text-transform: uppercase; font-size: 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; background: #0b0f19; border: 1px solid #2a3b6c; border-radius: 6px; color: white; font-size: 14px; box-sizing: border-box; }
        input:focus, select:focus { border-color: #00ffcc; outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <!-- KHU VỰC HIỂN THỊ TÀI KHOẢN & VÍ -->
    <div id="accountBox" style="display: flex; justify-content: space-between; align-items: center; background: rgba(26, 34, 54, 0.9); padding: 10px 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #2a3b6c; font-size: 12px;">
        <div id="userInfo">
            <span style="color: #cbd5e1;">Tài khoản:</span> <b style="color: #ff007f;">Chưa đăng nhập</b>
        </div>
        <div id="userAction">
            <a href="login.html" style="color: #00ffcc; text-decoration: none; font-weight: bold; margin-right: 8px;">Đăng nhập</a>
            <a href="register.html" style="color: #ff007f; text-decoration: none; font-weight: bold;">Đăng ký</a>
        </div>
    </div>

    <h2>VIPER SHOP - NẠP GAME</h2>

    <form id="napForm">
        <div class="form-group">
            <label>Chọn Game:</label>
            <select id="gameSelect">
                <option value="Liên Quân Mobile">Liên Quân Mobile</option>
                <option value="Free Fire">Free Fire</option>
                <option value="Roblox">Roblox</option>
                <option value="Tốc Chiến">Tốc Chiến</option>
            </select>
        </div>

        <div class="form-group">
            <label>ID Nhân Vật / Tài khoản:</label>
            <input type="text" id="gameId" placeholder="Nhập ID trong game của bạn...">
        </div>

        <div class="form-group">
            <label>Chọn Gói Nạp:</label>
            <select id="packageSelect">
                <option value="Gói Thử Nghiệm - 20,000đ">Gói Thử Nghiệm - 20,000đ</option>
                <option value="Gói Sơ Cấp - 50,000đ">Gói Sơ Cấp - 50,000đ</option>
                <option value="Gói Trung Cấp - 100,000đ">Gói Trung Cấp - 100,000đ</option>
                <option value="Gói Cao Cấp - 200,000đ">Gói Cao Cấp - 200,000đ</option>
            </select>
        </div>

        <div class="form-group">
            <label>Phương thức thanh toán:</label>
            <select id="paymentMethod" onchange="togglePaymentFields()">
                <option value="Số dư ví (Khuyên dùng)">Số dư ví trên web</option>
                <option value="Chuyển khoản QR">Chuyển khoản Ngân hàng / Momo</option>
                <option value="Thẻ cào điện thoại">Thẻ cào điện thoại</option>
            </select>
        </div>

        <!-- Khung nhập thẻ cào (Ẩn/Hiện theo phương thức) -->
        <div id="cardFields" style="display: none; background: rgba(11, 15, 25, 0.8); padding: 10px; border-radius: 6px; border: 1px dashed #ff007f; margin-bottom: 12px;">
            <div class="form-group" style="margin-bottom: 8px;">
                <label>Loại thẻ:</label>
                <select id="cardType">
                    <option value="Viettel">Viettel</option>
                    <option value="Mobifone">Mobifone</option>
                    <option value="Vinaphone">Vinaphone</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 8px;">
                <label>Mã Thẻ (PIN):</label>
                <input type="text" id="cardCode" placeholder="Nhập mã thẻ cào...">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>Số Seri:</label>
                <input type="text" id="cardSerial" placeholder="Nhập số seri...">
            </div>
        </div>

        <button type="button" onclick="submitOrder()" style="background: linear-gradient(135deg, #00ffcc, #0072ff); color: #0b0f19; font-weight: bold; margin-top: 5px;">XÁC NHẬN NẠP NGAY</button>
    </form>

    <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button type="button" onclick="window.location.href='admin.html'" style="background: #2a3b6c; color: #ffffff; font-size: 12px;">🛠 Trang Quản Lý</button>
    </div>
</div>

<script>
    // Kiểm tra và hiển thị trạng thái tài khoản khi tải trang
    window.addEventListener('DOMContentLoaded', () => {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        let userInfo = document.getElementById("userInfo");
        let userAction = document.getElementById("userAction");

        if (currentUser) {
            userInfo.innerHTML = `👤 <b style="color: #00ffcc;">${currentUser.username}</b> | Ví: <b style="color: #ffaa00;">${Number(currentUser.balance || 0).toLocaleString('vi-VN')}đ</b>`;
            userAction.innerHTML = `<button type="button" onclick="logout()" style="background: #ff3366; color: white; padding: 4px 8px; font-size: 11px; width: auto; margin-top: 0; border: none; border-radius: 4px; cursor: pointer;">Đăng xuất</button>`;
        }
    });

    function logout() {
        localStorage.removeItem('viper_current_user');
        alert("Đã đăng xuất tài khoản!");
        location.reload();
    }

    // Ẩn hiện khung thẻ cào tùy theo phương thức thanh toán
    function togglePaymentFields() {
        let method = document.getElementById("paymentMethod").value;
        let cardFields = document.getElementById("cardFields");
        if (method === "Thẻ cào điện thoại") {
            cardFields.style.display = "block";
        } else {
            cardFields.style.display = "none";
        }
    }

    // Xử lý gửi đơn nạp
    function submitOrder() {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        let game = document.getElementById("gameSelect").value;
        let fullId = document.getElementById("gameId").value.trim();
        let pkg = document.getElementById("packageSelect").value;
        let payment = document.getElementById("paymentMethod").value;

        if (!fullId) {
            alert("Vui lòng nhập ID nhân vật hoặc tài khoản trong game!");
            return;
        }

        let cardData = null;
        if (payment === "Thẻ cào điện thoại") {
            let cardType = document.getElementById("cardType").value;
            let cardCode = document.getElementById("cardCode").value.trim();
            let cardSerial = document.getElementById("cardSerial").value.trim();

            if (!cardCode || !cardSerial) {
                alert("Vui lòng nhập đầy đủ Mã thẻ và Số Seri!");
                return;
            }
            cardData = { cardType, cardCode, cardSerial };
        }

        // Tạo thông tin đơn hàng
        let orderItem = {
            username: currentUser ? currentUser.username : "Khách vãng lai",
            game: game,
            fullId: fullId,
            package: pkg,
            payment: payment,
            card: cardData,
            status: "Chờ xử lý",
            time: new Date().toLocaleString('vi-VN')
        };

        // Lưu vào danh sách đơn chung (để trang admin.html quản lý)
        let history = JSON.parse(localStorage.getItem('viper_history')) || [];
        history.unshift(orderItem);
        localStorage.setItem('viper_history', JSON.stringify(history));

        alert("Gửi đơn hàng thành công! Đơn của bạn đang chờ hệ thống xử lý.");
        document.getElementById("napForm").reset();
        togglePaymentFields();
    }
</script>

</body>
</html>
