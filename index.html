<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Hệ Thống Nạp Game Tự Động</title>
    <style>
        .marquee-container {
            background: linear-gradient(90deg, #ff007f, #7928ca);
            color: #ffffff;
            padding: 9px 0;
            overflow: hidden;
            white-space: nowrap;
            position: fixed;
            top: 0; left: 0; width: 100%;
            z-index: 1000;
            border-bottom: 2px solid #00ffcc;
            font-size: 13px; font-weight: bold;
        }
        .marquee-text {
            display: inline-block;
            animation: marquee 28s linear infinite;
        }
        .marquee-text span { margin-right: 60px; }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        body {
            background: #0b0f19 url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 60px 0 20px 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.85); z-index: -1;
        }
        .container {
            background: rgba(18, 24, 38, 0.95);
            width: 100%; max-width: 450px; padding: 25px;
            border-radius: 16px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            border: 2px solid #00ffcc; box-sizing: border-box;
        }
        h2 {
            text-align: center; margin-bottom: 10px; font-size: 26px;
            color: #ffffff; text-shadow: 0 0 10px #00ffcc; cursor: pointer;
        }
        .promo-banner {
            background: linear-gradient(135deg, #00ffcc, #0072ff);
            color: #0b0f19; padding: 12px; border-radius: 10px;
            text-align: center; font-size: 13px; font-weight: 800; margin-bottom: 20px;
        }
        .game-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px;
        }
        .game-card {
            background: rgba(26, 34, 54, 0.9); border: 2px solid #2a3b6c;
            border-radius: 10px; text-align: center; padding: 12px 6px;
            cursor: pointer; font-weight: bold; font-size: 13px; color: #ffffff;
        }
        .game-card.selected {
            border-color: #00ffcc; background: linear-gradient(135deg, #00ffcc, #0072ff);
            color: #0b0f19; box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: #e2e8f0; font-weight: 600; font-size: 13px; }
        input {
            width: 100%; padding: 12px; background: rgba(11, 15, 25, 0.9);
            border: 1px solid #2a3b6c; border-radius: 8px; box-sizing: border-box;
            color: #ffffff; font-size: 14px; outline: none;
        }
        button {
            width: 100%; background: linear-gradient(135deg, #00ffcc, #00bfff);
            color: #0b0f19; border: none; padding: 14px; border-radius: 8px;
            font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
        .history-box {
            margin-top: 20px; border-top: 1px solid #2a3b6c; padding-top: 15px;
        }
        .history-item {
            display: flex; justify-content: space-between; padding: 6px 0;
            font-size: 12px; color: #cbd5e1; border-bottom: 1px dashed #1e293b;
        }
        .status-success { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>

<div class="marquee-container">
    <div class="marquee-text">
        <span>⚡ VIPER: ID ***6789 vừa nạp thành công 50k = 600 Kim Cương (Free Fire)</span>
        <span>🔥 VIPER: Tài khoản ***4321 vừa nhận 50k = 230 Quân Huy (Liên Quân Mobile)</span>
    </div>
</div>

<div class="container">
    <h2 onclick="checkAdmin()">⚡ VIPER SHOP ⚡</h2>
    
    <div class="promo-banner">🔥 SIÊU KHUYẾN MÃI: X2 Kim Cương & Quân Huy lần đầu!</div>

    <div class="form-group">
        <label>Chọn tựa game cần nạp:</label>
        <div class="game-grid">
            <div class="game-card selected" onclick="selectGame('Free Fire', this)">Free Fire</div>
            <div class="game-card" onclick="selectGame('Liên Quân', this)">Liên Quân</div>
            <div class="game-card" onclick="selectGame('Roblox', this)">Roblox</div>
        </div>
    </div>

    <div class="form-group">
        <label id="idLabel">Nhập ID Game:</label>
        <input type="text" id="gameId" placeholder="Nhập ID (8-11 số)...">
    </div>
    
    <button type="button" onclick="goToCheckout()">TIẾP TỤC</button>
    <p id="errorMsg" style="color: #ff3366; font-size: 13px; margin-top: 6px; font-weight: bold; text-align: center;"></p>

    <div class="history-box">
        <div style="font-size: 13px; font-weight: bold; color: #94a3b8; margin-bottom: 8px;">📋 Giao Dịch Gần Đây</div>
        <div id="historyList"></div>
    </div>
</div>

<script>
    let selectedGame = "Free Fire";
    let clickCount = 0;

    window.onload = function() {
        renderHistory();
    };

    function checkAdmin() {
        clickCount++;
        if (clickCount >= 3) {
            let pin = prompt("Nhập mã PIN Admin:");
            if (pin === "8888") {
                window.location.href = "admin.html"; // Chuyển sang trang quản trị riêng biệt
            } else if(pin !== null) {
                alert("Mã PIN không đúng!");
            }
            clickCount = 0;
        }
    }

    function selectGame(gameName, el) {
        selectedGame = gameName;
        document.querySelectorAll(".game-card").forEach(c => c.classList.remove("selected"));
        el.classList.add("selected");
        
        let label = document.getElementById("idLabel");
        let inputField = document.getElementById("gameId");
        
        if(selectedGame === 'Roblox') {
            label.innerText = "Nhập Tên Tài Khoản Roblox:";
            inputField.placeholder = "Nhập tên tài khoản...";
        } else if(selectedGame === 'Liên Quân') {
            label.innerText = "Nhập Tên Nhân Vật Liên Quân:";
            inputField.placeholder = "Nhập tên nhân vật...";
        } else {
            label.innerText = "Nhập ID Game (Free Fire):";
            inputField.placeholder = "Nhập ID (8-11 số)...";
        }
    }

    function goToCheckout() {
        let gameId = document.getElementById("gameId").value.trim();
        let errorMsg = document.getElementById("errorMsg");

        if (!gameId) {
            errorMsg.innerText = "❌ Vui lòng nhập ID hoặc tên tài khoản!";
            return;
        }

        // Lưu thông tin tạm qua localStorage để trang thanh toán đọc dữ liệu
        localStorage.setItem("viper_checkout", JSON.stringify({
            game: selectedGame,
            fullId: gameId
        }));

        // Chuyển sang trang nạp tiền độc lập
        window.location.href = "nap.html";
    }

    function renderHistory() {
        let history = JSON.parse(localStorage.getItem('viper_history')) || [
            { game: 'Free Fire', fullId: '***6789', package: '50k = 600💎' },
            { game: 'Liên Quân', fullId: '***4321', package: '50k = 230 QH' }
        ];

        let historyList = document.getElementById("historyList");
        historyList.innerHTML = "";

        history.slice(0, 3).forEach(item => {
            let maskedId = item.fullId.length > 4 ? "***" + item.fullId.slice(-4) : "***" + item.fullId;
            let div = document.createElement("div");
            div.className = "history-item";
            div.innerHTML = `<span>[${item.game}] ID: ${maskedId} - ${item.package}</span> <span class="status-success">Thành công</span>`;
            historyList.appendChild(div);
        });
    }
</script>

</body>
</html>
