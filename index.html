<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Hệ Thống Nạp Game Tự Động</title>
    <!-- Liên kết file CSS chung -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Nhấn đúng 8 lần vào chữ VIPER SHOP để hiện bảng nhập pass (Mã: 30911) -->
        <h2 onclick="handleAdminClick()" style="cursor: pointer; user-select: none;" title="Khu vực quản trị">⚡ VIPER SHOP ⚡</h2>
        
        <!-- Banner Khuyến Mãi -->
        <div class="promo-banner" style="background: linear-gradient(135deg, #00ffcc, #0072ff); color: #0b0f19; padding: 10px; border-radius: 10px; text-align: center; font-weight: bold; font-size: 12px; margin-bottom: 12px; box-shadow: 0 0 15px rgba(0,255,204,0.3);">
            🔥 SIÊU KHUYẾN MÃI: X2 Kim Cương & Quân Huy lần đầu!
        </div>

        <!-- Đồng hồ Flash Sale -->
        <div class="flash-sale-box" style="background: rgba(26, 34, 54, 0.9); border: 1px dashed #ff007f; padding: 8px; border-radius: 10px; text-align: center; margin-bottom: 15px;">
            <div style="font-size: 11px; color: #cbd5e1; margin-bottom: 2px;">⚡ FLASH SALE KẾT THÚC TRONG:</div>
            <div id="countdownTimer" style="font-size: 16px; font-weight: bold; color: #00ffcc;">02:45:28</div>
        </div>

        <!-- Chọn tựa game dạng nút khối -->
        <div class="form-group">
            <label>Chọn tựa game cần nạp:</label>
            <div class="game-select-grid" style="display: flex; gap: 8px; margin-top: 5px;">
                <button type="button" class="game-btn active" onclick="selectGame('Free Fire', this)" style="flex: 1; background: #00ffcc; color: #0b0f19; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer;">Free Fire</button>
                <button type="button" class="game-btn" onclick="selectGame('Liên Quân', this)" style="flex: 1; background: rgba(26, 34, 54, 0.9); color: #cbd5e1; border: 1px solid #2a3b6c; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer;">Liên Quân</button>
                <button type="button" class="game-btn" onclick="selectGame('Roblox', this)" style="flex: 1; background: rgba(26, 34, 54, 0.9); color: #cbd5e1; border: 1px solid #2a3b6c; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer;">Roblox</button>
            </div>
            <!-- Input ẩn lưu giá trị game đang chọn -->
            <input type="hidden" id="gameSelect" value="Free Fire">
        </div>

        <div class="form-group">
            <label for="playerId">Nhập ID Game:</label>
            <input type="text" id="playerId" placeholder="8686756656">
        </div>

        <button type="button" onclick="goToCheckout()">TIẾP TỤC</button>

        <!-- Tra cứu trạng thái đơn hàng -->
        <div class="form-group" style="margin-top: 15px;">
            <label style="color: #00ffcc; font-size: 12px;">🔍 Tra Cứu Trạng Thái Đơn Hàng:</label>
            <div style="display: flex; gap: 8px; margin-top: 5px;">
                <input type="text" id="searchOrderId" placeholder="Nhập ID game cần tìm..." style="margin-top: 0; font-size: 12px;">
                <button type="button" onclick="searchOrder()" style="width: 90px; margin-top: 0; padding: 0; background: #00ffcc; color: #0b0f19; font-weight: bold; font-size: 12px;">Tra cứu</button>
            </div>
        </div>
        
        <!-- Phần lịch sử giao dịch gần đây chuẩn giao diện gốc -->
        <div class="recent-transactions" style="margin-top: 15px; border-top: 1px dashed rgba(0, 255, 204, 0.3); padding-top: 12px;">
            <div style="font-size: 13px; color: #00ffcc; margin-bottom: 8px; font-weight: bold;">📜 Giao Dịch Gần Đây</div>
            <div id="homeHistoryList" style="font-size: 12px; color: #cbd5e1; max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;">
                <div style="text-align: center; color: #94a3b8; padding: 5px;">Chưa có giao dịch nào gần đây.</div>
            </div>
        </div>

        <div class="note" style="margin-top: 12px;">Hệ thống nạp thẻ tự động 24/7 - Uy tín, an toàn, nhanh chóng.</div>
    </div>

    <!-- Widget hỗ trợ nhanh -->
    <div class="support-widget">
        <div class="support-tooltip">💬 Cần hỗ trợ nạp tiền? Chat ngay!</div>
        <a href="https://zalo.me" target="_blank" class="support-btn" title="Hỗ trợ 24/7">💬</a>
    </div>

    <script>
        window.onload = function() {
            loadHomeHistory();
            startCountdown(2 * 3600 + 45 * 60 + 28); // Giữ đồng hồ đếm ngược
        };

        // Hàm chọn game dạng nút khối
        function selectGame(gameName, el) {
            document.getElementById("gameSelect").value = gameName;
            document.querySelectorAll(".game-btn").forEach(btn => {
                btn.style.background = "rgba(26, 34, 54, 0.9)";
                btn.style.color = "#cbd5e1";
                btn.style.border = "1px solid #2a3b6c";
            });
            el.style.background = "#00ffcc";
            el.style.color = "#0b0f19";
            el.style.border = "none";
        }

        function goToCheckout() {
            let game = document.getElementById("gameSelect").value;
            let fullId = document.getElementById("playerId").value.trim();
            if (!fullId) { 
                alert("Vui lòng nhập ID nhân vật!"); 
                return; 
            }
            localStorage.setItem("viper_checkout", JSON.stringify({ game: game, fullId: fullId }));
            window.location.href = "nap.html";
        }

        // Tính năng tra cứu đơn hàng ngay tại trang chủ
        function searchOrder() {
            let keyword = document.getElementById("searchOrderId").value.trim();
            if (!keyword) { alert("Vui lòng nhập ID game cần tra cứu!"); return; }
            let history = JSON.parse(localStorage.getItem('viper_history')) || [];
            let found = history.filter(item => item.fullId.includes(keyword));
            if (found.length > 0) {
                alert(`Tìm thấy ${found.length} giao dịch cho ID: ${keyword}\nGói gần nhất: ${found[0].package} (${found[0].time})`);
            } else {
                alert("Không tìm thấy giao dịch nào với ID này!");
            }
        }

        // Tải lịch sử giao dịch ra trang chủ đúng chuẩn Ảnh 2
        function loadHomeHistory() {
            let history = JSON.parse(localStorage.getItem('viper_history')) || [];
            let container = document.getElementById("homeHistoryList");
            if (history.length === 0) return;

            container.innerHTML = "";
            let recent = history.slice(0, 3);
            recent.forEach(item => {
                let div = document.createElement("div");
                div.style.background = "rgba(18, 24, 38, 0.8)";
                div.style.border = "1px solid #2a3b6c";
                div.style.padding = "8px 10px";
                div.style.borderRadius = "8px";
                div.style.display = "flex";
                div.style.justifyContent = "space-between";
                div.style.alignItems = "center";
                div.innerHTML = `
                    <span><b>[${item.game}]</b> ID: <span style="color:#00ffcc">${item.fullId}</span></span>
                    <span style="color: #ff007f; font-weight: bold;">${item.package}</span>
                `;
                container.appendChild(div);
            });
        }

        // Đồng hồ đếm ngược Flash Sale tự động chạy
        function startCountdown(duration) {
            let timer = duration, hours, minutes, seconds;
            setInterval(function () {
                hours = parseInt(timer / 3600, 10);
                minutes = parseInt((timer % 3600) / 60, 10);
                seconds = parseInt(timer % 60, 10);

                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                document.getElementById("countdownTimer").textContent = hours + ":" + minutes + ":" + seconds;

                if (--timer < 0) {
                    timer = 0;
                }
            }, 1000);
        }

        // Cơ chế đếm đúng 8 lần nhấn để mở bảng nhập pass (Mã: 30911)
        let adminClickCount = 0;
        function handleAdminClick() {
            adminClickCount++;
            if (adminClickCount >= 8) {
                adminClickCount = 0; 
                let pin = prompt("Nhập mã PIN quản trị viên:");
                if (pin === "30911") { 
                    window.location.href = "admin.html"; 
                } else if (pin !== null) { 
                    alert("Mã PIN không chính xác!"); 
                }
            }
        }
    </script>

</body>
</html>
