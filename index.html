<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - VIPER SHOP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="max-width: 480px;">
    <div class="navbar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <div class="nav-links">
            <a href="index.html" style="color: #00ffcc; text-decoration: none; margin-right: 10px; font-weight: bold;">Trang Chủ</a>
            <a href="goi-nap.html" style="color: #cbd5e1; text-decoration: none; margin-right: 10px; font-weight: bold;">Gói Nạp</a>
            <a href="nap-tien.html" style="color: #cbd5e1; text-decoration: none; margin-right: 10px; font-weight: bold;">Nạp Ví</a>
            <a href="lich-su.html" style="color: #cbd5e1; text-decoration: none; font-weight: bold;">Lịch Sử</a>
        </div>
        <div>
            <span id="userBalance" style="color: #00ffcc; font-weight: bold;">0đ</span>
        </div>
    </div>

    <div style="background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 15px;">
        <h3 style="color: #00ffcc; margin-bottom: 5px;">⚡ VIPER SHOP ⚡</h3>
        <p style="color: #cbd5e1; font-size: 13px;" id="welcomeMsg">Hệ thống nạp game tự động 24/7.</p>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
        <a href="goi-nap.html" style="background: #0b0f19; border: 1px solid #2a3b6c; color: #00ffcc; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; text-decoration: none; display: block;">🎮 Mua Gói Nạp</a>
        <a href="nap-tien.html" style="background: #0b0f19; border: 1px solid #2a3b6c; color: #00ffcc; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; text-decoration: none; display: block;">💳 Nạp Tiền Ví</a>
        <a href="lich-su.html" style="background: #0b0f19; border: 1px solid #2a3b6c; color: #00ffcc; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; text-decoration: none; display: block;">📜 Lịch Sử Đơn</a>
        <a href="admin.html" style="background: #0b0f19; border: 1px solid #2a3b6c; color: #ffaa00; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; text-decoration: none; display: block;">🛠️ Trang Quản Trị</a>
    </div>

    <div id="authArea" style="text-align: center;"></div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        let authArea = document.getElementById('authArea');
        let balanceSpan = document.getElementById('userBalance');

        if (currentUser) {
            balanceSpan.innerText = Number(currentUser.balance || 0).toLocaleString('vi-VN') + 'đ';
            document.getElementById('welcomeMsg').innerText = "Xin chào, " + currentUser.username + "!";
            authArea.innerHTML = `<button onclick="handleLogout()" style="background: #ff3366; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer;">ĐĂNG XUẤT</button>`;
        } else {
            balanceSpan.innerText = "Chưa đăng nhập";
            authArea.innerHTML = `
                <a href="login.html" style="background: #00ffcc; color: #0b0f19; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 5px; display: inline-block; margin-right: 10px;">ĐĂNG NHẬP</a>
                <a href="register.html" style="background: #2a3b6c; color: white; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 5px; display: inline-block;">ĐĂNG KÝ</a>
            `;
        }
    });

    function handleLogout() {
        localStorage.removeItem('viper_current_user');
        alert("Đã đăng xuất tài khoản!");
        window.location.reload();
    }
</script>

</body>
</html>
