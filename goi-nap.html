<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Chọn Gói Nạp</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 24, 38, 0.95); padding: 10px 15px; border-bottom: 1px solid #2a3b6c; margin-bottom: 15px; border-radius: 8px; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 10px; font-size: 12px; font-weight: bold; }
        .nav-links a:hover, .nav-links a.active { color: #00ffcc; }
        
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .game-btn { background: #0b0f19; border: 1px solid #2a3b6c; color: #cbd5e1; padding: 10px; border-radius: 6px; text-align: center; cursor: pointer; font-weight: bold; font-size: 12px; }
        .game-btn.active { border-color: #00ffcc; color: #00ffcc; background: rgba(0,255,204,0.05); }

        .package-card { background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .package-card.active { border-color: #00ffcc; background: rgba(0,255,204,0.08); }
        .btn-submit { width: 100%; padding: 12px; background: #00ffcc; color: #0b0f19; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container" style="max-width: 450px;">
    <div class="navbar">
        <div class="nav-links">
            <a href="index.html">Trang Chủ</a>
            <a href="goi-nap.html" class="active">Gói Nạp</a>
            <a href="nap-tien.html">Nạp Ví</a>
            <a href="lich-su.html">Lịch Sử</a>
        </div>
        <div>
            <span id="userNameDisplay" style="color: #00ffcc; font-size: 11px; font-weight: bold;"></span>
            (<span id="userBalanceDisplay" style="color: #ffaa00; font-size: 11px;">0đ</span>)
        </div>
    </div>

    <h3 style="color: #00ffcc; text-align: center; margin-bottom: 15px;">CHỌN GÓI NẠP GAME</h3>

    <div style="margin-bottom: 10px; font-size: 12px; color: #cbd5e1;">1. Chọn Tựa Game:</div>
    <div class="game-grid">
        <div class="game-btn active" onclick="selectGame('Liên Quân Mobile', this)">Liên Quân Mobile</div>
        <div class="game-btn" onclick="selectGame('Free Fire', this)">Free Fire</div>
        <div class="game-btn" onclick="selectGame('Roblox', this)">Roblox</div>
        <div class="game-btn" onclick="selectGame('Tốc Chiến', this)">Tốc Chiến</div>
    </div>

    <div style="margin-bottom: 10px; font-size: 12px; color: #cbd5e1;">2. Nhập ID Nhân Vật / Tài Khoản:</div>
    <input type="text" id="playerId" placeholder="Nhập ID trong game của bạn..." style="width: 100%; padding: 9px; background: #0b0f19; border: 1px solid #2a3b6c; color: white; border-radius: 6px; font-size: 12px; margin-bottom: 12px; box-sizing: border-box;">

    <div style="margin-bottom: 10px; font-size: 12px; color: #cbd5e1;">3. Chọn Gói Nạp:</div>
    
    <!-- Đã đổi tên các gói sơ cấp thành các mệnh giá chuẩn chuyên nghiệp -->
    <div class="package-card active" onclick="selectPackage('Gói 50.000 VNĐ', 50000, this)">
      <div><b>Gói 50K Quân Huy / Kim Cương</b></div>
      <div style="color: #00ffcc; font-weight: bold;">50.000đ</div>
    </div>
    <div class="package-card" onclick="selectPackage('Gói 100.000 VNĐ', 100000, this)">
      <div><b>Gói 100K Quân Huy / Kim Cương</b></div>
      <div style="color: #00ffcc; font-weight: bold;">100.000đ</div>
    </div>
    <div class="package-card" onclick="selectPackage('Gói 200.000 VNĐ', 200000, this)">
      <div><b>Gói 200K Quân Huy / Kim Cương</b></div>
      <div style="color: #00ffcc; font-weight: bold;">200.000đ</div>
    </div>

    <button class="btn-submit" onclick="buyPackage()">XÁC NHẬN NẠP NGAY</button>
</div>

<script>
    let selectedGame = "Liên Quân Mobile";
    let selectedPackageName = "Gói 50.000 VNĐ";
    let selectedPackagePrice = 50000;
    let currentUser = null;

    window.addEventListener('DOMContentLoaded', () => {
        currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        if (!currentUser) {
            alert("Vui lòng đăng nhập trước khi mua gói!");
            window.location.href = "login.html";
            return;
        }
        document.getElementById('userNameDisplay').innerText = currentUser.username;
        document.getElementById('userBalanceDisplay').innerText = Number(currentUser.balance || 0).toLocaleString('vi-VN') + "đ";
    });

    function selectGame(gameName, element) {
        document.querySelectorAll('.game-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        selectedGame = gameName;
    }

    function selectPackage(packageName, price, element) {
        document.querySelectorAll('.package-card').forEach(card => card.classList.remove('active'));
        element.classList.add('active');
        selectedPackageName = packageName;
        selectedPackagePrice = price;
    }

    function buyPackage() {
        let playerId = document.getElementById('playerId').value.trim();
        if (!playerId) {
            alert("Vui lòng nhập ID nhân vật trong game!");
            return;
        }

        let currentBalance = Number(currentUser.balance || 0);
        if (currentBalance < selectedPackagePrice) {
            alert("❌ Số dư trong ví của bạn không đủ! Vui lòng nạp thêm tiền vào ví.");
            window.location.href = "nap-tien.html";
            return;
        }

        // Trừ tiền trong ví
        currentUser.balance = currentBalance - selectedPackagePrice;
        localStorage.setItem('viper_current_user', JSON.stringify(currentUser));

        // Cập nhật lại danh sách user tổng nếu có lưu
        let users = JSON.parse(localStorage.getItem('viper_users')) || [];
        users = users.map(u => u.username === currentUser.username ? currentUser : u);
        localStorage.setItem('viper_users', JSON.stringify(users));

        // Lưu đơn hàng vào lịch sử với trạng thái chờ xử lý
        let newOrder = {
            id: 'ORD_' + Date.now(),
            username: currentUser.username,
            game: selectedGame,
            package: selectedPackageName,
            price: selectedPackagePrice,
            playerId: playerId,
            status: 'pending',
            time: new Date().toLocaleString('vi-VN')
        };

        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
        orders.unshift(newOrder);
        localStorage.setItem('viper_orders', JSON.stringify(orders));

        alert("✅ Đặt lệnh nạp thành công! Đang chuyển đến lịch sử giao dịch...");
        window.location.href = "lich-su.html";
    }
</script>

</body>
</html>
