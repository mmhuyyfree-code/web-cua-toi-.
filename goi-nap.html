<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Chọn Gói Nạp</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 24, 38, 0.95); padding: 10px 15px; border-bottom: 1px solid #2a3b6c; margin-bottom: 12px; border-radius: 8px; font-size: 12px; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-right: 8px; font-weight: bold; }
        .nav-links a:hover, .nav-links a.active { color: #00ffcc; }
        
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .game-btn { background: #0b0f19; border: 1px solid #2a3b6c; color: #cbd5e1; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; font-size: 13px; transition: 0.2s; }
        .game-btn.active { background: #00ffcc; color: #0b0f19; border-color: #00ffcc; }

        .package-item { background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .package-item.active { border-color: #00ffcc; background: rgba(0, 255, 204, 0.1); }
        .pkg-name { font-weight: bold; color: #fff; font-size: 13px; }
        .pkg-price { color: #00ffcc; font-weight: bold; font-size: 13px; }

        .main-container { max-height: 400px; overflow-y: auto; padding-right: 4px; }
        .main-container::-webkit-scrollbar { width: 5px; }
        .main-container::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container" style="max-width: 480px;">
    <div class="navbar">
        <div class="nav-links">
            <a href="index.html">Trang Chủ</a>
            <a href="goi-nap.html" class="active">Gói Nạp</a>
            <a href="nap-tien.html">Nạp Ví</a>
            <a href="lich-su.html">Lịch Sử</a>
        </div>
        <div>
            <span id="userInfo" style="color: #00ffcc; font-weight: bold;">User (0đ)</span>
        </div>
    </div>

    <h3 style="color: #00ffcc; text-align: center; margin-bottom: 10px; font-size: 15px;">CHỌN GÓI NẠP GAME</h3>

    <div class="main-container">
        <div style="font-size: 12px; color: #cbd5e1; margin-bottom: 6px; font-weight: bold;">1. Chọn Tựa Game:</div>
        <div class="game-grid">
            <button class="game-btn active" onclick="selectGame('Liên Quân Mobile', this)">Liên Quân Mobile</button>
            <button class="game-btn" onclick="selectGame('Free Fire', this)">Free Fire</button>
            <button class="game-btn" onclick="selectGame('Roblox', this)">Roblox</button>
            <button class="game-btn" onclick="selectGame('Tốc Chiến', this)">Tốc Chiến</button>
        </div>

        <div class="form-group" style="margin-bottom: 10px;">
            <label style="font-size: 12px; font-weight: bold;">2. Nhập ID Nhân Vật / Tài Khoản:</label>
            <input type="text" id="playerId" placeholder="Nhập ID trong game của bạn..." style="padding: 8px; font-size: 12px;">
        </div>

        <div style="font-size: 12px; color: #cbd5e1; margin-bottom: 6px; font-weight: bold;">3. Chọn Gói Vật Phẩm:</div>
        <div id="packageList">
            <div class="package-item active" onclick="selectPackage('180 Quân Huy', 20000, this)">
                <span class="pkg-name">180 🛡️ Quân Huy</span>
                <span class="pkg-price">20.000đ</span>
            </div>
            <div class="package-item" onclick="selectPackage('460 Quân Huy', 50000, this)">
                <span class="pkg-name">460 🛡️ Quân Huy</span>
                <span class="pkg-price">50.000đ</span>
            </div>
            <div class="package-item" onclick="selectPackage('1.000 Quân Huy', 100000, this)">
                <span class="pkg-name">1.000 🛡️ Quân Huy</span>
                <span class="pkg-price">100.000đ</span>
            </div>
            <div class="package-item" onclick="selectPackage('2.300 Quân Huy', 200000, this)">
                <span class="pkg-name">2.300 🛡️ Quân Huy</span>
                <span class="pkg-price">200.000đ</span>
            </div>
            <div class="package-item" onclick="selectPackage('6.000 Quân Huy', 500000, this)">
                <span class="pkg-name">6.000 🛡️ Quân Huy</span>
                <span class="pkg-price">500.000đ</span>
            </div>
        </div>
    </div>

    <button type="button" onclick="submitOrder()" style="background: #00ffcc; color: #0b0f19; font-weight: bold; margin-top: 10px; padding: 10px; font-size: 14px;">XÁC NHẬN NẠP NGAY</button>
</div>

<script>
    let selectedGame = 'Liên Quân Mobile';
    let selectedPackageName = '180 Quân Huy';
    let selectedPrice = 20000;

    window.addEventListener('DOMContentLoaded', () => {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        if (!currentUser) {
            alert("Vui lòng đăng nhập trước khi mua gói!");
            window.location.href = "login.html";
            return;
        }
        document.getElementById('userInfo').innerText = `${currentUser.username} (${Number(currentUser.balance || 0).toLocaleString('vi-VN')}đ)`;
    });

    function selectGame(game, element) {
        selectedGame = game;
        document.querySelectorAll('.game-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
    }

    function selectPackage(name, price, element) {
        selectedPackageName = name;
        selectedPrice = price;
        document.querySelectorAll('.package-item').forEach(item => item.classList.remove('active'));
        element.classList.add('active');
    }

    function submitOrder() {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        let playerId = document.getElementById('playerId').value.trim();

        if (!playerId) {
            alert("Vui lòng nhập ID nhân vật hoặc tài khoản game!");
            return;
        }

        if ((currentUser.balance || 0) < selectedPrice) {
            alert("Số dư ví không đủ! Vui lòng nạp thêm tiền vào ví.");
            window.location.href = "nap-tien.html";
            return;
        }

        if (confirm(`Xác nhận mua gói [${selectedPackageName}] cho game ${selectedGame} với giá ${selectedPrice.toLocaleString('vi-VN')}đ?`)) {
            // Trừ tiền tài khoản hiện tại
            currentUser.balance -= selectedPrice;
            localStorage.setItem('viper_current_user', JSON.stringify(currentUser));

            // Cập nhật kho users chung
            let users = JSON.parse(localStorage.getItem('viper_users')) || [];
            let uIndex = users.findIndex(u => u.username === currentUser.username);
            if (uIndex !== -1) {
                users[uIndex].balance = currentUser.balance;
                localStorage.setItem('viper_users', JSON.stringify(users));
            }

            // Lưu đơn hàng vào hệ thống để Admin duyệt
            let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
            let newOrder = {
                username: currentUser.username,
                game: selectedGame,
                package: selectedPackageName,
                playerId: playerId,
                price: selectedPrice,
                status: 'Chờ xử lý',
                time: new Date().toLocaleString('vi-VN')
            };
            orders.push(newOrder);
            localStorage.setItem('viper_orders', JSON.stringify(orders));

            alert("Đặt mua thành công! Đơn hàng của bạn đang chờ Admin xử lý.");
            window.location.href = "lich-su.html";
        }
    }
</script>

</body>
</html>
