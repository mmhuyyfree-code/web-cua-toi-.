<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Chọn Gói Nạp</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 24, 38, 0.95); padding: 10px 15px; border-bottom: 1px solid #2a3b6c; margin-bottom: 15px; border-radius: 8px; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 10px; font-size: 12px; font-weight: bold; }
        .nav-links a:hover, .nav-links a.active { color: #00ffcc; }
        
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .game-btn { background: #0b0f19; border: 1px solid #2a3b6c; color: #cbd5e1; padding: 10px; border-radius: 6px; text-align: center; cursor: pointer; font-weight: bold; font-size: 12px; }
        .game-btn.active { border-color: #00ffcc; color: #00ffcc; background: rgba(0,255,204,0.05); }

        .package-container { max-height: 260px; overflow-y: auto; padding-right: 4px; margin-bottom: 10px; }
        .package-container::-webkit-scrollbar { width: 4px; }
        .package-container::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 4px; }

        .package-card { background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; border-radius: 8px; padding: 11px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .package-card.active { border-color: #00ffcc; background: rgba(0,255,204,0.08); }
        .btn-submit { width: 100%; padding: 12px; background: #00ffcc; color: #0b0f19; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" style="max-width: 450px;">
    <div class="navbar">
        <div class="nav-links">
            <a href="index.html">Trang Chủ</a>
            <a href="goi-nap.html" class="active">Gói Nạp</a>
            <a href="nap-tien.html">Nạp Ví</a>
            <a href="lich-su.html">Lịch Sử</a>
        </div>
        <div>
            <span id="userNameDisplay" style="color: #00ffcc; font-size: 11px; font-weight: bold;"></span>
            (<span id="userBalanceDisplay" style="color: #ffaa00; font-size: 11px;">0đ</span>)
        </div>
    </div>

    <h3 style="color: #00ffcc; text-align: center; margin-bottom: 15px;">CHỌN GÓI NẠP GAME</h3>

    <div style="margin-bottom: 8px; font-size: 12px; color: #cbd5e1;">1. Chọn Tựa Game:</div>
    <div class="game-grid">
        <div class="game-btn active" onclick="changeGame('Liên Quân Mobile', this)">Liên Quân Mobile</div>
        <div class="game-btn" onclick="changeGame('Free Fire', this)">Free Fire</div>
        <div class="game-btn" onclick="changeGame('Roblox', this)">Roblox</div>
        <div class="game-btn" onclick="changeGame('Tốc Chiến', this)">Tốc Chiến</div>
    </div>

    <div style="margin-bottom: 8px; font-size: 12px; color: #cbd5e1;">2. Nhập ID Nhân Vật / Tài Khoản:</div>
    <input type="text" id="playerId" placeholder="Nhập ID trong game của bạn..." style="width: 100%; padding: 9px; background: #0b0f19; border: 1px solid #2a3b6c; color: white; border-radius: 6px; font-size: 12px; margin-bottom: 12px; box-sizing: border-box;">

    <div style="margin-bottom: 8px; font-size: 12px; color: #cbd5e1;">3. Chọn Gói Vật Phẩm:</div>
    
    <!-- Danh sách gói nạp tự động thay đổi theo game được chọn -->
    <div class="package-container" id="packageList">
        <!-- Được render tự động bằng Javascript bên dưới -->
    </div>

    <button class="btn-submit" onclick="buyPackage()">XÁC NHẬN NẠP NGAY</button>
</div>

<script>
    // Dữ liệu gói vật phẩm riêng biệt cho từng tựa game
    const gamePackages = {
        "Liên Quân Mobile": [
            { name: "Gói 90 Quân Huy", price: 20000, label: "90 🛡️ Quân Huy" },
            { name: "Gói 230 Quân Huy", price: 50000, label: "230 🛡️ Quân Huy" },
            { name: "Gói 500 Quân Huy", price: 100000, label: "500 🛡️ Quân Huy" },
            { name: "Gói 1150 Quân Huy", price: 200000, label: "1.150 🛡️ Quân Huy" },
            { name: "Gói 3000 Quân Huy", price: 500000, label: "3.000 🛡️ Quân Huy" }
        ],
        "Free Fire": [
            { name: "Gói 113 Kim Cương", price: 10000, label: "113 💎 Kim Cương" },
            { name: "Gói 283 Kim Cương", price: 25000, label: "283 💎 Kim Cương" },
            { name: "Gói 565 Kim Cương", price: 50000, label: "565 💎 Kim Cương" },
            { name: "Gói 1165 Kim Cương", price: 100000, label: "1.165 💎 Kim Cương" },
            { name: "Gói 2400 Kim Cương", price: 200000, label: "2.400 💎 Kim Cương" }
        ],
        "Roblox": [
            { name: "Gói 80 Robux", price: 22000, label: "80 🪙 Robux" },
            { name: "Gói 400 Robux", price: 110000, label: "400 🪙 Robux" },
            { name: "Gói 800 Robux", price: 220000, label: "800 🪙 Robux" },
            { name: "Gói 1700 Robux", price: 450000, label: "1.700 🪙 Robux" }
        ],
        "Tốc Chiến": [
            { name: "Gói 425 Wild Cores", price: 50000, label: "425 ⚡ Wild Cores" },
            { name: "Gói 850 Wild Cores", price: 100000, label: "850 ⚡ Wild Cores" },
            { name: "Gói 1800 Wild Cores", price: 200000, label: "1.800 ⚡ Wild Cores" },
            { name: "Gói 4600 Wild Cores", price: 500000, label: "4.600 ⚡ Wild Cores" }
        ]
    };

    let selectedGame = "Liên Quân Mobile";
    let selectedPackage = gamePackages["Liên Quân Mobile"][0];
    let currentUser = null;

    window.addEventListener('DOMContentLoaded', () => {
        currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        if (!currentUser) {
            alert("Vui lòng đăng nhập trước khi mua gói!");
            window.location.href = "login.html";
            return;
        }
        document.getElementById('userNameDisplay').innerText = currentUser.username;
        document.getElementById('userBalanceDisplay').innerText = Number(currentUser.balance || 0).toLocaleString('vi-VN') + "đ";
        
        renderPackages();
    });

    function changeGame(gameName, element) {
        document.querySelectorAll('.game-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        selectedGame = gameName;
        
        // Mặc định chọn gói đầu tiên của game đó
        selectedPackage = gamePackages[gameName][0];
        renderPackages();
    }

    function renderPackages() {
        let listDiv = document.getElementById('packageList');
        let packages = gamePackages[selectedGame];
        let html = '';

        packages.forEach((pkg, index) => {
            let isActive = (pkg.name === selectedPackage.name) ? 'active' : '';
            html += `
                <div class="package-card ${isActive}" onclick='selectPkg(${JSON.stringify(pkg)}, this)'>
                    <div><b>${pkg.label}</b></div>
                    <div style="color: #00ffcc; font-weight: bold;">${Number(pkg.price).toLocaleString('vi-VN')}đ</div>
                </div>
            `;
        });
        listDiv.innerHTML = html;
    }

    function selectPkg(pkg, element) {
        document.querySelectorAll('.package-card').forEach(card => card.classList.remove('active'));
        element.classList.add('active');
        selectedPackage = pkg;
    }

    function buyPackage() {
        let playerId = document.getElementById('playerId').value.trim();
        if (!playerId) {
            alert("Vui lòng nhập ID nhân vật trong game!");
            return;
        }

        let currentBalance = Number(currentUser.balance || 0);
        if (currentBalance < selectedPackage.price) {
            alert("❌ Số dư ví không đủ để mua gói này! Vui lòng nạp thêm tiền.");
            window.location.href = "nap-tien.html";
            return;
        }

        // Trừ tiền ví
        currentUser.balance = currentBalance - selectedPackage.price;
        localStorage.setItem('viper_current_user', JSON.stringify(currentUser));

        let users = JSON.parse(localStorage.getItem('viper_users')) || [];
        users = users.map(u => u.username === currentUser.username ? currentUser : u);
        localStorage.setItem('viper_users', JSON.stringify(users));

        // Lưu đơn hàng chờ xử lý
        let newOrder = {
            id: 'ORD_' + Date.now(),
            username: currentUser.username,
            game: selectedGame,
            package: selectedPackage.label,
            price: selectedPackage.price,
            playerId: playerId,
            status: 'pending',
            time: new Date().toLocaleString('vi-VN')
        };

        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
        orders.unshift(newOrder);
        localStorage.setItem('viper_orders', JSON.stringify(orders));

        alert("✅ Đặt lệnh mua thành công! Hệ thống đang xử lý đơn hàng.");
        window.location.href = "lich-su.html";
    }
</script>

</body>
</html>
