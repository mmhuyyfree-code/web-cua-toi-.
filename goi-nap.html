<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Mua Gói Game</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 24, 38, 0.95); padding: 10px 15px; border-bottom: 1px solid #2a3b6c; margin-bottom: 15px; border-radius: 8px; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 10px; font-size: 12px; font-weight: bold; }
        .nav-links a:hover, .nav-links a.active { color: #00ffcc; }
        
        .package-card { background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .package-title { color: #00ffcc; font-weight: bold; font-size: 14px; margin-bottom: 6px; }
        .package-price { color: #ffaa00; font-weight: bold; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container" style="max-width: 480px;">
    <div class="navbar">
        <div class="nav-links">
            <a href="index.html">Trang Chủ</a>
            <a href="goi-nap.html" class="active">Gói Nạp</a>
            <a href="nap-tien.html">Nạp Ví</a>
            <a href="lich-su.html">Lịch Sử</a>
        </div>
        <div>
            <span id="userBalance" style="color: #00ffcc; font-size: 12px; font-weight: bold;">Ví: 0đ</span>
        </div>
    </div>

    <h3 style="color: #00ffcc; text-align: center; margin-bottom: 12px;">🎮 Chọn Gói Nạp Game</h3>

    <div class="form-group">
        <label>Chọn Game:</label>
        <select id="gameSelect" class="form-control" style="width: 100%; padding: 8px; background: #0b0f19; color: #fff; border: 1px solid #2a3b6c; border-radius: 5px;">
            <option value="Blox Fruit">Blox Fruit</option>
            <option value="Liên Quân Mobile">Liên Quân Mobile</option>
            <option value="Free Fire">Free Fire</option>
        </select>
    </div>

    <div class="form-group">
        <label>ID Game / Tài khoản:</label>
        <input type="text" id="playerId" placeholder="Nhập ID trong game...">
    </div>

    <div id="packageList">
        <!-- Danh sách gói nạp mẫu -->
        <div class="package-card">
            <div class="package-title">Gói 1: 1.000 Robux / Quân Huy</div>
            <div class="package-price">Giá: 50.000đ</div>
            <button onclick="buyPackage('Gói 1: 1.000 Robux', 50000)" style="width: 100%; background: #00cc66; color: white; border: none; padding: 8px; font-weight: bold; border-radius: 5px; cursor: pointer;">MUA NGAY</button>
        </div>
        <div class="package-card">
            <div class="package-title">Gói 2: 2.500 Robux / Quân Huy</div>
            <div class="package-price">Giá: 100.000đ</div>
            <button onclick="buyPackage('Gói 2: 2.500 Robux', 100000)" style="width: 100%; background: #00cc66; color: white; border: none; padding: 8px; font-weight: bold; border-radius: 5px; cursor: pointer;">MUA NGAY</button>
        </div>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        if (!currentUser) {
            alert("Vui lòng đăng nhập để mua gói!");
            window.location.href = "login.html";
            return;
        }
        document.getElementById('userBalance').innerText = 'Ví: ' + Number(currentUser.balance || 0).toLocaleString('vi-VN') + 'đ';
    });

    function buyPackage(packageName, price) {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        let playerId = document.getElementById('playerId').value.trim();
        let gameName = document.getElementById('gameSelect').value;

        if (!playerId) {
            alert("Vui lòng nhập ID Game của bạn!");
            return;
        }

        if ((currentUser.balance || 0) < price) {
            alert("Số dư ví không đủ! Vui lòng nạp thêm tiền vào ví.");
            window.location.href = "nap-tien.html";
            return;
        }

        if (confirm(`Xác nhận mua ${packageName} với giá ${price.toLocaleString('vi-VN')}đ?`)) {
            // Trừ tiền user
            currentUser.balance -= price;
            localStorage.setItem('viper_current_user', JSON.stringify(currentUser));

            // Cập nhật kho users chung
            let users = JSON.parse(localStorage.getItem('viper_users')) || [];
            let uIndex = users.findIndex(u => u.username === currentUser.username);
            if (uIndex !== -1) {
                users[uIndex].balance = currentUser.balance;
                localStorage.setItem('viper_users', JSON.stringify(users));
            }

            // Tạo đơn hàng chờ duyệt
            let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
            let newOrder = {
                username: currentUser.username,
                game: gameName,
                package: packageName,
                playerId: playerId,
                price: price,
                status: 'Chờ xử lý',
                time: new Date().toLocaleString('vi-VN')
            };
            orders.push(newOrder);
            localStorage.setItem('viper_orders', JSON.stringify(orders));

            alert("Đặt mua thành công! Đơn hàng đang chờ Admin xử lý.");
            window.location.href = "lich-su.html";
        }
    }
</script>

</body>
</html>
