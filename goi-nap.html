<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Chọn Gói Nạp</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 24, 38, 0.95); padding: 10px 15px; border-bottom: 1px solid #2a3b6c; margin-bottom: 12px; border-radius: 8px; font-size: 12px; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-right: 8px; font-weight: bold; }
        .nav-links a:hover, .nav-links a.active { color: #00ffcc; }
        
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .game-btn { background: #0b0f19; border: 1px solid #2a3b6c; color: #cbd5e1; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; font-size: 13px; transition: 0.2s; }
        .game-btn.active { background: #00ffcc; color: #0b0f19; border-color: #00ffcc; }

        .package-container { max-height: 250px; overflow-y: auto; padding-right: 4px; margin-bottom: 10px; }
        .package-container::-webkit-scrollbar { width: 4px; }
        .package-container::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 4px; }

        .package-item { background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .package-item.active { border-color: #00ffcc; background: rgba(0, 255, 204, 0.1); }
        .pkg-name { font-weight: bold; color: #fff; font-size: 13px; }
        .pkg-price { color: #00ffcc; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

<div class="container" style="max-width: 480px;">
    <div class="navbar">
        <div class="nav-links">
            <a href="#" onclick="location.href='index.html'; return false;">Trang Chủ</a>
            <a href="#" onclick="location.href='goi-nap.html'; return false;" class="active">Gói Nạp</a>
            <a href="#" onclick="location.href='nap-tien.html'; return false;">Nạp Ví</a>
            <a href="#" onclick="location.href='lich-su.html'; return false;">Lịch Sử</a>
        </div>
        <div>
            <span id="userInfo" style="color: #00ffcc; font-weight: bold; font-size: 11px;">User (0đ)</span>
        </div>
    </div>

    <h3 style="color: #00ffcc; text-align: center; margin-bottom: 10px; font-size: 15px;">CHỌN GÓI NẠP GAME</h3>

    <div style="font-size: 12px; color: #cbd5e1; margin-bottom: 6px; font-weight: bold;">1. Chọn Tựa Game:</div>
    <div class="game-grid">
        <div class="game-btn active" onclick="selectGame('Liên Quân Mobile', this)">Liên Quân Mobile</div>
        <div class="game-btn" onclick="selectGame('Free Fire', this)">Free Fire</div>
        <div class="game-btn" onclick="selectGame('Roblox', this)">Roblox</div>
        <div class="game-btn" onclick="selectGame('Tốc Chiến', this)">Tốc Chiến</div>
    </div>

    <div style="margin-bottom: 10px;">
        <label style="font-size: 12px; font-weight: bold; color: #cbd5e1; display: block; margin-bottom: 5px;">2. Nhập ID Nhân Vật / Tài Khoản:</label>
        <input type="text" id="playerId" placeholder="Nhập ID trong game của bạn..." style="width: 100%; padding: 8px; background: #0b0f19; border: 1px solid #2a3b6c; color: white; border-radius: 6px; font-size: 12px; box-sizing: border-box;">
    </div>

    <div style="font-size: 12px; color: #cbd5e1; margin-bottom: 6px; font-weight: bold;">3. Chọn Gói Vật Phẩm:</div>
    <div class="package-container" id="packageList"></div>

    <button type="button" onclick="submitOrder()" style="width: 100%; background: #00ffcc; color: #0b0f19; font-weight: bold; margin-top: 5px; padding: 11px; font-size: 14px; border: none; border-radius: 6px; cursor: pointer;">XÁC NHẬN NẠP NGAY</button>
</div>

<script>
    const gamePackages = {
        "Liên Quân Mobile": [
            { name: "Gói 180 Quân Huy", price: 20000, label: "180 🛡️ Quân Huy" },
            { name: "Gói 460 Quân Huy", price: 50000, label: "460 🛡️ Quân Huy" },
            { name: "Gói 1000 Quân Huy", price: 100000, label: "1.000 🛡️ Quân Huy" },
            { name: "Gói 2300 Quân Huy", price: 200000, label: "2.300 🛡️ Quân Huy" },
            { name: "Gói 6000 Quân Huy", price: 500000, label: "6.000 🛡️ Quân Huy" }
        ],
        "Free Fire": [
            { name: "Gói 113 Kim Cương", price: 10000, label: "113 💎 Kim Cương" },
            { name: "Gói 283 Kim Cương", price: 25000, label: "283 💎 Kim Cương" },
            { name: "Gói 565 Kim Cương", price: 50000, label: "565 💎 Kim Cương" },
            { name: "Gói 1165 Kim Cương", price: 100000, label: "1.165 💎 Kim Cương" },
            { name: "Gói 2400 Kim Cương", price: 200000, label: "2.400 💎 Kim Cương" }
        ],
        "Roblox": [
            { name: "Gói 160 Robux", price: 22000, label: "160 🪙 Robux" },
            { name: "Gói 800 Robux", price: 110000, label: "800 🪙 Robux" },
            { name: "Gói 1600 Robux", price: 220000, label: "1.600 🪙 Robux" },
            { name: "Gói 3400 Robux", price: 450000, label: "3.400 🪙 Robux" }
        ],
        "Tốc Chiến": [
            { name: "Gói 850 Wild Cores", price: 50000, label: "850 ⚡ Wild Cores" },
            { name: "Gói 1700 Wild Cores", price: 100000, label: "1.700 ⚡ Wild Cores" },
            { name: "Gói 3600 Wild Cores", price: 200000, label: "3.600 ⚡ Wild Cores" },
            { name: "Gói 9200 Wild Cores", price: 500000, label: "9.200 ⚡ Wild Cores" }
        ]
    };

    let selectedGame = "Liên Quân Mobile";
    let selectedPackage = gamePackages["Liên Quân Mobile"][0];
    let currentUser = null;

    window.addEventListener('DOMContentLoaded', () => {
        currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        if (!currentUser) {
            alert("Vui lòng đăng nhập trước khi mua gói!");
            window.location.href = "login.html";
            return;
        }
        document.getElementById('userInfo').innerText = `${currentUser.username} (${Number(currentUser.balance || 0).toLocaleString('vi-VN')}đ)`;
        renderPackages();
    });

    function selectGame(gameName, element) {
        document.querySelectorAll('.game-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        selectedGame = gameName;
        selectedPackage = gamePackages[gameName][0];
        renderPackages();
    }

    function renderPackages() {
        let listDiv = document.getElementById('packageList');
        let packages = gamePackages[selectedGame];
        let html = '';

        packages.forEach((pkg) => {
            let isActive = (pkg.name === selectedPackage.name) ? 'active' : '';
            html += `
                <div class="package-item ${isActive}" onclick='selectPkg(${JSON.stringify(pkg)}, this)'>
                    <span class="pkg-name">${pkg.label}</span>
                    <span class="pkg-price">${Number(pkg.price).toLocaleString('vi-VN')}đ</span>
                </div>
            `;
        });
        listDiv.innerHTML = html;
    }

    function selectPkg(pkg, element) {
        document.querySelectorAll('.package-item').forEach(item => item.classList.remove('active'));
        element.classList.add('active');
        selectedPackage = pkg;
    }

    function submitOrder() {
        let playerId = document.getElementById('playerId').value.trim();
        if (!playerId) {
            alert("Vui lòng nhập ID nhân vật hoặc tài khoản game!");
            return;
        }

        let currentBalance = Number(currentUser.balance || 0);
        if (currentBalance < selectedPackage.price) {
            alert("❌ Số dư ví không đủ để mua gói này! Vui lòng nạp thêm tiền.");
            window.location.href = "nap-tien.html";
            return;
        }

        if (confirm(`Xác nhận mua gói [${selectedPackage.label}] cho game ${selectedGame} với giá ${selectedPackage.price.toLocaleString('vi-VN')}đ?`)) {
            currentUser.balance = currentBalance - selectedPackage.price;
            localStorage.setItem('viper_current_user', JSON.stringify(currentUser));

            let users = JSON.parse(localStorage.getItem('viper_users')) || [];
            users = users.map(u => u.username === currentUser.username ? currentUser : u);
            localStorage.setItem('viper_users', JSON.stringify(users));

            let newOrder = {
                username: currentUser.username,
                game: selectedGame,
                fullId: playerId,
                package: selectedPackage.label,
                price: selectedPackage.price,
                status: "Chờ xử lý",
                time: new Date().toLocaleString('vi-VN')
            };

            let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
            orders.unshift(newOrder);
            localStorage.setItem('viper_orders', JSON.stringify(orders));

            let history = JSON.parse(localStorage.getItem('viper_history')) || [];
            history.unshift(newOrder);
            localStorage.setItem('viper_history', JSON.stringify(history));

            alert("✅ Đặt lệnh mua thành công! Đơn hàng đang được xử lý.");
            window.location.href = "lich-su.html";
        }
    }
</script>

</body>
</html>
