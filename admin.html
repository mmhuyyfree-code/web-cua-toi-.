<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị - VIPER SHOP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-tab { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; color: #fff; padding: 10px; border-radius: 6px; cursor: pointer; text-align: center; font-weight: bold; font-size: 12px; }
        .tab-btn.active { border-color: #00ffcc; background: rgba(0, 255, 204, 0.1); color: #00ffcc; }
        .manage-card { background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 12px; }
        .btn-group { display: flex; gap: 8px; margin-top: 8px; }
        .btn-approve { background: #00ffcc; color: #0b0f19; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-reject { background: #ff3366; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; flex: 1; }
    </style>
</head>
<body>

<div class="container" style="max-width: 550px;">
    <h2 style="text-align: center; color: #00ffcc; margin-bottom: 15px;">🛠 KHU VỰC QUẢN TRỊ ADMIN</h2>

    <div class="admin-tab">
        <div class="tab-btn active" id="tabGameBtn" onclick="switchAdminTab('game')">🎮 Duyệt Gói Game</div>
        <div class="tab-btn" id="tabWalletBtn" onclick="switchAdminTab('wallet')">💳 Duyệt Nạp Ví</div>
    </div>

    <!-- PHẦN 1: DUYỆT GÓI GAME -->
    <div id="paneGameOrders">
        <h3 style="color: #cbd5e1; font-size: 14px; margin-bottom: 10px;">Danh sách đơn chờ duyệt gói game:</h3>
        <div id="adminGameList"></div>
    </div>

    <!-- PHẦN 2: DUYỆT NẠP VÍ -->
    <div id="paneWalletOrders" style="display: none;">
        <h3 style="color: #cbd5e1; font-size: 14px; margin-bottom: 10px;">Danh sách yêu cầu nạp tiền ví:</h3>
        <div id="adminWalletList"></div>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <a href="index.html" style="color: #00ffcc; text-decoration: none; font-size: 12px; font-weight: bold;">⬅ Quay lại Trang Chủ Shop</a>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        loadAdminData();
    });

    function switchAdminTab(type) {
        let gameBtn = document.getElementById("tabGameBtn");
        let walletBtn = document.getElementById("tabWalletBtn");
        let paneGame = document.getElementById("paneGameOrders");
        let paneWallet = document.getElementById("paneWalletOrders");

        if (type === 'game') {
            gameBtn.classList.add('active');
            walletBtn.classList.remove('active');
            paneGame.style.display = "block";
            paneWallet.style.display = "none";
        } else {
            walletBtn.classList.add('active');
            gameBtn.classList.remove('active');
            paneWallet.style.display = "block";
            paneGame.style.display = "none";
        }
    }

    function loadAdminData() {
        // 1. Đơn game
        let history = JSON.parse(localStorage.getItem('viper_history')) || [];
        let gameContainer = document.getElementById("adminGameList");
        let pendingGames = history.filter(o => o.status === "Chờ xử lý");

        if (pendingGames.length === 0) {
            gameContainer.innerHTML = `<div style="text-align: center; color: #718096; padding: 15px;">Không có đơn mua game nào đang chờ.</div>`;
        } else {
            let html = "";
            history.forEach((order, index) => {
                if (order.status === "Chờ xử lý") {
                    html += `
                        <div class="manage-card">
                            <div><b>Khách:</b> <span style="color: #00ffcc;">${order.username}</span> | ⏱ ${order.time}</div>
                            <div><b>Game:</b> ${order.game} | <b>ID:</b> <span style="color: #ffaa00;">${order.fullId}</span></div>
                            <div><b>Gói mua:</b> ${order.package}</div>
                            <div class="btn-group">
                                <button class="btn-approve" onclick="approveGameOrder(${index})">✔ Duyệt Thành Công</button>
                                <button class="btn-reject" onclick="rejectGameOrder(${index})">✖ Từ Chối</button>
                            </div>
                        </div>
                    `;
                }
            });
            gameContainer.innerHTML = html;
        }

        // 2. Yêu cầu nạp ví
        let walletRequests = JSON.parse(localStorage.getItem('viper_wallet_requests')) || [];
        let walletContainer = document.getElementById("adminWalletList");
        let pendingWallets = walletRequests.filter(w => w.status === "Chờ xử lý");

        if (pendingWallets.length === 0) {
            walletContainer.innerHTML = `<div style="text-align: center; color: #718096; padding: 15px;">Không có yêu cầu nạp ví nào đang chờ.</div>`;
        } else {
            let wHtml = "";
            walletRequests.forEach((req, index) => {
                if (req.status === "Chờ xử lý") {
                    wHtml += `
                        <div class="manage-card">
                            <div><b>Tài khoản:</b> <span style="color: #00ffcc;">${req.username}</span> | ⏱ ${req.time}</div>
                            <div><b>Phương thức:</b> ${req.method}</div>
                            <div><b>Số tiền:</b> <b style="color: #ffaa00;">${Number(req.amount).toLocaleString('vi-VN')}đ</b></div>
                            ${req.cardInfo ? `<div>Thẻ: ${req.cardInfo.cardType} | PIN: ${req.cardInfo.cardCode} | Seri: ${req.cardInfo.cardSerial}</div>` : ''}
                            <div class="btn-group">
                                <button class="btn-approve" onclick="approveWallet(${index})">✔ Duyệt Cộng Tiền</button>
                                <button class="btn-reject" onclick="rejectWallet(${index})">✖ Từ Chối</button>
                            </div>
                        </div>
                    `;
                }
            });
            walletContainer.innerHTML = wHtml;
        }
    }

    function approveGameOrder(index) {
        let history = JSON.parse(localStorage.getItem('viper_history')) || [];
        history[index].status = "Đã xử lý (Thành công)";
        localStorage.setItem('viper_history', JSON.stringify(history));
        alert("Đã duyệt đơn hàng thành công!");
        loadAdminData();
    }

    function rejectGameOrder(index) {
        let reason = prompt("Nhập lý do từ chối đơn gói game:");
        if (reason === null) return;

        let history = JSON.parse(localStorage.getItem('viper_history')) || [];
        let order = history[index];
        order.status = `Duyệt thất bại vì lý do: ${reason || "Không rõ lý do"}`;

        // Hoàn lại tiền ví cho khách
        let users = JSON.parse(localStorage.getItem('viper_users')) || [];
        let userObj = users.find(u => u.username === order.username);
        let refundAmount = parsePrice(order.package);

        if (userObj) {
            userObj.balance = (userObj.balance || 0) + refundAmount;
            localStorage.setItem('viper_users', JSON.stringify(users));

            let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
            if (currentUser && currentUser.username === userObj.username) {
                currentUser.balance = userObj.balance;
                localStorage.setItem('viper_current_user', JSON.stringify(currentUser));
            }
        }

        history[index] = order;
        localStorage.setItem('viper_history', JSON.stringify(history));
        alert("Đã từ chối đơn và hoàn tiền vào ví khách thành công!");
        loadAdminData();
    }

    function approveWallet(index) {
        let requests = JSON.parse(localStorage.getItem('viper_wallet_requests')) || [];
        let req = requests[index];
        req.status = "Đã duyệt";

        // Cộng tiền vào tài khoản
        let users = JSON.parse(localStorage.getItem('viper_users')) || [];
        let userObj = users.find(u => u.username === req.username);
        if (userObj) {
            userObj.balance = (userObj.balance || 0) + Number(req.amount);
            localStorage.setItem('viper_users', JSON.stringify(users));

            let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
            if (currentUser && currentUser.username === userObj.username) {
                currentUser.balance = userObj.balance;
                localStorage.setItem('viper_current_user', JSON.stringify(currentUser));
            }
        }

        // Lưu lịch sử nạp ví thành công
        let history = JSON.parse(localStorage.getItem('viper_history')) || [];
        history.unshift({
            username: req.username,
            game: "Nạp Tiền Ví",
            fullId: "N/A",
            package: `Nạp ${Number(req.amount).toLocaleString('vi-VN')}đ`,
            payment: req.method,
            status: "Đã duyệt (Thành công)",
            time: new Date().toLocaleString('vi-VN')
        });
        localStorage.setItem('viper_history', JSON.stringify(history));

        requests[index] = req;
        localStorage.setItem('viper_wallet_requests', JSON.stringify(requests));
        alert("Đã duyệt cộng tiền vào ví thành công!");
        loadAdminData();
    }

    function rejectWallet(index) {
        let reason = prompt("Nhập lý do từ chối nạp ví:");
        if (reason === null) return;

        let requests = JSON.parse(localStorage.getItem('viper_wallet_requests')) || [];
        let req = requests[index];
        req.status = `Duyệt thất bại vì lý do: ${reason || "Không rõ lý do"}`;

        let history = JSON.parse(localStorage.getItem('viper_history')) || [];
        history.unshift({
            username: req.username,
            game: "Nạp Tiền Ví",
            fullId: "N/A",
            package: `Nạp ${Number(req.amount).toLocaleString('vi-VN')}đ`,
            payment: req.method,
            status: `Duyệt thất bại vì lý do: ${reason || "Không rõ lý do"}`,
            time: new Date().toLocaleString('vi-VN')
        });
        localStorage.setItem('viper_history', JSON.stringify(history));

        requests[index] = req;
        localStorage.setItem('viper_wallet_requests', JSON.stringify(requests));
        alert("Đã từ chối yêu cầu nạp ví!");
        loadAdminData();
    }

    function parsePrice(pkgString) {
        if (pkgString.includes('50,000đ')) return 50000;
        if (pkgString.includes('100,000đ')) return 100000;
        if (pkgString.includes('200,000đ')) return 200000;
        return 0;
    }
</script>

</body>
</html>
