<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị - VIPER SHOP</title>
    <style>
        body {
            background: #0b0f19; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            background: rgba(18, 24, 38, 0.95); width: 100%; max-width: 450px; padding: 25px;
            border-radius: 16px; border: 2px solid #ff007f; box-sizing: border-box;
        }
        h2 { text-align: center; color: #ff007f; margin-top: 0; }
        button {
            width: 100%; border: none; padding: 12px; border-radius: 8px;
            font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🛠 QUẢN TRỊ ĐƠN HÀNG</h2>
    <p style="font-size: 12px; color: #94a3b8; text-align: center;">Danh sách đơn nạp thực tế từ khách hàng:</p>
    
    <div id="adminOrderList" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px;"></div>
    
    <button onclick="clearHistory()" style="background: #ff3366; color: white;">🗑 Xóa Sạch Lịch Sử</button>
    <button onclick="goHome()" style="background: #2a3b6c; color: white;">⬅ Quay Lại Trang Chủ</button>
</div>

<script>
    window.onload = function() {
        renderAdminOrders();
    };

    function renderAdminOrders() {
        let history = JSON.parse(localStorage.getItem('viper_history')) || [];
        let adminList = document.getElementById("adminOrderList");
        adminList.innerHTML = "";

        if(history.length === 0) {
            adminList.innerHTML = `<p style="color: #94a3b8; text-align: center; font-size: 12px;">Chưa có đơn hàng nào.</p>`;
            return;
        }

        history.forEach((item, index) => {
            let cardInfo = item.card ? `<br>- Thẻ: ${item.card.cardType} (${item.card.cardPrice})<br>- Mã: ${item.card.cardCode}<br>- Seri: ${item.card.cardSerial}` : '';
            let div = document.createElement("div");
            div.style.cssText = "background: rgba(11, 15, 25, 0.9); border: 1px solid #2a3b6c; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 12px; color: #e2e8f0;";
            div.innerHTML = `<strong>#${index + 1} - [${item.game}]</strong><br>
                             - ID: <span style="color: #00ffcc;">${item.fullId}</span><br>
                             - Gói: ${item.package}<br>
                             - Hình thức: ${item.payment}
                             ${cardInfo}<br>
                             <span style="color: #94a3b8; font-size: 10px;">🕒 ${item.time || 'Vừa xong'}</span>`;
            adminList.appendChild(div);
        });
    }

    function clearHistory() {
        if(confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử?")) {
            localStorage.removeItem('viper_history');
            renderAdminOrders();
            alert("Đã xóa sạch!");
        }
    }

    function goHome() {
        window.location.href = "index.html";
    }
</script>

</body>
</html>
