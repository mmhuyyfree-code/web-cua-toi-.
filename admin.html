<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị - VIPER SHOP</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 24, 38, 0.95); padding: 10px 15px; border-bottom: 1px solid #2a3b6c; margin-bottom: 12px; border-radius: 8px; }
        .tab-menu { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 10px; background: #0b0f19; border: 1px solid #2a3b6c; color: #cbd5e1; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; }
        .tab-btn.active { background: #00ffcc; color: #0b0f19; border-color: #00ffcc; }

        .admin-container { max-height: 380px; overflow-y: auto; padding-right: 4px; }
        .admin-container::-webkit-scrollbar { width: 5px; }
        .admin-container::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 4px; }

        .admin-card { background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 13px; }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .btn-approve { flex: 1; background: #00cc66; color: white; border: none; padding: 8px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .btn-reject { flex: 1; background: #ff3366; color: white; border: none; padding: 8px; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" style="max-width: 480px;">
    <div class="navbar">
        <span style="color: #00ffcc; font-weight: bold; font-size: 14px;">🛠️ Quản Trị ADMIN</span>
        <a href="#" onclick="location.href='index.html'; return false;" style="color: #ff3366; font-size: 12px; text-decoration: none;">Thoát Shop</a>
    </div>

    <div class="tab-menu">
        <button class="tab-btn active" id="btnTabGame" onclick="switchAdminTab('game')">🎮 Duyệt Gói Game</button>
        <button class="tab-btn" id="btnTabWallet" onclick="switchAdminTab('wallet')">💳 Duyệt Nạp Thẻ/Ví</button>
    </div>

    <div class="admin-container" id="adminList">
        <p style="text-align: center; color: #888;">Đang tải danh sách...</p>
    </div>
</div>

<script>
    let currentAdminTab = 'game';

    window.addEventListener('DOMContentLoaded', () => {
        renderAdminData();
    });

    function switchAdminTab(tab) {
        currentAdminTab = tab;
        document.getElementById('btnTabGame').classList.toggle('active', tab === 'game');
        document.getElementById('btnTabWallet').classList.toggle('active', tab === 'wallet');
        renderAdminData();
    }

    function renderAdminData() {
        let container = document.getElementById('adminList');
        let html = '';
        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];

        if (currentAdminTab === 'game') {
            let pendingOrders = orders.filter(item => {
                let statusLower = (item.status || '').toLowerCase();
                let isPending = statusLower.includes('chờ') || statusLower === '';
                let isCard = item.type === "Nạp Thẻ Cào";
                return isPending && !isCard;
            });

            if (pendingOrders.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #888; padding: 20px;">Không có đơn chờ duyệt gói game nào.</p>`;
                return;
            }

            pendingOrders.forEach((item) => {
                let realIndex = orders.findIndex(o => o === item);
                html += `
                    <div class="admin-card">
                        <div>Khách: <b>${item.username || 'N/A'}</b> | 🕒 ${item.time || 'N/A'}</div>
                        <div>Game: <b>${item.game || 'N/A'}</b> | ID: <b>${item.fullId || 'N/A'}</b></div>
                        <div>Gói mua: <b>${item.package || 'N/A'}</b></div>
                        <div class="btn-group">
                            <button class="btn-approve" onclick="processOrder(${realIndex}, 'success')">✔ Duyệt Thành Công</button>
                            <button class="btn-reject" onclick="processOrder(${realIndex}, 'reject')">✖ Từ Chối</button>
                        </div>
                    </div>
                `;
            });

        } else {
            let pendingWallets = orders.filter(item => {
                let statusLower = (item.status || '').toLowerCase();
                let isPending = statusLower.includes('chờ') || statusLower === '';
                let isCard = item.type === "Nạp Thẻ Cào";
                return isPending && isCard;
            });

            if (pendingWallets.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #888; padding: 20px;">Không có yêu cầu nạp thẻ/ví nào đang chờ.</p>`;
                return;
            }

            pendingWallets.forEach((item) => {
                let realIndex = orders.findIndex(o => o === item);
                html += `
                    <div class="admin-card">
                        <div>Tài khoản: <b>${item.username || 'N/A'}</b> | 🕒 ${item.time || 'N/A'}</div>
                        <div>Phương thức: <b>${item.type || 'Nạp Thẻ'}</b></div>
                        <div>Chi tiết: <b style="color: #00ffcc;">${item.details || 'N/A'}</b></div>
                        <div>Mã thẻ: <b>${item.pin}</b> | Seri: <b>${item.seri}</b></div>
                        <div class="btn-group">
                            <button class="btn-approve" onclick="processCardOrder(${realIndex}, 'success')">✔ Duyệt Cộng Tiền</button>
                            <button class="btn-reject" onclick="processCardOrder(${realIndex}, 'reject')">✖ Từ Chối</button>
                        </div>
                    </div>
                `;
            });
        }

        container.innerHTML = html;
    }

    function processOrder(realIndex, action) {
        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
        if (action === 'success') {
            orders[realIndex].status = 'Đã giao thành công';
        } else {
            let reason = prompt("Nhập lý do từ chối đơn game:", "Sai thông tin ID");
            if (reason === null) return;
            orders[realIndex].status = 'Từ chối';
            orders[realIndex].reason = reason;
        }
        localStorage.setItem('viper_orders', JSON.stringify(orders));
        renderAdminData();
    }

    function processCardOrder(realIndex, action) {
        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
        let targetItem = orders[realIndex];

        if (action === 'success') {
            orders[realIndex].status = 'Thành công';
            
            // Tách mệnh giá từ chuỗi details (ví dụ: "Viettel - 50.000đ")
            let match = targetItem.details.match(/([\d\.]+)đ/);
            let addAmount = match ? parseInt(match[1].replace(/\./g, '')) : 0;

            let users = JSON.parse(localStorage.getItem('viper_users')) || [];
            let userIndex = users.findIndex(u => u.username === targetItem.username);

            if (userIndex !== -1) {
                users[userIndex].balance = (Number(users[userIndex].balance) || 0) + addAmount;
                localStorage.setItem('viper_users', JSON.stringify(users));
            }

            let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
            if (currentUser && currentUser.username === targetItem.username) {
                currentUser.balance = (Number(currentUser.balance) || 0) + addAmount;
                localStorage.setItem('viper_current_user', JSON.stringify(currentUser));
            }

            alert("Đã duyệt và cộng thành công tiền vào tài khoản!");
        } else {
            let reason = prompt("Nhập lý do từ chối thẻ:", "Thẻ lỗi hoặc đã sử dụng");
            if (reason === null) return;
            orders[realIndex].status = 'Từ chối';
            orders[realIndex].reason = reason;
        }
        localStorage.setItem('viper_orders', JSON.stringify(orders));
        renderAdminData();
    }
</script>

</body>
</html>
