<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị - VIPER SHOP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 24, 38, 0.95); padding: 10px 15px; border-bottom: 1px solid #2a3b6c; margin-bottom: 12px; border-radius: 8px; }
        .tab-menu { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 10px; background: #0b0f19; border: 1px solid #2a3b6c; color: #cbd5e1; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; }
        .tab-btn.active { background: #00ffcc; color: #0b0f19; border-color: #00ffcc; }

        .admin-container { max-height: 380px; overflow-y: auto; padding-right: 4px; }
        .admin-container::-webkit-scrollbar { width: 5px; }
        .admin-container::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 4px; }

        .admin-card { background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 13px; }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .btn-approve { flex: 1; background: #00cc66; color: white; border: none; padding: 8px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .btn-reject { flex: 1; background: #ff3366; color: white; border: none; padding: 8px; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" style="max-width: 480px;">
    <div class="navbar">
        <span style="color: #00ffcc; font-weight: bold; font-size: 14px;">🛠️ Quản Trị ADMIN</span>
        <a href="index.html" style="color: #ff3366; font-size: 12px; text-decoration: none;">Thoát Shop</a>
    </div>

    <!-- Nút đồng bộ & dọn dữ liệu lỗi -->
    <div style="text-align: center; margin-bottom: 12px;">
        <button onclick="clearBugData()" style="background: #ffaa00; color: #0b0f19; border: none; padding: 7px 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 11px; width: 100%;">🧹 Đồng Bộ & Dọn Dữ Liệu Lỗi</button>
    </div>

    <!-- Tab chuyển đổi khu vực duyệt -->
    <div class="tab-menu">
        <button class="tab-btn active" id="btnTabGame" onclick="switchAdminTab('game')">🎮 Duyệt Gói Game</button>
        <button class="tab-btn" id="btnTabWallet" onclick="switchAdminTab('wallet')">💳 Duyệt Nạp Ví</button>
    </div>

    <!-- Danh sách hiển thị -->
    <div class="admin-container" id="adminList">
        <p style="text-align: center; color: #888;">Đang tải danh sách...</p>
    </div>
</div>

<script>
    let currentAdminTab = 'game';

    window.addEventListener('DOMContentLoaded', () => {
        syncAllOrders();
        renderAdminData();
    });

    function switchAdminTab(tab) {
        currentAdminTab = tab;
        document.getElementById('btnTabGame').classList.toggle('active', tab === 'game');
        document.getElementById('btnTabWallet').classList.toggle('active', tab === 'wallet');
        renderAdminData();
    }

    function syncAllOrders() {
        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
        let history = JSON.parse(localStorage.getItem('viper_history')) || [];
        
        let combined = [...orders, ...history];
        let uniqueOrders = [];
        let seen = new Set();

        combined.forEach(item => {
            let identifier = (item.username || '') + (item.time || '') + (item.package || item.packet || '');
            let gameName = (item.game || item.type || '').toLowerCase();
            let isWallet = gameName.includes('nạp tiền ví') || gameName.includes('nạp ví');

            if (!seen.has(identifier) && item && !isWallet) {
                seen.add(identifier);
                uniqueOrders.push(item);
            }
        });

        localStorage.setItem('viper_orders', JSON.stringify(uniqueOrders));
    }

    function clearBugData() {
        if (confirm("Bạn có muốn đồng bộ và làm sạch dữ liệu đơn hàng không?")) {
            syncAllOrders();
            alert("Đã đồng bộ thành công tất cả đơn gói game!");
            renderAdminData();
        }
    }

    function renderAdminData() {
        let container = document.getElementById('adminList');
        let html = '';

        if (currentAdminTab === 'game') {
            let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
            
            let pendingOrders = orders.filter(item => {
                let statusLower = (item.status || '').toLowerCase();
                let isPending = statusLower.includes('chờ') || statusLower.includes('pending') || statusLower === '';
                let gameName = (item.game || item.type || '').toLowerCase();
                let isNotWallet = !gameName.includes('nạp tiền ví') && !gameName.includes('nạp ví');
                return isPending && isNotWallet;
            });

            if (pendingOrders.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #888; padding: 20px;">Không có đơn chờ duyệt gói game nào.</p>`;
                return;
            }

            pendingOrders.forEach((item, index) => {
                html += `
                    <div class="admin-card">
                        <div>Khách: <b>${item.username || 'N/A'}</b> | 🕒 ${item.time || 'N/A'}</div>
                        <div>Game: <b>${item.game || item.type || 'N/A'}</b> | ID: <b>${item.playerId || item.fullId || item.id || 'N/A'}</b></div>
                        <div>Gói mua: <b>${item.package || item.packet || item.name || 'N/A'}</b></div>
                        <div class="btn-group">
                            <button class="btn-approve" onclick="processOrder('game', ${index}, 'success')">✔ Duyệt Thành Công</button>
                            <button class="btn-reject" onclick="processOrder('game', ${index}, 'reject')">✖ Từ Chối</button>
                        </div>
                    </div>
                `;
            });

        } else {
            let walletRequests = JSON.parse(localStorage.getItem('viper_wallet_requests')) || [];
            let pendingWallets = walletRequests.filter(item => {
                let statusLower = (item.status || '').toLowerCase();
                return statusLower.includes('chờ') || statusLower.includes('pending') || statusLower === '';
            });

            if (pendingWallets.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #888; padding: 20px;">Không có yêu cầu nạp ví nào đang chờ.</p>`;
                return;
            }

            pendingWallets.forEach((item, index) => {
                html += `
                    <div class="admin-card">
                        <div>Tài khoản: <b>${item.username || 'N/A'}</b> | 🕒 ${item.time || 'N/A'}</div>
                        <div>Phương thức: <b>${item.method || 'Chuyển khoản QR'}</b></div>
                        <div>Số tiền: <b style="color: #00ffcc;">${Number(item.amount || 0).toLocaleString('vi-VN')}đ</b></div>
                        <div class="btn-group">
                            <button class="btn-approve" onclick="processOrder('wallet', ${index}, 'success')">✔ Duyệt Cộng Tiền</button>
                            <button class="btn-reject" onclick="processOrder('wallet', ${index}, 'reject')">✖ Từ Chối</button>
                        </div>
                    </div>
                `;
            });
        }

        container.innerHTML = html;
    }

    function processOrder(type, index, action) {
        if (type === 'game') {
            let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
            let pendingOrders = orders.filter(item => {
                let statusLower = (item.status || '').toLowerCase();
                let isPending = statusLower.includes('chờ') || statusLower.includes('pending') || statusLower === '';
                let gameName = (item.game || item.type || '').toLowerCase();
                let isNotWallet = !gameName.includes('nạp tiền ví') && !gameName.includes('nạp ví');
                return isPending && isNotWallet;
            });

            let targetItem = pendingOrders[index];
            let realIndex = orders.findIndex(o => o === targetItem);

            if (action === 'success') {
                orders[realIndex].status = 'Đã giao thành công';
            } else {
                let reason = prompt("Nhập lý do từ chối đơn game:", "Sai thông tin ID hoặc tài khoản không tồn tại");
                if (reason === null) return;
                orders[realIndex].status = 'Từ chối';
                orders[realIndex].reason = reason;
            }
            localStorage.setItem('viper_orders', JSON.stringify(orders));

        } else {
            let walletRequests = JSON.parse(localStorage.getItem('viper_wallet_requests')) || [];
            let pendingWallets = walletRequests.filter(item => {
                let statusLower = (item.status || '').toLowerCase();
                return statusLower.includes('chờ') || statusLower.includes('pending') || statusLower === '';
            });

            let targetItem = pendingWallets[index];
            let realIndex = walletRequests.findIndex(w => w === targetItem);

            if (action === 'success') {
                walletRequests[realIndex].status = 'Thành công';
                
                let users = JSON.parse(localStorage.getItem('viper_users')) || [];
                let targetUsername = (targetItem.username || '').trim().toLowerCase();
                let addAmount = Number(targetItem.amount) || 0;
                
                // Tìm kiếm linh hoạt trong danh sách users
                let userIndex = users.findIndex(u => {
                    let uName = (u.username || u.name || '').trim().toLowerCase();
                    return uName === targetUsername || (targetUsername && uName.includes(targetUsername)) || (targetUsername && targetUsername.includes(uName));
                });

                if (userIndex !== -1) {
                    let u = users[userIndex];
                    u.balance = (Number(u.balance || u.money || u.sodu) || 0) + addAmount;
                    localStorage.setItem('viper_users', JSON.stringify(users));
                } else if (users.length > 0) {
                    // Fallback thông minh: Nếu chỉ có 1 user hoặc không tìm thấy chính xác, cộng thẳng vào user đầu tiên
                    users[0].balance = (Number(users[0].balance || users[0].money || users[0].sodu) || 0) + addAmount;
                    localStorage.setItem('viper_users', JSON.stringify(users));
                }

                // Cập nhật đồng thời số dư vào tài khoản hiện tại đang đăng nhập nếu khớp
                let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
                if (currentUser) {
                    currentUser.balance = (Number(currentUser.balance) || 0) + addAmount;
                    localStorage.setItem('viper_current_user', JSON.stringify(currentUser));
                }

                alert("Đã duyệt và cộng thành công " + addAmount.toLocaleString('vi-VN') + "đ vào tài khoản!");
            } else {
                let reason = prompt("Nhập lý do từ chối nạp ví:", "Chưa nhận được tiền chuyển khoản");
                if (reason === null) return;
                walletRequests[realIndex].status = 'Từ chối';
                walletRequests[realIndex].reason = reason;
            }
            localStorage.setItem('viper_wallet_requests', JSON.stringify(walletRequests));
        }

        renderAdminData();
    }
</script>

</body>
</html>
