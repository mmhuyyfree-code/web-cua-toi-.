<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Hệ Thống - VIPER SHOP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="max-width: 800px;">
    <div class="header-box" style="background: rgba(18, 24, 38, 0.95); border: 2px solid #ff007f; border-radius: 14px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 0 25px rgba(255, 0, 127, 0.3); margin-bottom: 20px;">
        <h2 style="margin: 0; font-size: 22px; color: #ff007f;">🛠️ QUẢN TRỊ HỆ THỐNG VIPER</h2>
        <button class="btn-back" onclick="goHome()" style="background: linear-gradient(135deg, #00ffcc, #00bfff); color: #0b0f19; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; width: auto;">⬅ VỀ TRANG CHỦ</button>
    </div>

    <div class="stats-box" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px;">
        <div class="stat-card" style="background: rgba(18, 24, 38, 0.95); border: 1px solid #2a3b6c; border-radius: 12px; padding: 15px; text-align: center;">
            <h3 style="margin: 0 0 5px 0; font-size: 13px; color: #94a3b8;">TỔNG SỐ GIAO DỊCH</h3>
            <div class="value" id="totalOrders" style="font-size: 22px; font-weight: bold; color: #00ffcc;">0</div>
        </div>
        <div class="stat-card" style="background: rgba(18, 24, 38, 0.95); border: 1px solid #2a3b6c; border-radius: 12px; padding: 15px; text-align: center;">
            <h3 style="margin: 0 0 5px 0; font-size: 13px; color: #94a3b8;">TRẠNG THÁI HỆ THỐNG</h3>
            <div class="value" style="color: #00ffcc; font-size: 18px; margin-top: 4px;">🟢 Hoạt động mượt mà</div>
        </div>
    </div>

    <div class="backup-section" style="background: rgba(18, 24, 38, 0.95); border: 1px dashed #00ffcc; border-radius: 12px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <div>
            <div style="font-weight: bold; font-size: 14px; color: #00ffcc; margin-bottom: 2px;">💾 Quản Lý Dữ Liệu Đơn Hàng</div>
            <div style="font-size: 12px; color: #94a3b8;">Sao lưu file dự phòng hoặc khôi phục dữ liệu nhanh chóng.</div>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-backup" onclick="exportData()" style="background: linear-gradient(135deg, #00ffcc, #00bfff); color: #0b0f19; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; width: auto;">📥 Xuất Dữ Liệu</button>
            <button class="btn-restore" onclick="document.getElementById('importFile').click()" style="background: #2a3b6c; color: #ffffff; border: 1px solid #00ffcc; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; width: auto;">📤 Khôi Phục</button>
            <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <div class="table-container" style="background: rgba(18, 24, 38, 0.95); border: 2px solid #00ffcc; border-radius: 14px; padding: 20px; box-shadow: 0 0 25px rgba(0, 255, 204, 0.2); overflow-x: auto;">
        <div style="font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #ffffff;">📋 Danh Sách Giao Dịch Mới Nhất</div>
        <table style="width: 100%; border-collapse: collapse; font-size: 13px; text-align: left;">
            <thead>
                <tr>
                    <th style="color: #00ffcc; padding: 12px 10px; border-bottom: 1px solid #1e293b;">Thời gian</th>
                    <th style="color: #00ffcc; padding: 12px 10px; border-bottom: 1px solid #1e293b;">Game / ID</th>
                    <th style="color: #00ffcc; padding: 12px 10px; border-bottom: 1px solid #1e293b;">Gói nạp</th>
                    <th style="color: #00ffcc; padding: 12px 10px; border-bottom: 1px solid #1e293b;">Thanh toán</th>
                    <th style="color: #00ffcc; padding: 12px 10px; border-bottom: 1px solid #1e293b;">Thao tác</th>
                </tr>
            </thead>
            <tbody id="adminOrderTable"></tbody>
        </table>
    </div>
</div>

<script>
    window.onload = function() { renderAdminTable(); };

    function renderAdminTable() {
        let history = JSON.parse(localStorage.getItem('viper_history')) || [];
        let tbody = document.getElementById("adminOrderTable");
        document.getElementById("totalOrders").innerText = history.length;

        if (history.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 20px;">Chưa có giao dịch nào được ghi nhận!</td></tr>`;
            return;
        }

        tbody.innerHTML = "";
        history.forEach((item, index) => {
            let tr = document.createElement("tr");
            let cardInfoHtml = item.card ? `<div style="font-size: 11px; color: #cbd5e1; margin-top: 4px; background: rgba(11, 15, 25, 0.7); padding: 4px; border-radius: 4px;">Loại: <b>${item.card.cardType}</b> (${item.card.cardPrice})<br>Mã: <b style="color:#00ffcc">${item.card.cardCode}</b><br>Seri: ${item.card.cardSerial}</div>` : "";

            tr.innerHTML = `
                <td style="color: #94a3b8; font-size: 12px; padding: 12px 10px; border-bottom: 1px solid #1e293b;">${item.time || 'Vừa xong'}</td>
                <td style="padding: 12px 10px; border-bottom: 1px solid #1e293b;"><b>[${item.game}]</b><br><span style="color: #00ffcc;">${item.fullId}</span></td>
                <td style="padding: 12px 10px; border-bottom: 1px solid #1e293b;">${item.package}</td>
                <td style="padding: 12px 10px; border-bottom: 1px solid #1e293b;"><span style="background: #2a3b6c; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 11px;">${item.payment}</span>${cardInfoHtml}</td>
                <td style="padding: 12px 10px; border-bottom: 1px solid #1e293b;"><button onclick="deleteOrder(${index})" style="background: #ff3366; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; width: auto;">Xóa</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function deleteOrder(index) {
        if (confirm("Bạn có chắc chắn muốn xóa đơn hàng này không?")) {
            let history = JSON.parse(localStorage.getItem('viper_history')) || [];
            history.splice(index, 1);
            localStorage.setItem('viper_history', JSON.stringify(history));
            renderAdminTable();
        }
    }

    function exportData() {
        let history = localStorage.getItem('viper_history') || '[]';
        let blob = new Blob([history], { type: "application/json" });
        let url = URL.createObjectURL(blob);
        let a = document.createElement("a");
        a.href = url; a.download = "viper_history_backup.json";
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    function importData(event) {
        let file = event.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            try {
                let importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    localStorage.setItem('viper_history', JSON.stringify(importedData));
                    renderAdminTable();
                    alert("✔ Khôi phục dữ liệu thành công!");
                } else { alert("❌ Định dạng file không hợp lệ!"); }
            } catch (err) { alert("❌ Lỗi đọc file JSON!"); }
        };
        reader.readAsText(file);
    }

    function goHome() { window.location.href = "index.html"; }
</script>

</body>
</html>
