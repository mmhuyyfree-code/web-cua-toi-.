<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Quản Trị Hệ Thống (Debug)</title>
    <style>
        body { background: #0b0f19; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: 0 auto; background: #121826; border: 1px solid #2a3b6c; border-radius: 16px; padding: 16px; }
        .navbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 13px; }
        .navbar a { color: #00ffcc; text-decoration: none; font-weight: bold; }
        .card { background: #1a2236; border: 1px solid #2a3b6c; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 12px; }
        .btn { background: #ef4444; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .btn-success { background: #00ffcc; color: #0b0f19; }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <span style="color: #00ffcc; font-weight: bold;">🛡️ TRANG QUẢN TRỊ (DEBUG)</span>
        <a href="index.html">Về Trang Chủ</a>
    </div>

    <button class="btn" onclick="clearAllOrders()">🗑️ XÓA SẠCH VÀ LÀM MỚI LƯU TRỮ (LOCALSTORAGE)</button>

    <h3 style="color: #facc15; font-size: 14px; margin-bottom: 8px;">📦 Danh sách đơn hàng trong bộ nhớ:</h3>
    <div id="debugList">Đang tải...</div>
</div>

<script>
    function loadDebugData() {
        let raw = localStorage.getItem('viper_orders');
        let container = document.getElementById('debugList');
        
        if (!raw) {
            container.innerHTML = '<div class="card" style="color: #ef4444;">Không tìm thấy key "viper_orders" trong localStorage! Có thể bạn chưa tạo đơn hàng nào ở trang goi-nap.html.</div>';
            return;
        }

        let orders = [];
        try {
            orders = JSON.parse(raw);
        } catch(e) {
            container.innerHTML = '<div class="card" style="color: #ef4444;">Dữ liệu bị lỗi định dạng JSON!</div>';
            return;
        }

        if (orders.length === 0) {
            container.innerHTML = '<div class="card" style="color: #94a3b8;">Mảng đơn hàng đang trống []. Hãy qua trang goi-nap.html mua 1 gói game để test.</div>';
            return;
        }

        let html = '';
        orders.forEach((o, index) => {
            html += `
                <div class="card">
                    <div style="color: #00ffcc; font-weight: bold; margin-bottom: 4px;">Đơn số #${index + 1} - Trạng thái: ${o.status || 'Chưa rõ'}</div>
                    <div><b>Tài khoản:</b> ${o.username || 'Không có'}</div>
                    <div><b>Game:</b> ${o.game || o.type || 'Không có'}</div>
                    <div><b>Gói:</b> ${o.package || o.details || 'Không có'}</div>
                    <div><b>ID / Thông tin:</b> ${o.fullId || o.amount || 'Không có'}</div>
                    <div style="margin-top: 8px;">
                        ${o.status === 'Chờ xử lý' ? `<button class="btn btn-success" onclick="approveOrder(${index})">Duyệt ngay đơn này</button>` : '<span style="color: #22c55e;">Đã xử lý</span>'}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function approveOrder(index) {
        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
        if (orders[index]) {
            orders[index].status = "Thành công";
            localStorage.setItem('viper_orders', JSON.stringify(orders));
            alert("✔ Đã duyệt thành công đơn hàng số #" + (index + 1));
            loadDebugData();
        }
    }

    function clearAllOrders() {
        if(confirm("Bạn có chắc chắn muốn xóa sạch dữ liệu cũ không?")) {
            localStorage.removeItem('viper_orders');
            alert("Đã xóa! Bây giờ hãy qua trang goi-nap.html tạo lại đơn mới.");
            loadDebugData();
        }
    }

    loadDebugData();
</script>

</body>
</html>
