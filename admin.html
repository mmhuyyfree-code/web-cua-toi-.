<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Đơn Hàng - VIPER SHOP</title>
    <style>
        body {
            background: #0b0f19 url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.9); z-index: -1;
        }
        .container {
            background: rgba(18, 24, 38, 0.95);
            width: 100%; max-width: 600px; padding: 25px;
            border-radius: 16px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            border: 2px solid #ff007f; box-sizing: border-box;
        }
        h2 {
            text-align: center; margin-bottom: 15px; font-size: 22px; color: #ffffff;
        }
        /* Bảng Thống Kê Doanh Thu */
        .stats-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c;
            border-radius: 10px; padding: 12px; text-align: center;
        }
        .stat-title { font-size: 12px; color: #94a3b8; font-weight: bold; margin-bottom: 4px; }
        .stat-value { font-size: 18px; color: #00ffcc; font-weight: 900; }

        .order-list {
            max-height: 350px; overflow-y: auto; margin-bottom: 15px;
            border: 1px solid #2a3b6c; border-radius: 10px; padding: 10px;
            background: rgba(11, 15, 25, 0.8);
        }
        .order-item {
            background: rgba(26, 34, 54, 0.9); padding: 12px; border-radius: 8px;
            margin-bottom: 10px; border-left: 4px solid #00ffcc; font-size: 13px; color: #e2e8f0;
        }
        .order-item.card-payment { border-left-color: #ff007f; }
        .order-header {
            display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; color: #ffffff;
        }
        .order-details { font-size: 12px; color: #cbd5e1; line-height: 1.5; }
        .btn-group {
            display: flex; gap: 10px;
        }
        button {
            flex: 1; background: linear-gradient(135deg, #ff007f, #7928ca);
            color: #ffffff; border: none; padding: 12px; border-radius: 8px;
            font-size: 14px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }
        .btn-back {
            background: #2a3b6c; color: #ffffff; box-shadow: none;
        }
        .empty-msg { text-align: center; color: #94a3b8; padding: 20px; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛠 TRANG QUẢN TRỊ VIPER SHOP</h2>

    <!-- Thống kê doanh thu & đơn hàng -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">📦 TỔNG ĐƠN HÀNG</div>
            <div class="stat-value" id="totalOrders">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">💰 TỔNG DOANH THU (ƯỚC TÍNH)</div>
            <div class="stat-value" id="totalRevenue">0 VNĐ</div>
        </div>
    </div>

    <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #cbd5e1;">📋 Danh Sách Giao Dịch Thực Tế:</div>
    <div class="order-list" id="adminOrderList">
        <div class="empty-msg">Chưa có giao dịch nào phát sinh.</div>
    </div>

    <div class="btn-group">
        <button type="button" class="btn-back" onclick="goHome()">⬅ VỀ TRANG CHỦ</button>
        <button type="button" onclick="clearHistory()" style="background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);">🗑 XÓA LỊCH SỬ</button>
    </div>
</div>

<script>
    window.onload = function() {
        loadAdminData();
    };

    function loadAdminData() {
        let history = JSON.parse(localStorage.getItem('viper_history')) || [];
        let listContainer = document.getElementById("adminOrderList");
        
        document.getElementById("totalOrders").innerText = history.length;

        // Tính tổng doanh thu dựa trên tên gói nạp (lọc các chữ số k, tr, v.v.)
        let estimatedRevenue = 0;
        history.forEach(item => {
            let pkgText = item.package.toLowerCase();
            if (pkgText.includes("500k")) estimatedRevenue += 500000;
            else if (pkgText.includes("200k")) estimatedRevenue += 200000;
            else if (pkgText.includes("100k")) estimatedRevenue += 100000;
            else if (pkgText.includes("50k")) estimatedRevenue += 50000;
            else if (pkgText.includes("20k")) estimatedRevenue += 20000;
            else if (pkgText.includes("10k")) estimatedRevenue += 10000;
        });

        document.getElementById("totalRevenue").innerText = estimatedRevenue.toLocaleString('vi-VN') + " VNĐ";

        if (history.length === 0) {
            listContainer.innerHTML = `<div class="empty-msg">Chưa có giao dịch nào phát sinh.</div>`;
            return;
        }

        listContainer.innerHTML = "";
        history.forEach((item, index) => {
            let isCard = item.payment === "Thẻ cào";
            let div = document.createElement("div");
            div.className = `order-item ${isCard ? 'card-payment' : ''}`;
            
            let cardHtml = "";
            if (isCard && item.card) {
                cardHtml = `<br>💳 <b>Thẻ:</b> ${item.card.cardType} - ${item.card.cardPrice} | <b>Mã:</b> ${item.card.cardCode} | <b>Seri:</b> ${item.card.cardSerial}`;
            }

            div.innerHTML = `
                <div class="order-header">
                    <span>#${history.length - index} - [${item.game}]</span>
                    <span style="color: #00ffcc;">${item.payment}</span>
                </div>
                <div class="order-details">
                    👤 <b>ID/Tên:</b> <span style="color: #ffffff;">${item.fullId}</span><br>
                    💎 <b>Gói:</b> ${item.package}<br>
                    ⏰ <b>Thời gian:</b> ${item.time}
                    ${cardHtml}
                </div>
            `;
            listContainer.appendChild(div);
        });
    }

    function clearHistory() {
        if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử giao dịch không?")) {
            localStorage.removeItem('viper_history');
            loadAdminData();
            alert("Đã xóa sạch lịch sử giao dịch!");
        }
    }

    function goHome() {
        window.location.href = "index.html";
    }
</script>

</body>
</html>
