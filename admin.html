<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Hệ Thống - VIPER SHOP</title>
    <style>
        body {
            background: #0b0f19 url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px;
            color: #ffffff;
            display: flex; justify-content: center;
            min-height: 100vh;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.92); z-index: -1;
        }
        .container {
            width: 100%; max-width: 800px;
        }
        .header-box {
            background: rgba(18, 24, 38, 0.95);
            border: 2px solid #ff007f;
            border-radius: 14px;
            padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.3);
            margin-bottom: 20px;
        }
        h2 { margin: 0; font-size: 22px; color: #ff007f; text-shadow: 0 0 10px rgba(255,0,127,0.5); }
        .stats-box {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(18, 24, 38, 0.95);
            border: 1px solid #2a3b6c; border-radius: 12px; padding: 15px; text-align: center;
        }
        .stat-card h3 { margin: 0 0 5px 0; font-size: 13px; color: #94a3b8; }
        .stat-card .value { font-size: 22px; font-weight: bold; color: #00ffcc; }

        .backup-section {
            background: rgba(18, 24, 38, 0.95);
            border: 1px dashed #00ffcc; border-radius: 12px; padding: 15px;
            margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .btn-backup {
            background: linear-gradient(135deg, #00ffcc, #00bfff); color: #0b0f19;
            border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }
        .btn-restore {
            background: #2a3b6c; color: #ffffff;
            border: 1px solid #00ffcc; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;
        }

        .table-container {
            background: rgba(18, 24, 38, 0.95);
            border: 2px solid #00ffcc; border-radius: 14px; padding: 20px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
            overflow-x: auto;
        }
        table {
            width: 100%; border-collapse: collapse; font-size: 13px; text-align: left;
        }
        th, td {
            padding: 12px 10px; border-bottom: 1px solid #1e293b;
        }
        th { color: #00ffcc; font-weight: bold; }
        .badge-method {
            background: #2a3b6c; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 11px;
        }
        .card-detail {
            font-size: 11px; color: #cbd5e1; margin-top: 4px; background: rgba(11, 15, 25, 0.7); padding: 4px; border-radius: 4px;
        }
        .btn-action {
            background: #ff3366; color: white; border: none; padding: 6px 10px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px;
        }
        .btn-action:hover { opacity: 0.8; }
        .btn-back {
            background: linear-gradient(135deg, #00ffcc, #00bfff); color: #0b0f19;
            border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;
        }
        .empty-msg { text-align: center; color: #94a3b8; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h2>🛠️ QUẢN TRỊ HỆ THỐNG VIPER</h2>
        <button class="btn-back" onclick="goHome()">⬅ VỀ TRANG CHỦ</button>
    </div>

    <div class="stats-box">
        <div class="stat-card">
            <h3>TỔNG SỐ GIAO DỊCH</h3>
            <div class="value" id="totalOrders">0</div>
        </div>
        <div class="stat-card">
            <h3>TRẠNG THÁI HỆ THỐNG</h3>
            <div class="value" style="color: #00ffcc; font-size: 18px; margin-top: 4px;">🟢 Hoạt động mượt mà</div>
        </div>
    </div>

    <!-- Khu vực Sao lưu & Khôi phục dữ liệu -->
    <div class="backup-section">
        <div>
            <div style="font-weight: bold; font-size: 14px; color: #00ffcc; margin-bottom: 2px;">💾 Quản Lý Dữ Liệu Đơn Hàng</div>
            <div style="font-size: 12px; color: #94a3b8;">Sao lưu file dự phòng hoặc khôi phục dữ liệu lịch sử nhanh chóng.</div>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-backup" onclick="exportData()">📥 Xuất Dữ Liệu (Backup)</button>
            <button class="btn-restore" onclick="document.getElementById('importFile').click()">📤 Khôi Phục (Restore)</button>
            <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <div class="table-container">
        <div style="font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #ffffff;">📋 Danh Sách Giao Dịch Mới Nhất</div>
        <table>
            <thead>
                <tr>
                    <th>Thời gian</th>
                    <th>Game / ID</th>
                    <th>Gói nạp</th>
                    <th>Thanh toán</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="adminOrderTable">
                <!-- Dữ liệu được load động -->
            </tbody>
        </table>
    </div>
</div>

<script>
    window.onload = function() {
        renderAdminTable();
    };

    function renderAdminTable() {
        let history = JSON.parse(localStorage.getItem('viper_history')) || [];
        let tbody = document.getElementById("adminOrderTable");
        document.getElementById("totalOrders").innerText = history.length;

        if (history.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="empty-msg">Chưa có giao dịch nào được ghi nhận!</td></tr>`;
            return;
        }

        tbody.innerHTML = "";
        history.forEach((item, index) => {
            let tr = document.createElement("tr");
            
            let cardInfoHtml = "";
            if (item.card) {
                cardInfoHtml = `<div class="card-detail">Loại: <b>${item.card.cardType}</b> (${item.card.cardPrice})<br>Mã: <b style="color:#00ffcc">${item.card.cardCode}</b><br>Seri: ${item.card.cardSerial}</div>`;
            }

            tr.innerHTML = `
                <td style="color: #94a3b8; font-size: 12px;">${item.time || 'Vừa xong'}</td>
                <td><b>[${item.game}]</b><br><span style="color: #00ffcc;">${item.fullId}</span></td>
                <td>${item.package}</td>
                <td><span class="badge-method">${item.payment}</span>${cardInfoHtml}</td>
                <td><button class="btn-action" onclick="deleteOrder(${index})">Xóa</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function deleteOrder(index) {
        if (confirm("Bạn có chắc chắn muốn xóa đơn hàng này khỏi lịch sử không?")) {
            let history = JSON.parse(localStorage.getItem('viper_history')) || [];
            history.splice(index, 1);
            localStorage.setItem('viper_history', JSON.stringify(history));
            renderAdminTable();
        }
    }

    // Xuất file JSON sao lưu dữ liệu
    function exportData() {
        let history = localStorage.getItem('viper_history') || '[]';
        let blob = new Blob([history], { type: "application/json" });
        let url = URL.createObjectURL(blob);
        let a = document.createElement("a");
        a.href = url;
        a.download = "viper_history_backup.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // Nhập file JSON để khôi phục dữ liệu
    function importData(event) {
        let file = event.target.files[0];
        if (!file) return;

        let reader = new FileReader();
        reader.onload = function(e) {
            try {
                let importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    localStorage.setItem('viper_history', JSON.stringify(importedData));
                    renderAdminTable();
                    alert("✔ Khôi phục dữ liệu thành công!");
                } else {
                    alert("❌ Định dạng file không hợp lệ!");
                }
            } catch (err) {
                alert("❌ Lỗi đọc file JSON!");
            }
        };
        reader.readAsText(file);
    }

    function goHome() {
        window.location.href = "index.html";
    }
</script>

</body>
</html>
