<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Quản Trị Hệ Thống</title>
    <style>
        body { background: #0b0f19; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: 0 auto; background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; border-radius: 16px; padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #121826; padding: 12px 15px; border-radius: 12px; border: 1px solid #2a3b6c; margin-bottom: 12px; font-size: 13px; }
        .navbar a { color: #cbd5e1; text-decoration: none; font-weight: bold; background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 6px; }
        .tab-box { display: flex; gap: 8px; margin-bottom: 15px; background: #121826; padding: 4px; border-radius: 10px; border: 1px solid #2a3b6c; }
        .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: #94a3b8; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; font-size: 12px; }
        .tab-btn.active { background: #00ffcc; color: #0b0f19; }
        .panel { display: none; }
        .panel.active { display: block; }
        .admin-card { background: #121826; border: 1px solid #2a3b6c; padding: 14px; border-radius: 12px; margin-bottom: 12px; position: relative; }
        .admin-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #facc15; border-radius: 4px 0 0 4px; }
        .row-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
        .label { color: #94a3b8; }
        .value { font-weight: 600; color: #f8fafc; }
        .action-box { display: flex; gap: 8px; margin-top: 12px; border-top: 1px solid #1e293b; padding-top: 10px; }
        .btn-approve { flex: 1; background: #00ffcc; color: #0b0f19; border: none; padding: 8px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .btn-reject { flex: 1; background: #ff3366; color: white; border: none; padding: 8px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .badge-status { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; background: rgba(250,204,21,0.15); color: #facc15; }
        .empty-text { color: #64748b; font-size: 12px; font-style: italic; background: #121826; padding: 15px; border-radius: 8px; text-align: center; border: 1px dashed #2a3b6c; }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <span style="color: #00ffcc; font-weight: bold;">🛡️ ADMIN PANEL</span>
        <a href="index.html">Về Trang Chủ</a>
    </div>

    <div class="tab-box">
        <button class="tab-btn active" id="tabBtnDeposit" onclick="switchTab('deposit')">💰 Duyệt Nạp Ví</button>
        <button class="tab-btn" id="tabBtnGame" onclick="switchTab('game')">🎮 Duyệt Gói Game</button>
    </div>

    <div class="panel active" id="panelDeposit">
        <div id="listDeposit"></div>
    </div>
    <div class="panel" id="panelGame">
        <div id="listGame"></div>
    </div>
</div>

<script>
    function switchTab(type) {
        document.getElementById('tabBtnDeposit').classList.toggle('active', type === 'deposit');
        document.getElementById('tabBtnGame').classList.toggle('active', type === 'game');
        document.getElementById('panelDeposit').classList.toggle('active', type === 'deposit');
        document.getElementById('panelGame').classList.toggle('active', type === 'game');
    }

    function loadData() {
        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];

        // 1. Lọc đơn nạp ví
        let deposits = orders.filter(o => o.category === 'deposit' || o.type?.includes('Chuyển khoản') || o.type?.includes('Thẻ Cào'));
        let depHtml = '';
        if (deposits.length === 0) {
            depHtml = '<div class="empty-text">Không có yêu cầu nạp ví nào đang chờ.</div>';
        } else {
            deposits.forEach((o) => {
                let realIdx = orders.indexOf(o);
                depHtml += `
                    <div class="admin-card">
                        <div class="row-flex"><span class="label">Tài khoản:</span><span class="value" style="color:#00ffcc;">👤 ${o.username || 'Khách'}</span></div>
                        <div class="row-flex"><span class="label">Hình thức:</span><span class="value">${o.type || 'Nạp Ví'}</span></div>
                        <div class="row-flex"><span class="label">Số tiền:</span><span class="value" style="color:#00ffcc;">+${Number(o.amount || 0).toLocaleString()}đ</span></div>
                        <div class="row-flex"><span class="label">Trạng thái:</span><span class="badge-status">${o.status || 'Chờ xử lý'}</span></div>
                        <div style="color: #64748b; font-size: 10px; margin-top: 4px;">🕒 ${o.time || ''}</div>
                        ${o.status === 'Chờ xử lý' ? `
                            <div class="action-box">
                                <button class="btn-approve" onclick="approveDeposit(${realIdx})">✔ Duyệt (+ Tiền)</button>
                                <button class="btn-reject" onclick="rejectOrder(${realIdx})">✖ Từ chối</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
        }
        document.getElementById('listDeposit').innerHTML = depHtml;

        // 2. Lọc đơn mua gói game
        let games = orders.filter(o => o.game && o.package);
        let gameHtml = '';
        if (games.length === 0) {
            gameHtml = '<div class="empty-text">Không có đơn mua gói game nào đang chờ.</div>';
        } else {
            games.forEach((o) => {
                let realIdx = orders.indexOf(o);
                gameHtml += `
                    <div class="admin-card">
                        <div class="row-flex"><span class="label">Tài khoản:</span><span class="value" style="color:#00ffcc;">👤 ${o.username || 'Khách'}</span></div>
                        <div class="row-flex"><span class="label">Game:</span><span class="value" style="color:#facc15;">🎮 ${o.game}</span></div>
                        <div class="row-flex"><span class="label">Gói mua:</span><span class="value" style="color:#38bdf8;">${o.package}</span></div>
                        <div class="row-flex"><span class="label">ID Nhân vật:</span><span class="value">${o.fullId || 'Không có'}</span></div>
                        <div class="row-flex"><span class="label">Trạng thái:</span><span class="badge-status">${o.status || 'Chờ xử lý'}</span></div>
                        <div style="color: #64748b; font-size: 10px; margin-top: 4px;">🕒 ${o.time || ''}</div>
                        ${o.status === 'Chờ xử lý' ? `
                            <div class="action-box">
                                <button class="btn-approve" onclick="approveGame(${realIdx})">✔ Hoàn tất</button>
                                <button class="btn-reject" onclick="rejectOrder(${realIdx})">✖ Từ chối</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
        }
        document.getElementById('listGame').innerHTML = gameHtml;
    }

    function approveDeposit(idx) {
        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
        let order = orders[idx];
        if (!order) return;

        order.status = "Thành công";

        // Cộng tiền vào user hiện tại đang đăng nhập nếu khớp
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        if (currentUser && currentUser.username === order.username) {
            currentUser.balance = Number(currentUser.balance || 0) + Number(order.amount || 0);
            localStorage.setItem('viper_current_user', JSON.stringify(currentUser));
        }

        // Cộng tiền vào danh sách database users
        let users = JSON.parse(localStorage.getItem('viper_users')) || [];
        users = users.map(u => u.username === order.username ? { ...u, balance: Number(u.balance || 0) + Number(order.amount || 0) } : u);
        localStorage.setItem('viper_users', JSON.stringify(users));

        localStorage.setItem('viper_orders', JSON.stringify(orders));
        alert("✔ Đã duyệt nạp tiền thành công và cộng ví cho user!");
        loadData();
    }

    function approveGame(idx) {
        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
        if (orders[idx]) {
            orders[idx].status = "Thành công";
            localStorage.setItem('viper_orders', JSON.stringify(orders));
            alert("✔ Đã hoàn tất đơn hàng game!");
            loadData();
        }
    }

    function rejectOrder(idx) {
        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
        if (orders[idx]) {
            orders[idx].status = "Từ chối";
            localStorage.setItem('viper_orders', JSON.stringify(orders));
            alert("✖ Đã từ chối đơn hàng.");
            loadData();
        }
    }

    loadData();
</script>
</body>
</html>
