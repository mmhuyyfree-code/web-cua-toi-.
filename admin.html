<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Quản Trị Hệ Thống</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0b0f19; color: white; font-family: Arial, sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: 0 auto; }
        .navbar { display: flex; justify-content: space-between; background: #121826; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; }
        .navbar a { color: #cbd5e1; text-decoration: none; font-weight: bold; }
        .tab-box { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; background: #121826; border: 1px solid #2a3b6c; color: #cbd5e1; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; font-size: 12px; }
        .tab-btn.active { background: #00ffcc; color: #0b0f19; border-color: #00ffcc; }
        .panel { display: none; }
        .panel.active { display: block; }
        .card { background: #1a2236; border: 1px solid #2a3b6c; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
        .btn-approve { background: #00ffcc; color: #0b0f19; border: none; padding: 6px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-reject { background: #ff3366; color: white; border: none; padding: 6px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <span style="color: #00ffcc; font-weight: bold;">ADMIN PANEL</span>
        <a href="index.html">Về Trang Chủ</a>
    </div>

    <div class="tab-box">
        <button class="tab-btn active" id="tabBtnDeposit" onclick="switchAdminTab('deposit')">Duyệt Nạp Tiền</button>
        <button class="tab-btn" id="tabBtnGame" onclick="switchAdminTab('game')">Duyệt Gói Game</button>
    </div>

    <!-- TAB 1: DUYỆT NẠP TIỀN -->
    <div class="panel active" id="adminDepositPanel">
        <h3 style="color: #00ffcc; font-size: 15px;">Danh sách yêu cầu nạp tiền</h3>
        <div id="adminDepositList"></div>
    </div>

    <!-- TAB 2: DUYỆT GÓI GAME -->
    <div class="panel" id="adminGamePanel">
        <h3 style="color: #00ffcc; font-size: 15px;">Danh sách đơn mua gói game</h3>
        <div id="adminGameList"></div>
    </div>
</div>

<script>
    function switchAdminTab(type) {
        document.getElementById('tabBtnDeposit').classList.toggle('active', type === 'deposit');
        document.getElementById('tabBtnGame').classList.toggle('active', type === 'game');
        document.getElementById('adminDepositPanel').classList.toggle('active', type === 'deposit');
        document.getElementById('adminGamePanel').classList.toggle('active', type === 'game');
    }

    function loadAdminData() {
        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];

        // 1. Render danh sách Nạp tiền
        let deposits = orders.filter(o => o.category === 'deposit' || o.type === 'Chuyển khoản QR' || o.type === 'Nạp Thẻ Cào');
        let depositContainer = document.getElementById('adminDepositList');
        if (deposits.length === 0) {
            depositContainer.innerHTML = '<div style="color: #94a3b8; font-size: 12px; font-style: italic;">Không có yêu cầu nạp tiền nào.</div>';
        } else {
            depositContainer.innerHTML = deposits.map((o, index) => `
                <div class="card">
                    <div>Tài khoản: <b style="color: #00ffcc;">${o.username}</b></div>
                    <div>Hình thức: <b>${o.type}</b></div>
                    <div>Chi tiết: <b>${o.details || ''}</b></div>
                    <div>Số tiền: <b style="color: #00ffcc;">+${Number(o.amount || 0).toLocaleString('vi-VN')}đ</b></div>
                    <div>Trạng thái: <b>${o.status}</b></div>
                    <div style="color: #94a3b8; font-size: 11px; margin-bottom: 8px;">Thời gian: ${o.time}</div>
                    ${o.status === 'Chờ xử lý' ? `
                        <button class="btn-approve" onclick="approveDeposit('${o.id || index}')">Duyệt (+ Tiền)</button>
                        <button class="btn-reject" onclick="rejectOrder('${o.id || index}')">Từ chối</button>
                    ` : ''}
                </div>
            `).join('');
        }

        // 2. Render danh sách Gói game
        let games = orders.filter(o => o.category === 'game' || (!o.category && o.type !== 'Chuyển khoản QR' && o.type !== 'Nạp Thẻ Cào'));
        let gameContainer = document.getElementById('adminGameList');
        if (games.length === 0) {
            gameContainer.innerHTML = '<div style="color: #94a3b8; font-size: 12px; font-style: italic;">Không có đơn mua gói game nào.</div>';
        } else {
            gameContainer.innerHTML = games.map((o, index) => `
                <div class="card">
                    <div>Tài khoản: <b style="color: #00ffcc;">${o.username}</b></div>
                    <div>Gói: <b>${o.packageName || o.type}</b></div>
                    <div>ID Nhân vật: <b>${o.gameId || 'N/A'}</b></div>
                    <div>Trạng thái: <b>${o.status}</b></div>
                    <div style="color: #94a3b8; font-size: 11px; margin-bottom: 8px;">Thời gian: ${o.time}</div>
                    ${o.status === 'Chờ xử lý' ? `
                        <button class="btn-approve" onclick="approveGame('${o.id || index}')">Xác nhận xong</button>
                        <button class="btn-reject" onclick="rejectOrder('${o.id || index}')">Từ chối</button>
                    ` : ''}
                </div>
            `).join('');
        }
    }

    // Duyệt nạp tiền: Cập nhật trạng thái thành công và CỘNG TIỀN vào tài khoản user tương ứng
    function approveDeposit(targetId) {
        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
        let order = orders.find(o => (o.id === targetId) || (orders.indexOf(o).toString() === targetId));
        if (!order) return;

        order.status = "Thành công";

        // Cộng tiền vào tài khoản người dùng trong kho lưu trữ chung
        // (Giả lập cập nhật vào user nếu lưu theo danh sách tài khoản)
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        if (currentUser && currentUser.username === order.username) {
            currentUser.balance = Number(currentUser.balance || 0) + Number(order.amount || 0);
            localStorage.setItem('viper_current_user', JSON.stringify(currentUser));
        }

        localStorage.setItem('viper_orders', JSON.stringify(orders));
        alert("Đã duyệt nạp tiền và cộng số dư thành công!");
        loadAdminData();
    }

    // Duyệt gói game: Chỉ cập nhật trạng thái đơn thành công
    function approveGame(targetId) {
        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
        let order = orders.find(o => (o.id === targetId) || (orders.indexOf(o).toString() === targetId));
        if (!order) return;

        order.status = "Thành công";
        localStorage.setItem('viper_orders', JSON.stringify(orders));
        alert("Đã xác nhận hoàn tất gói game!");
        loadAdminData();
    }

    function rejectOrder(targetId) {
        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
        let order = orders.find(o => (o.id === targetId) || (orders.indexOf(o).toString() === targetId));
        if (!order) return;

        order.status = "Từ chối";
        localStorage.setItem('viper_orders', JSON.stringify(orders));
        alert("Đã từ chối đơn hàng.");
        loadAdminData();
    }

    loadAdminData();
</script>
</body>
</html>
