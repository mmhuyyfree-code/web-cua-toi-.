<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Lịch Sử Giao Dịch</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 24, 38, 0.95); padding: 10px 15px; border-bottom: 1px solid #2a3b6c; margin-bottom: 20px; border-radius: 8px; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 15px; font-size: 13px; font-weight: bold; }
        .nav-links a:hover, .nav-links a.active { color: #00ffcc; }
        
        /* Khung lịch sử có thể lướt lên xuống */
        .history-container {
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .history-container::-webkit-scrollbar { width: 5px; }
        .history-container::-webkit-scrollbar-thumb { background: #2a3b6c; border-radius: 4px; }

        .history-item { background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; border-radius: 8px; padding: 12px; margin-bottom: 10px; font-size: 13px; }
        .status-pending { color: #ffaa00; font-weight: bold; } /* Đang chờ xử lý */
        .status-success { color: #00ffcc; font-weight: bold; } /* Thành công */
        .status-rejected { color: #ff3366; font-weight: bold; } /* Từ chối */
    </style>
</head>
<body>

<div class="container" style="max-width: 500px;">
    <div class="navbar">
        <div class="nav-links">
            <a href="index.html">Trang Chủ</a>
            <a href="goi-nap.html">Gói Nạp</a>
            <a href="nap-tien.html">Nạp Ví</a>
            <a href="lich-su.html" class="active">Lịch Sử</a>
        </div>
        <div>
            <a href="login.html" id="logoutBtn" onclick="logout()" style="color: #ff3366; font-size: 11px; text-decoration: none;">Thoát</a>
        </div>
    </div>

    <h3 style="color: #00ffcc; text-align: center; margin-bottom: 15px;">📜 Lịch Sử Giao Dịch Của Bạn</h3>

    <!-- Khu vực cuộn xem toàn bộ lịch sử -->
    <div class="history-container" id="historyList">
        <p style="text-align: center; color: #888;">Đang tải lịch sử...</p>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        if (!currentUser) {
            alert("Vui lòng đăng nhập để xem lịch sử!");
            window.location.href = "login.html";
            return;
        }

        let historyListDiv = document.getElementById('historyList');
        // Lấy lịch sử nạp ví và lịch sử mua gói game
        let walletHistory = JSON.parse(localStorage.getItem('viper_wallet_history')) || [];
        let gameHistory = JSON.parse(localStorage.getItem('viper_orders')) || [];

        // Lọc dữ liệu theo đúng tài khoản đang đăng nhập
        let myWallet = walletHistory.filter(item => item.username === currentUser.username);
        let myGame = gameHistory.filter(item => item.username === currentUser.username);

        let html = '';

        if (myWallet.length === 0 && myGame.length === 0) {
            historyListDiv.innerHTML = `<p style="text-align: center; color: #888;">Chưa có giao dịch nào được thực hiện.</p>`;
            return;
        }

        // Gộp chung và hiển thị lịch sử nạp ví
        myWallet.forEach(item => {
            let statusText = '';
            let statusClass = '';
            if (item.status === 'pending') {
                statusText = '⏳ Đang chờ xử lý (Admin đang kiểm tra)';
                statusClass = 'status-pending';
            } else if (item.status === 'approved') {
                statusText = '✅ Thành công (+ ' + Number(item.amount).toLocaleString('vi-VN') + 'đ)';
                statusClass = 'status-success';
            } else {
                statusText = '❌ Từ chối (' + (item.reason || 'Không rõ') + ')';
                statusClass = 'status-rejected';
            }

            html += `
                <div class="history-item">
                    <div style="font-weight: bold; color: #ffaa00; margin-bottom: 4px;">💳 [Nạp Ví] ${item.method === 'qr' ? 'Chuyển khoản QR' : 'Thẻ cào'}</div>
                    <div>Số tiền: <b>${Number(item.amount).toLocaleString('vi-VN')}đ</b></div>
                    <div>Trạng thái: <span class="${statusClass}">${statusText}</span></div>
                    <div style="font-size: 11px; color: #888; margin-top: 4px;">Thời gian: ${item.time || 'N/A'}</div>
                </div>
            `;
        });

        // Gộp chung và hiển thị lịch sử mua gói game
        myGame.forEach(item => {
            let statusText = '';
            let statusClass = '';
            if (item.status === 'pending') {
                statusText = '⏳ Đang chờ xử lý';
                statusClass = 'status-pending';
            } else if (item.status === 'approved') {
                statusText = '✅ Đã giao thành công';
                statusClass = 'status-success';
            } else {
                statusText = '❌ Đã hủy/Từ chối (' + (item.reason || 'Hoàn tiền vào ví') + ')';
                statusClass = 'status-rejected';
            }

            html += `
                <div class="history-item">
                    <div style="font-weight: bold; color: #00ffcc; margin-bottom: 4px;">🎮 [Mua Gói] ${item.game}</div>
                    <div>Gói: ${item.package} | ID: ${item.playerId}</div>
                    <div>Trạng thái: <span class="${statusClass}">${statusText}</span></div>
                    <div style="font-size: 11px; color: #888; margin-top: 4px;">Thời gian: ${item.time || 'N/A'}</div>
                </div>
            `;
        });

        historyListDiv.innerHTML = html;
    });

    function logout() {
        localStorage.removeItem('viper_current_user');
    }
</script>

</body>
</html>
