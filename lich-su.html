<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Lịch Sử Giao Dịch</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0b0f19; color: white; font-family: Arial, sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: 0 auto; }
        .navbar { display: flex; justify-content: space-between; background: #121826; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; }
        .navbar a { color: #cbd5e1; text-decoration: none; font-weight: bold; margin-right: 10px; }
        .navbar a.active { color: #00ffcc; }
        .card { background: #1a2236; border: 1px solid #2a3b6c; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
        .status-wait { color: #facc15; font-weight: bold; }
        .status-success { color: #00ffcc; font-weight: bold; }
        .status-fail { color: #ff3366; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <div>
            <a href="index.html">Trang Chủ</a>
            <a href="goi-nap.html">Gói Nạp</a>
            <a href="nap-tien.html">Nạp Ví</a>
            <a href="lich-su.html" class="active">Lịch Sử</a>
        </div>
        <div><span id="userBalance" style="color: #00ffcc; font-weight: bold;">0đ</span></div>
    </div>

    <h2 style="color: #00ffcc; font-size: 16px; margin-bottom: 8px;">💳 Lịch Sử Nạp Tiền</h2>
    <div id="depositHistory"></div>

    <h2 style="color: #00ffcc; font-size: 16px; margin-top: 20px; margin-bottom: 8px;">🎮 Lịch Sử Mua Gói Game</h2>
    <div id="gameHistory"></div>
</div>

<script>
    let user = JSON.parse(localStorage.getItem('viper_current_user'));
    if (!user) {
        alert("Vui lòng đăng nhập!");
        window.location.href = "login.html";
    } else {
        document.getElementById('userBalance').innerText = Number(user.balance || 0).toLocaleString('vi-VN') + "đ";
    }

    let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
    let myOrders = orders.filter(o => o.username === user.username);

    // Lọc riêng lịch sử nạp tiền (category === 'deposit' hoặc không có category nhưng thuộc dạng nạp)
    let deposits = myOrders.filter(o => o.category === 'deposit' || o.type === 'Chuyển khoản QR' || o.type === 'Nạp Thẻ Cào');
    let depositDiv = document.getElementById('depositHistory');
    if (deposits.length === 0) {
        depositDiv.innerHTML = '<div style="color: #94a3b8; font-size: 12px; font-style: italic;">Chưa có lịch sử nạp tiền nào.</div>';
    } else {
        depositDiv.innerHTML = deposits.map(o => `
            <div class="card">
                <div>Hình thức: <b>${o.type}</b></div>
                <div>Chi tiết: <b>${o.details || ''}</b></div>
                <div>Số tiền: <b style="color: #00ffcc;">+${Number(o.amount || 0).toLocaleString('vi-VN')}đ</b></div>
                <div>Trạng thái: <span class="${o.status === 'Thành công' ? 'status-success' : (o.status === 'Từ chối' ? 'status-fail' : 'status-wait')}">${o.status}</span></div>
                <div style="color: #94a3b8; font-size: 11px; margin-top: 4px;">Thời gian: ${o.time}</div>
            </div>
        `).join('');
    }

    // Lọc riêng lịch sử mua gói game
    let games = myOrders.filter(o => o.category === 'game' || (!o.category && o.type !== 'Chuyển khoản QR' && o.type !== 'Nạp Thẻ Cào'));
    let gameDiv = document.getElementById('gameHistory');
    if (games.length === 0) {
        gameDiv.innerHTML = '<div style="color: #94a3b8; font-size: 12px; font-style: italic;">Chưa có lịch sử mua gói game nào.</div>';
    } else {
        gameDiv.innerHTML = games.map(o => `
            <div class="card">
                <div>Gói: <b>${o.packageName || o.type}</b></div>
                <div>ID Nhân vật: <b>${o.gameId || 'N/A'}</b></div>
                <div>Trạng thái: <span class="${o.status === 'Thành công' ? 'status-success' : (o.status === 'Từ chối' ? 'status-fail' : 'status-wait')}">${o.status}</span></div>
                <div style="color: #94a3b8; font-size: 11px; margin-top: 4px;">Thời gian: ${o.time}</div>
            </div>
        `).join('');
    }
</script>
</body>
</html>
