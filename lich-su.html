<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Lịch Sử Giao Dịch</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0b0f19; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: 0 auto; background: rgba(26, 34, 54, 0.6); border: 1px solid #2a3b6c; border-radius: 16px; padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #121826; padding: 12px 15px; border-radius: 12px; border: 1px solid #2a3b6c; margin-bottom: 20px; font-size: 13px; }
        .nav-links { display: flex; flex-wrap: wrap; gap: 8px; }
        .navbar a { color: #cbd5e1; text-decoration: none; font-weight: 600; padding: 4px 8px; border-radius: 6px; transition: 0.2s; }
        .navbar a:hover, .navbar a.active { color: #00ffcc; background: rgba(0,255,204,0.1); }
        
        .section-title { color: #00ffcc; font-size: 15px; font-weight: bold; margin: 20px 0 10px 0; display: flex; align-items: center; gap: 6px; border-left: 3px solid #00ffcc; padding-left: 8px; }
        
        .history-card { background: #121826; border: 1px solid #2a3b6c; padding: 14px; border-radius: 12px; margin-bottom: 12px; position: relative; overflow: hidden; }
        .history-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #2a3b6c; }
        .history-card.success::before { background: #00ffcc; }
        .history-card.pending::before { background: #facc15; }
        .history-card.fail::before { background: #ff3366; }

        .row-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
        .label { color: #94a3b8; }
        .value { font-weight: 600; color: #f8fafc; }
        
        .badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .badge-success { background: rgba(0,255,204,0.15); color: #00ffcc; border: 1px solid rgba(0,255,204,0.3); }
        .badge-pending { background: rgba(250,204,21,0.15); color: #facc15; border: 1px solid rgba(250,204,21,0.3); }
        .badge-fail { background: rgba(255,51,102,0.15); color: #ff3366; border: 1px solid rgba(255,51,102,0.3); }
        
        .empty-text { color: #64748b; font-size: 12px; font-style: italic; background: #121826; padding: 12px; border-radius: 8px; text-align: center; border: 1px dashed #2a3b6c; }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <div class="nav-links">
            <a href="index.html">Trang Chủ</a>
            <a href="goi-nap.html">Gói Nạp</a>
            <a href="nap-tien.html">Nạp Ví</a>
            <a href="lich-su.html" class="active">Lịch Sử</a>
        </div>
        <div><span id="userBalance" style="color: #00ffcc; font-weight: bold; font-size: 14px;">0đ</span></div>
    </div>

    <div class="section-title">💳 Lịch Sử Nạp Tiền</div>
    <div id="depositHistory"></div>

    <div class="section-title">🎮 Lịch Sử Mua Gói Game</div>
    <div id="gameHistory"></div>
</div>

<script>
    let user = JSON.parse(localStorage.getItem('viper_current_user'));
    if (!user) {
        alert("Vui lòng đăng nhập!");
        window.location.href = "login.html";
    } else {
        document.getElementById('userBalance').innerText = Number(user.balance || 0).toLocaleString('vi-VN') + "đ";
    }

    let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
    let myOrders = orders.filter(o => o.username === user.username);

    // Lịch sử nạp tiền
    let deposits = myOrders.filter(o => o.category === 'deposit' || o.type === 'Chuyển khoản QR' || o.type === 'Nạp Thẻ Cào');
    let depositDiv = document.getElementById('depositHistory');
    if (deposits.length === 0) {
        depositDiv.innerHTML = '<div class="empty-text">Chưa có lịch sử nạp tiền nào.</div>';
    } else {
        depositDiv.innerHTML = deposits.map(o => {
            let statusClass = o.status === 'Thành công' ? 'success' : (o.status === 'Từ chối' ? 'fail' : 'pending');
            let badgeClass = o.status === 'Thành công' ? 'badge-success' : (o.status === 'Từ chối' ? 'badge-fail' : 'badge-pending');
            return `
                <div class="history-card ${statusClass}">
                    <div class="row-flex">
                        <span class="label">Hình thức:</span>
                        <span class="value" style="color: #00ffcc;">${o.type}</span>
                    </div>
                    <div class="row-flex">
                        <span class="label">Chi tiết:</span>
                        <span class="value" style="font-size: 12px;">${o.details || 'N/A'}</span>
                    </div>
                    <div class="row-flex">
                        <span class="label">Số tiền:</span>
                        <span class="value" style="color: #00ffcc; font-size: 14px;">+${Number(o.amount || 0).toLocaleString('vi-VN')}đ</span>
                    </div>
                    <div class="row-flex">
                        <span class="label">Trạng thái:</span>
                        <span class="badge ${badgeClass}">${o.status}</span>
                    </div>
                    <div style="color: #64748b; font-size: 10px; margin-top: 8px; text-align: right; border-top: 1px solid #1e293b; padding-top: 4px;">
                        🕒 ${o.time}
                    </div>
                </div>
            `;
        }).join('');
    }

    // Lịch sử mua gói game
    let games = myOrders.filter(o => o.category === 'game' || (!o.category && o.type !== 'Chuyển khoản QR' && o.type !== 'Nạp Thẻ Cào'));
    let gameDiv = document.getElementById('gameHistory');
    if (games.length === 0) {
        gameDiv.innerHTML = '<div class="empty-text">Chưa có lịch sử mua gói game nào.</div>';
    } else {
        gameDiv.innerHTML = games.map(o => {
            let statusClass = o.status === 'Thành công' ? 'success' : (o.status === 'Từ chối' ? 'fail' : 'pending');
            let badgeClass = o.status === 'Thành công' ? 'badge-success' : (o.status === 'Từ chối' ? 'badge-fail' : 'badge-pending');
            return `
                <div class="history-card ${statusClass}">
                    <div class="row-flex">
                        <span class="label">Gói mua:</span>
                        <span class="value" style="color: #38bdf8;">${o.packageName || o.type}</span>
                    </div>
                    <div class="row-flex">
                        <span class="label">ID Nhân vật:</span>
                        <span class="value">${o.gameId || 'N/A'}</span>
                    </div>
                    <div class="row-flex">
                        <span class="label">Trạng thái:</span>
                        <span class="badge ${badgeClass}">${o.status}</span>
                    </div>
                    <div style="color: #64748b; font-size: 10px; margin-top: 8px; text-align: right; border-top: 1px solid #1e293b; padding-top: 4px;">
                        🕒 ${o.time}
                    </div>
                </div>
            `;
        }).join('');
    }
</script>
</body>
</html>
