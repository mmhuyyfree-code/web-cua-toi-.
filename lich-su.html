<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Giao Dịch - VIPER SHOP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 24, 38, 0.95); padding: 10px 15px; border-bottom: 1px solid #2a3b6c; margin-bottom: 20px; border-radius: 8px; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 15px; font-size: 13px; font-weight: bold; }
        .nav-links a:hover, .nav-links a.active { color: #00ffcc; }
        .order-card { background: rgba(26, 34, 54, 0.9); padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #2a3b6c; font-size: 12px; }
    </style>
</head>
<body>

<div class="container" style="max-width: 500px;">
    <!-- THANH MENU ĐIỀU HƯỚNG -->
    <div class="navbar">
        <div class="nav-links">
            <a href="index.html">Trang Chủ</a>
            <a href="nap-tien.html">Nạp Ví</a>
            <a href="lich-su.html" class="active">Lịch Sử</a>
        </div>
        <div id="authArea" style="font-size: 12px;">
            <div id="authLogged">
                <span id="loggedUser" style="color: #00ffcc; font-weight: bold;"></span> 
                (<span id="loggedBalance" style="color: #ffaa00;">0đ</span>)
            </div>
        </div>
    </div>

    <h2>LỊCH SỬ ĐƠN HÀNG CỦA BẠN</h2>

    <div id="myOrderList">
        <!-- Danh sách đơn hàng cá nhân sẽ load vào đây -->
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        if (!currentUser) {
            alert("Vui lòng đăng nhập để xem lịch sử đơn hàng!");
            window.location.href = "login.html";
            return;
        }

        document.getElementById("loggedUser").innerText = currentUser.username;
        document.getElementById("loggedBalance").innerText = Number(currentUser.balance || 0).toLocaleString('vi-VN') + "đ";

        // Lọc lịch sử đơn hàng chỉ hiển thị của riêng tài khoản đang đăng nhập
        let allHistory = JSON.parse(localStorage.getItem('viper_history')) || [];
        let myOrders = allHistory.filter(o => o.username === currentUser.username);

        let container = document.getElementById("myOrderList");
        if (myOrders.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: #cbd5e1; padding: 20px; font-size: 13px;">Bạn chưa có giao dịch nào gần đây.</div>`;
            return;
        }

        let html = "";
        myOrders.forEach(order => {
            let statusColor = order.status === "Đã xử lý" ? "#00ffcc" : "#ffaa00";
            html += `
                <div class="order-card">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                        <span style="color: #cbd5e1;">⏱ ${order.time}</span>
                        <span style="color: ${statusColor}; font-weight: bold;">${order.status}</span>
                    </div>
                    <div><b>Game:</b> ${order.game} | <b>ID:</b> <span style="color: #00ffcc;">${order.fullId}</span></div>
                    <div><b>Gói:</b> ${order.package}</div>
                    <div><b>Thanh toán:</b> ${order.payment}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    });
</script>

</body>
</html>
