<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Nạp Ví / Thẻ Cào</title>
    <style>
        body { background: #0b0f19; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: 0 auto; background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; border-radius: 16px; padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #121826; padding: 12px 15px; border-radius: 12px; border: 1px solid #2a3b6c; margin-bottom: 15px; font-size: 13px; }
        .navbar a { color: #cbd5e1; text-decoration: none; font-weight: bold; background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 6px; }
        h3 { color: #00ffcc; font-size: 16px; margin-bottom: 15px; text-align: center; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        input, select { width: 100%; padding: 10px 12px; background: #121826; border: 1px solid #2a3b6c; color: white; border-radius: 8px; font-size: 13px; box-sizing: border-box; outline: none; }
        input:focus, select:focus { border-color: #00ffcc; }
        .btn { background: #00ffcc; color: #0b0f19; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 10px; box-shadow: 0 4px 12px rgba(0,255,204,0.3); }
        .btn:active { transform: scale(0.98); }
        .bank-info { background: #121826; border: 1px solid #2a3b6c; border-radius: 10px; padding: 12px; margin-bottom: 15px; font-size: 13px; text-align: center; }
        .bank-info span { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <span style="color: #00ffcc; font-weight: bold;">💳 NẠP TIỀN VÀO VÍ</span>
        <a href="index.html">Trang Chủ</a>
    </div>

    <div class="bank-info">
        <div>Chuyển khoản Vietcombank: <span style="color:#facc15;">1039... (VIPER SHOP)</span></div>
        <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;">Nội dung chuyển khoản ghi: <b style="color:#fff;" id="noteSyntax">napvi [TênTàiKhoản]</b></div>
    </div>

    <div class="form-group">
        <label>Hình thức nạp</label>
        <select id="depositType" onchange="toggleForm()">
            <option value="Chuyển khoản QR">Chuyển khoản ngân hàng / QR</option>
            <option value="Thẻ Cào Điện Thoại">Thẻ cào điện thoại (Viettel, Mobi, Vina)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Số tiền muốn nạp (VNĐ)</label>
        <input type="number" id="amount" placeholder="Nhập số tiền, ví dụ: 50000" />
    </div>

    <div id="cardExtraFields" style="display: none;">
        <div class="form-group">
            <label>Loại thẻ</label>
            <select id="cardNetwork">
                <option value="Viettel">Viettel</option>
                <option value="Mobifone">Mobifone</option>
                <option value="Vinaphone">Vinaphone</option>
            </select>
        </div>
        <div class="form-group">
            <label>Mã thẻ cào</label>
            <input type="text" id="cardCode" placeholder="Nhập mã thẻ..." />
        </div>
        <div class="form-group">
            <label>Số seri</label>
            <input type="text" id="cardSerial" placeholder="Nhập số seri..." />
        </div>
    </div>

    <button class="btn" onclick="submitDeposit()">XÁC NHẬN TẠO LỆNH NẠP</button>
</div>

<script>
    let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
    if (!currentUser) {
        alert("Vui lòng đăng nhập trước khi nạp tiền!");
        window.location.href = "login.html";
    } else {
        document.getElementById('noteSyntax').innerText = "napvi " + currentUser.username;
    }

    function toggleForm() {
        let type = document.getElementById('depositType').value;
        document.getElementById('cardExtraFields').style.display = (type === 'Thẻ Cào Điện Thoại') ? 'block' : 'none';
    }

    function submitDeposit() {
        let type = document.getElementById('depositType').value;
        let amount = Number(document.getElementById('amount').value);

        if (!amount || amount <= 0) {
            alert("Vui lòng nhập số tiền hợp lệ!");
            return;
        }

        let newOrder = {
            username: currentUser.username,
            category: 'deposit', // Đánh dấu rõ ràng là đơn nạp ví
            type: type,
            amount: amount,
            details: type === 'Thẻ Cào Điện Thoại' ? `Thẻ: ${document.getElementById('cardNetwork').value} - Mã: ${document.getElementById('cardCode').value}` : 'Chuyển khoản ngân hàng trực tuyến',
            status: 'Chờ xử lý',
            time: new Date().toLocaleString('vi-VN')
        };

        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
        orders.unshift(newOrder); // Đưa lên đầu danh sách
        localStorage.setItem('viper_orders', JSON.stringify(orders));

        alert("✔ Đã tạo yêu cầu nạp tiền thành công! Hệ thống đang chờ Admin duyệt.");
        window.location.href = "lich-su.html";
    }
</script>

</body>
</html>
