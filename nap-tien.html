<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Nạp Tiền Vào Ví</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 24, 38, 0.95); padding: 10px 15px; border-bottom: 1px solid #2a3b6c; margin-bottom: 20px; border-radius: 8px; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 15px; font-size: 13px; font-weight: bold; }
        .nav-links a:hover, .nav-links a.active { color: #00ffcc; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #cbd5e1; margin-bottom: 5px; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #0b0f19; border: 1px solid #2a3b6c; color: white; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 12px; background: #00ffcc; color: #0b0f19; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: #00cca3; }

        /* --- TÙY CHỈNH POPUP THÔNG BÁO ĐẸP MẮT (MODAL) --- */
        #customModal {
            display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(3px);
            align-items: center; justify-content: center;
        }
        .modal-box {
            background: #121826; border: 1px solid #00ffcc; width: 90%; max-width: 380px;
            border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,255,204,0.2);
            animation: modalFadeIn 0.3s ease;
        }
        @keyframes modalFadeIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-title { color: #ffaa00; font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .modal-desc { color: #cbd5e1; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
        .modal-btn { background: #00ffcc; color: #0b0f19; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; }
        .modal-btn:hover { background: #00cca3; }
    </style>
</head>
<body>

<!-- POPUP THÔNG BÁO CHUYÊN NGHIỆP -->
<div id="customModal">
    <div class="modal-box">
        <div class="modal-title" id="modalTitle">⚠️ CẢNH BÁO QUAN TRỌNG</div>
        <div class="modal-desc" id="modalDesc">Nội dung thông báo sẽ hiện ở đây...</div>
        <button class="modal-btn" onclick="closeModal()">ĐÃ HIỂU & TIẾP TỤC</button>
    </div>
</div>

<div class="container" style="max-width: 450px;">
    <div class="navbar">
        <div class="nav-links">
            <a href="index.html">Trang Chủ</a>
            <a href="goi-nap.html">Gói Nạp</a>
            <a href="nap-tien.html" class="active">Nạp Ví</a>
            <a href="lich-su.html">Lịch Sử</a>
        </div>
        <div>
            <a href="login.html" onclick="localStorage.removeItem('viper_current_user')" style="color: #ff3366; font-size: 11px; text-decoration: none;">Thoát</a>
        </div>
    </div>

    <h3 style="color: #00ffcc; text-align: center; margin-bottom: 20px;">💳 Nạp Tiền Vào Ví</h3>

    <div class="form-group">
        <label>Chọn Hình Thức Nạp:</label>
        <select id="napMethod" onchange="toggleMethod()">
            <option value="qr">Chuyển Khoản Ngân Hàng / QR Code</option>
            <option value="card">Thẻ Cào Điện Thoại</option>
        </select>
    </div>

    <!-- PHẦN QR CODE -->
    <div id="qrSection" style="background: rgba(26, 34, 54, 0.9); padding: 15px; border-radius: 8px; border: 1px solid #2a3b6c; margin-bottom: 15px; text-align: center;">
        <p style="color: #cbd5e1; font-size: 12px; margin-bottom: 10px;">Quét mã QR bên dưới để thanh toán tự động:</p>
        <img src="https://img.vietqr.io/image/VCB-123456789-compact2.png?amount=0&addInfo=NAPVI" alt="QR Code" style="width: 180px; border-radius: 6px; margin-bottom: 10px;">
        <p style="color: #ffaa00; font-size: 12px;">Chủ tài khoản: <b>TRAN MINH HUY</b></p>
        <p style="color: #cbd5e1; font-size: 12px;">STK: <b>123456789</b> (Vietcombank)</p>
    </div>

    <!-- PHẦN THẺ CÀO -->
    <div id="cardSection" style="display: none; background: rgba(26, 34, 54, 0.9); padding: 15px; border-radius: 8px; border: 1px solid #2a3b6c; margin-bottom: 15px;">
        <div class="form-group">
            <label>Nhà Mạng:</label>
            <select id="cardNetwork">
                <option value="Viettel">Viettel</option>
                <option value="Mobifone">Mobifone</option>
                <option value="Vinaphone">Vinaphone</option>
            </select>
        </div>
        <div class="form-group">
            <label>Mã Thẻ:</label>
            <input type="text" id="cardCode" placeholder="Nhập mã thẻ cào...">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
            <label>Seri Thẻ:</label>
            <input type="text" id="cardSerial" placeholder="Nhập số seri...">
        </div>
    </div>

    <div class="form-group">
        <label>Nhập Số Tiền Muốn Nạp (VNĐ):</label>
        <input type="number" id="napAmount" placeholder="Ví dụ: 50000">
    </div>

    <button class="btn-submit" onclick="submitNapTien()">GỬI YÊU CẦU NẠP TIỀN</button>
</div>

<script>
    // Vừa vào trang nạp ví, hiển thị Popup cảnh báo đúng yêu cầu
    window.addEventListener('DOMContentLoaded', () => {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        if (!currentUser) {
            alert("Vui lòng đăng nhập trước!");
            window.location.href = "login.html";
            return;
        }

        showModal(
            "⚠️ LƯU Ý QUAN TRỌNG KHI NẠP",
            "Nếu số tiền quý khách nhập không khớp với số tiền đã chuyển, mất shop sẽ không chịu trách nhiệm, hãy chú ý!"
        );
    });

    function showModal(title, desc) {
        document.getElementById('modalTitle').innerHTML = title;
        document.getElementById('modalDesc').innerHTML = desc;
        document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
    }

    function toggleMethod() {
        let method = document.getElementById('napMethod').value;
        if (method === 'qr') {
            document.getElementById('qrSection').style.display = 'block';
            document.getElementById('cardSection').style.display = 'none';
        } else {
            document.getElementById('qrSection').style.display = 'none';
            document.getElementById('cardSection').style.display = 'block';
        }
    }

    function submitNapTien() {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        let method = document.getElementById('napMethod').value;
        let amount = Number(document.getElementById('napAmount').value);

        if (!amount || amount <= 0) {
            showModal("❌ LỖI NHẬP LIỆU", "Vui lòng nhập số tiền cần nạp hợp lệ!");
            return;
        }

        let newRequest = {
            id: 'NAP_' + Date.now(),
            username: currentUser.username,
            method: method,
            amount: amount,
            status: 'pending',
            time: new Date().toLocaleString('vi-VN')
        };

        let walletHistory = JSON.parse(localStorage.getItem('viper_wallet_history')) || [];
        walletHistory.unshift(newRequest);
        localStorage.setItem('viper_wallet_history', JSON.stringify(walletHistory));

        showModal(
            "✅ GỬI YÊU CẦU THÀNH CÔNG",
            "Yêu cầu nạp tiền của bạn đã được ghi nhận và đang ở trạng thái <b>Đang chờ xử lý</b>. Admin sẽ duyệt trong giây lát!"
        );
        
        setTimeout(() => {
            window.location.href = "lich-su.html";
        }, 2000);
    }
</script>

</body>
</html>
