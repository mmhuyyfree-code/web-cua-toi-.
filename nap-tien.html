<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Nạp Tiền Vào Ví</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 24, 38, 0.95); padding: 10px 15px; border-bottom: 1px solid #2a3b6c; margin-bottom: 15px; border-radius: 8px; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 10px; font-size: 12px; font-weight: bold; }
        .nav-links a:hover, .nav-links a.active { color: #00ffcc; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; color: #cbd5e1; margin-bottom: 4px; font-size: 12px; }
        .form-group input, .form-group select { width: 100%; padding: 9px; background: #0b0f19; border: 1px solid #2a3b6c; color: white; border-radius: 6px; font-size: 12px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 11px; background: #00ffcc; color: #0b0f19; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: #00cca3; }

        #customModal {
            display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.75); backdrop-filter: blur(3px);
            align-items: center; justify-content: center;
        }
        .modal-box {
            background: #121826; border: 1px solid #00ffcc; width: 90%; max-width: 360px;
            border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,255,204,0.2);
        }
        .modal-title { color: #ffaa00; font-size: 15px; font-weight: bold; margin-bottom: 10px; }
        .modal-desc { color: #cbd5e1; font-size: 12px; line-height: 1.5; margin-bottom: 18px; }
        .modal-btn { background: #00ffcc; color: #0b0f19; border: none; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 12px; }
    </style>
</head>
<body>

<div id="customModal">
    <div class="modal-box">
        <div class="modal-title">⚠️ LƯU Ý QUAN TRỌNG</div>
        <div class="modal-desc">Nếu số tiền quý khách nhập không khớp với số tiền đã chuyển, shop sẽ không chịu trách nhiệm, hãy chú ý!</div>
        <button class="modal-btn" onclick="closeModal()">ĐÃ HIỂU & TIẾP TỤC</button>
    </div>
</div>

<div class="container" style="max-width: 450px;">
    <div class="navbar">
        <div class="nav-links">
            <a href="index.html">Trang Chủ</a>
            <a href="goi-nap.html">Gói Nạp</a>
            <a href="nap-tien.html" class="active">Nạp Ví</a>
            <a href="lich-su.html">Lịch Sử</a>
        </div>
        <div>
            <a href="login.html" onclick="localStorage.removeItem('viper_current_user')" style="color: #ff3366; font-size: 11px; text-decoration: none;">Thoát</a>
        </div>
    </div>

    <h3 style="color: #00ffcc; text-align: center; margin-bottom: 15px;">💳 Nạp Tiền Vào Ví</h3>

    <div class="form-group">
        <label>Chọn Hình Thức Nạp:</label>
        <select id="napMethod" onchange="toggleMethod()">
            <option value="Chuyển khoản QR">Chuyển Khoản Ngân Hàng / QR Code</option>
            <option value="Thẻ cào">Thẻ Cào Điện Thoại</option>
        </select>
    </div>

    <!-- PHẦN QR CODE -->
    <div id="qrSection" style="background: rgba(26, 34, 54, 0.9); padding: 12px; border-radius: 8px; border: 1px solid #2a3b6c; margin-bottom: 12px; text-align: center;">
        <p style="color: #cbd5e1; font-size: 11px; margin-bottom: 8px;">Quét mã QR bên dưới để chuyển khoản chính xác:</p>
        <img id="qrCodeImg" src="https://img.vietqr.io/image/MB-8877945567-compact2.png?amount=0&addInfo=NAPVI" alt="QR Code Ngân Hàng" style="width: 160px; border-radius: 6px; margin-bottom: 8px;">
        <p style="color: #ffaa00; font-size: 12px;">Nhân viên giao dịch: <b>VI THI HA</b></p>
        <p style="color: #cbd5e1; font-size: 11px;">STK: <b>8877945567</b> (MB Bank)</p>
    </div>

    <!-- PHẦN THẺ CÀO -->
    <div id="cardSection" style="display: none; background: rgba(26, 34, 54, 0.9); padding: 12px; border-radius: 8px; border: 1px solid #2a3b6c; margin-bottom: 12px;">
        <div class="form-group">
            <label>Nhà Mạng:</label>
            <select id="cardNetwork">
                <option value="Viettel">Viettel</option>
                <option value="Mobifone">Mobifone</option>
                <option value="Vinaphone">Vinaphone</option>
                <option value="Garena">Garena</option>
                <option value="Zing">Zing</option>
            </select>
        </div>
        <div class="form-group">
            <label>Chọn Mệnh Giá Thẻ:</label>
            <select id="cardAmount">
                <option value="10000">10.000đ</option>
                <option value="20000">20.000đ</option>
                <option value="50000">50.000đ</option>
                <option value="100000" selected>100.000đ</option>
                <option value="200000">200.000đ</option>
                <option value="500000">500.000đ</option>
            </select>
        </div>
        <div class="form-group">
            <label>Mã Thẻ Cào:</label>
            <input type="text" id="cardCode" placeholder="Nhập mã thẻ...">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
            <label>Số Seri Thẻ:</label>
            <input type="text" id="cardSerial" placeholder="Nhập số seri...">
        </div>
    </div>

    <div class="form-group" id="amountGroup">
        <label>Nhập Số Tiền Đã Chuyển Khoản (VNĐ):</label>
        <input type="number" id="napAmount" placeholder="Ví dụ: 50000" oninput="updateQRWithAmount()">
    </div>

    <button class="btn-submit" onclick="submitNapTien()">GỬI YÊU CẦU NẠP TIỀN</button>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        if (!currentUser) {
            alert("Vui lòng đăng nhập trước!");
            window.location.href = "login.html";
            return;
        }
        document.getElementById('customModal').style.display = 'flex';
    });

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
    }

    function toggleMethod() {
        let method = document.getElementById('napMethod').value;
        if (method === 'Chuyển khoản QR') {
            document.getElementById('qrSection').style.display = 'block';
            document.getElementById('cardSection').style.display = 'none';
            document.getElementById('amountGroup').style.display = 'block';
        } else {
            document.getElementById('qrSection').style.display = 'none';
            document.getElementById('cardSection').style.display = 'block';
            document.getElementById('amountGroup').style.display = 'none';
        }
    }

    function updateQRWithAmount() {
        let amount = document.getElementById('napAmount').value || 0;
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        let username = currentUser ? currentUser.username : "Khách";
        let syntax = "NAPVI " + username;
        let qrUrl = `https://img.vietqr.io/image/MB-8877945567-compact2.png?amount=${amount}&addInfo=${encodeURIComponent(syntax)}&accountName=VI%20THI%20HA`;
        document.getElementById('qrCodeImg').src = qrUrl;
    }

    function submitNapTien() {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        let method = document.getElementById('napMethod').value;
        let amount = 0;
        let cardDetails = null;

        if (method === 'Chuyển khoản QR') {
            amount = Number(document.getElementById('napAmount').value);
            if (!amount || amount <= 0) {
                alert("Vui lòng nhập số tiền bạn đã chuyển khoản chính xác!");
                return;
            }
        } else {
            amount = Number(document.getElementById('cardAmount').value);
            let network = document.getElementById('cardNetwork').value;
            let code = document.getElementById('cardCode').value.trim();
            let serial = document.getElementById('cardSerial').value.trim();
            if (!code || !serial) {
                alert("Vui lòng điền đầy đủ mã thẻ và số seri!");
                return;
            }
            method = `Thẻ cào (${network})`;
            cardDetails = { cardType: network, cardPrice: amount + "đ", cardCode: code, cardSerial: serial };
        }

        // CHỈ LƯU VÀO KHO DUYỆT NẠP VÍ RIÊNG BIỆT (Không làm ảnh hưởng tới lịch sử gói game)
        let walletRequest = {
            username: currentUser.username,
            method: method,
            amount: amount,
            cardInfo: cardDetails,
            status: "Chờ xử lý",
            time: new Date().toLocaleString('vi-VN')
        };

        let walletRequests = JSON.parse(localStorage.getItem('viper_wallet_requests')) || [];
        walletRequests.unshift(walletRequest);
        localStorage.setItem('viper_wallet_requests', JSON.stringify(walletRequests));

        alert("Gửi yêu cầu nạp tiền thành công! Đang chờ quản trị viên xử lý.");
        window.location.href = "lich-su.html";
    }
</script>

</body>
</html>
