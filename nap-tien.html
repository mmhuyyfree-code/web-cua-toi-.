<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nạp Tiền Vào Ví - VIPER SHOP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 24, 38, 0.95); padding: 10px 15px; border-bottom: 1px solid #2a3b6c; margin-bottom: 20px; border-radius: 8px; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 15px; font-size: 13px; font-weight: bold; }
        .nav-links a:hover, .nav-links a.active { color: #00ffcc; }
        .tab-menu { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; background: rgba(26, 34, 54, 0.9); border: 1px solid #2a3b6c; color: #fff; padding: 10px; border-radius: 6px; cursor: pointer; text-align: center; font-weight: bold; font-size: 12px; }
        .tab-btn.active { border-color: #00ffcc; background: rgba(0, 255, 204, 0.1); color: #00ffcc; }
    </style>
</head>
<body>

<div class="container" style="max-width: 500px;">
    <div class="navbar">
        <div class="nav-links">
            <a href="index.html">Trang Chủ</a>
            <a href="goi-nap.html">Gói Nạp</a>
            <a href="nap-tien.html" class="active">Nạp Ví</a>
            <a href="lich-su.html">Lịch Sử</a>
        </div>
        <div id="authArea" style="font-size: 12px;">
            <div id="authLogged">
                <span id="loggedUser" style="color: #00ffcc; font-weight: bold;"></span> 
                (<span id="loggedBalance" style="color: #ffaa00;">0đ</span>)
            </div>
        </div>
    </div>

    <h2>NẠP TIỀN VÀO TÀI KHOẢN</h2>

    <div class="tab-menu">
        <div class="tab-btn active" id="btnQR" onclick="switchTab('qr')">Chuyển Khoản QR</div>
        <div class="tab-btn" id="btnCard" onclick="switchTab('card')">Thẻ Cào Điện Thoại</div>
    </div>

    <!-- KHUNG QR -->
    <div id="paneQR" style="background: rgba(26, 34, 54, 0.8); padding: 15px; border-radius: 8px; border: 1px solid #00ffcc; margin-bottom: 15px; text-align: center;">
        <div style="font-size: 13px; color: #cbd5e1; margin-bottom: 5px;">Quét mã QR để chuyển khoản:</div>
        <div style="background: white; padding: 10px; display: inline-block; border-radius: 6px; margin: 10px 0;">
            <img src="https://img.vietqr.io/image/VCB-123456789-compact.png?amount=50000&addInfo=NAPVI" alt="QR Code" style="width: 140px; height: 140px; display: block;">
        </div>
        <div style="font-size: 12px; color: #ffaa00; font-weight: bold; margin-bottom: 10px;">Nội dung: NAPVI [Tên tài khoản]</div>
        
        <div class="form-group" style="text-align: left;">
            <label>Số tiền đã chuyển (VNĐ):</label>
            <input type="number" id="depositAmount" placeholder="Ví dụ: 50000">
        </div>
        <button type="button" onclick="submitQRRequest()" style="background: linear-gradient(135deg, #00ffcc, #0072ff); color: #0b0f19; font-weight: bold;">GỬI YÊU CẦU DUYỆT</button>
    </div>

    <!-- KHUNG THẺ CÀO -->
    <div id="paneCard" style="display: none; background: rgba(26, 34, 54, 0.8); padding: 15px; border-radius: 8px; border: 1px dashed #ff007f; margin-bottom: 15px;">
        <div class="form-group" style="margin-bottom: 8px;">
            <label>Loại Thẻ:</label>
            <select id="cardType">
                <option value="Viettel">Viettel</option>
                <option value="Mobifone">Mobifone</option>
                <option value="Vinaphone">Vinaphone</option>
            </select>
        </div>
        <div class="form-group" style="margin-bottom: 8px;">
            <label>Mệnh giá:</label>
            <select id="cardAmount">
                <option value="10000">10,000đ</option>
                <option value="20000">20,000đ</option>
                <option value="50000">50,000đ</option>
                <option value="100000">100,000đ</option>
                <option value="200000">200,000đ</option>
                <option value="500000">500,000đ</option>
            </select>
        </div>
        <div class="form-group" style="margin-bottom: 8px;">
            <label>Mã Thẻ (PIN):</label>
            <input type="text" id="cardCode" placeholder="Nhập mã thẻ cào...">
        </div>
        <div class="form-group" style="margin-bottom: 12px;">
            <label>Số Seri:</label>
            <input type="text" id="cardSerial" placeholder="Nhập số seri...">
        </div>
        <button type="button" onclick="submitCardRequest()" style="background: #ff007f; color: white; font-weight: bold;">GỬI THẺ CÀO CHỜ DUYỆT</button>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        if (!currentUser) {
            alert("Vui lòng đăng nhập để nạp ví!");
            window.location.href = "login.html";
            return;
        }
        document.getElementById("loggedUser").innerText = currentUser.username;
        document.getElementById("loggedBalance").innerText = Number(currentUser.balance || 0).toLocaleString('vi-VN') + "đ";
    });

    function switchTab(type) {
        let btnQR = document.getElementById("btnQR");
        let btnCard = document.getElementById("btnCard");
        let paneQR = document.getElementById("paneQR");
        let paneCard = document.getElementById("paneCard");

        if (type === 'qr') {
            btnQR.classList.add('active');
            btnCard.classList.remove('active');
            paneQR.style.display = "block";
            paneCard.style.display = "none";
        } else {
            btnCard.classList.add('active');
            btnQR.classList.remove('active');
            paneCard.style.display = "block";
            paneQR.style.display = "none";
        }
    }

    function submitQRRequest() {
        let amount = Number(document.getElementById("depositAmount").value);
        if (!amount || amount <= 0) {
            alert("Vui lòng nhập số tiền hợp lệ!");
            return;
        }
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));

        let walletRequests = JSON.parse(localStorage.getItem('viper_wallet_requests')) || [];
        walletRequests.unshift({
            username: currentUser.username,
            method: "Chuyển khoản QR",
            amount: amount,
            status: "Chờ xử lý",
            time: new Date().toLocaleString('vi-VN')
        });
        localStorage.setItem('viper_wallet_requests', JSON.stringify(walletRequests));

        alert("Đã gửi yêu cầu nạp ví qua QR! Đang chờ Admin xét duyệt.");
        window.location.href = "lich-su.html";
    }

    function submitCardRequest() {
        let cardType = document.getElementById("cardType").value;
        let amount = Number(document.getElementById("cardAmount").value);
        let cardCode = document.getElementById("cardCode").value.trim();
        let cardSerial = document.getElementById("cardSerial").value.trim();

        if (!cardCode || !cardSerial) {
            alert("Vui lòng nhập đầy đủ Mã thẻ và Số Seri!");
            return;
        }
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));

        let walletRequests = JSON.parse(localStorage.getItem('viper_wallet_requests')) || [];
        walletRequests.unshift({
            username: currentUser.username,
            method: `Thẻ cào ${cardType} (${amount}đ)`,
            amount: amount,
            cardInfo: { cardType, cardCode, cardSerial },
            status: "Chờ xử lý",
            time: new Date().toLocaleString('vi-VN')
        });
        localStorage.setItem('viper_wallet_requests', JSON.stringify(walletRequests));

        alert("Đã gửi thẻ cào lên hệ thống! Đang chờ Admin xét duyệt.");
        window.location.href = "lich-su.html";
    }
</script>

</body>
</html>
