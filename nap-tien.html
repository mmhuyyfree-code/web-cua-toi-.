<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nạp Tiền Vào Ví - VIPER SHOP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(18, 24, 38, 0.95); padding: 10px 15px; border-bottom: 1px solid #2a3b6c; margin-bottom: 20px; border-radius: 8px; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 15px; font-size: 13px; font-weight: bold; }
        .nav-links a:hover, .nav-links a.active { color: #00ffcc; }
    </style>
</head>
<body>

<div class="container" style="max-width: 500px;">
    <!-- THANH MENU ĐIỀU HƯỚNG -->
    <div class="navbar">
        <div class="nav-links">
            <a href="index.html">Trang Chủ</a>
            <a href="nap-tien.html" class="active">Nạp Ví</a>
            <a href="lich-su.html">Lịch Sử</a>
        </div>
        <div id="authArea" style="font-size: 12px;">
            <div id="authLogged">
                <span id="loggedUser" style="color: #00ffcc; font-weight: bold;"></span> 
                (<span id="loggedBalance" style="color: #ffaa00;">0đ</span>)
            </div>
        </div>
    </div>

    <h2>NẠP TIỀN VÀO TÀI KHOẢN</h2>

    <div style="background: rgba(26, 34, 54, 0.8); padding: 15px; border-radius: 8px; border: 1px solid #00ffcc; margin-bottom: 15px; text-align: center;">
        <div style="font-size: 13px; color: #cbd5e1; margin-bottom: 5px;">Quét mã QR để chuyển khoản tự động:</div>
        <!-- Khung QR mẫu -->
        <div style="background: white; padding: 10px; display: inline-block; border-radius: 6px; margin: 10px 0;">
            <img src="https://img.vietqr.io/image/VCB-123456789-compact.png?amount=50000&addInfo=NAPVI" alt="QR Code" style="width: 150px; height: 150px; display: block;">
        </div>
        <div style="font-size: 12px; color: #ffaa00; font-weight: bold;">Nội dung chuyển khoản: NAPVI [Tên tài khoản]</div>
    </div>

    <div class="form-group">
        <label>Nhập số tiền bạn đã chuyển (dùng để test ví):</label>
        <input type="number" id="depositAmount" placeholder="Ví dụ: 50000">
    </div>

    <button type="button" onclick="simulateDeposit()" style="background: linear-gradient(135deg, #00ffcc, #0072ff); color: #0b0f19; font-weight: bold;">XÁC NHẬN ĐÃ CHUYỂN KHOẢN</button>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        if (!currentUser) {
            alert("Vui lòng đăng nhập để sử dụng tính năng nạp ví!");
            window.location.href = "login.html";
            return;
        }
        document.getElementById("loggedUser").innerText = currentUser.username;
        document.getElementById("loggedBalance").innerText = Number(currentUser.balance || 0).toLocaleString('vi-VN') + "đ";
    });

    function simulateDeposit() {
        let amount = Number(document.getElementById("depositAmount").value);
        if (!amount || amount <= 0) {
            alert("Vui lòng nhập số tiền hợp lệ!");
            return;
        }

        let currentUser = JSON.parse(localStorage.getItem('viper_current_user'));
        currentUser.balance = (currentUser.balance || 0) + amount;

        // Cập nhật lại thông tin user hiện tại
        localStorage.setItem('viper_current_user', JSON.stringify(currentUser));

        // Cập nhật lại trong danh sách tổng users
        let users = JSON.parse(localStorage.getItem('viper_users')) || [];
        let index = users.findIndex(u => u.username === currentUser.username);
        if (index !== -1) {
            users[index].balance = currentUser.balance;
            localStorage.setItem('viper_users', JSON.stringify(users));
        }

        alert(`Nạp thành công ${amount.toLocaleString('vi-VN')}đ vào ví!`);
        location.reload();
    }
</script>

</body>
</html>
