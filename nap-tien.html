<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPER SHOP - Nạp Tiền</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0b0f19; color: white; font-family: Arial, sans-serif; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: 0 auto; }
        .navbar { display: flex; justify-content: space-between; background: #121826; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; }
        .navbar a { color: #cbd5e1; text-decoration: none; font-weight: bold; margin-right: 10px; }
        .navbar a.active { color: #00ffcc; }
        .tab-box { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; background: #121826; border: 1px solid #2a3b6c; color: #cbd5e1; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; }
        .tab-btn.active { background: #00ffcc; color: #0b0f19; border-color: #00ffcc; }
        .panel { display: none; background: #1a2236; padding: 15px; border-radius: 10px; border: 1px solid #2a3b6c; margin-bottom: 15px; }
        .panel.active { display: block; }
        .form-control { width: 100%; padding: 10px; background: #0b0f19; border: 1px solid #2a3b6c; color: white; border-radius: 6px; margin-top: 5px; margin-bottom: 12px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #00ffcc; color: #0b0f19; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <div>
            <a href="index.html">Trang Chủ</a>
            <a href="goi-nap.html">Gói Nạp</a>
            <a href="nap-tien.html" class="active">Nạp Ví</a>
            <a href="lich-su.html">Lịch Sử</a>
        </div>
        <div><span id="userBalance" style="color: #00ffcc; font-weight: bold;">0đ</span></div>
    </div>

    <h2 style="text-align: center; color: #00ffcc; font-size: 18px;">NẠP TIỀN VÀO TÀI KHOẢN</h2>

    <div class="tab-box">
        <button class="tab-btn active" id="btnQR" onclick="switchTab('qr')">Chuyển Khoản QR</button>
        <button class="tab-btn" id="btnCard" onclick="switchTab('card')">Nạp Thẻ Cào</button>
    </div>

    <!-- PHẦN 1: CHUYỂN KHOẢN QR -->
    <div class="panel active" id="panelQR">
        <h3 style="color: #00ffcc; font-size: 15px; text-align: center; margin-top: 0;">Thông tin chuyển khoản</h3>
        <div style="text-align: center; margin-bottom: 12px;">
            <img src="1803.jpg" alt="QR" style="max-width: 160px; border-radius: 6px; background: white; padding: 5px;" onerror="this.style.display='none'">
        </div>
        <div style="background: #0b0f19; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 10px;">
            <div>Ngân hàng: <b>BIDV</b></div>
            <div>Số tài khoản: <b style="color: #00ffcc;">8877945567</b></div>
            <div>Nhân viên giao dịch: <b style="color: #ffaa00;">VI THI HA</b></div>
            <div>Nội dung CK: <b id="syntax" style="color: #00ffcc;">NAPVIP ...</b></div>
        </div>
        <label style="font-size: 12px;">Nhập số tiền đã chuyển (VNĐ):</label>
        <input type="number" id="money" class="form-control" placeholder="Ví dụ: 50000">
        <button class="btn" onclick="sendBank()">XÁC NHẬN GỬI YÊU CẦU</button>
    </div>

    <!-- PHẦN 2: THẺ CÀO -->
    <div class="panel" id="panelCard">
        <h3 style="color: #00ffcc; font-size: 15px; text-align: center; margin-top: 0;">Nạp thẻ cào điện thoại</h3>
        <label style="font-size: 12px;">Chọn nhà mạng:</label>
        <select id="telco" class="form-control">
            <option value="Viettel">Viettel</option>
            <option value="Mobifone">Mobifone</option>
            <option value="Vinaphone">Vinaphone</option>
        </select>
        <label style="font-size: 12px;">Chọn giá trị thẻ:</label>
        <select id="amount" class="form-control">
            <option value="10000">10.000đ</option>
            <option value="20000">20.000đ</option>
            <option value="50000">50.000đ</option>
            <option value="100000">100.000đ</option>
            <option value="200000">200.000đ</option>
            <option value="500000">500.000đ</option>
        </select>
        <label style="font-size: 12px;">Mã thẻ cào:</label>
        <input type="text" id="pin" class="form-control" placeholder="Nhập mã thẻ...">
        <label style="font-size: 12px;">Số seri:</label>
        <input type="text" id="seri" class="form-control" placeholder="Nhập số seri...">
        <button class="btn" onclick="sendCard()">XÁC NHẬN GỬI THẺ</button>
    </div>
</div>

<script>
    let user = JSON.parse(localStorage.getItem('viper_current_user'));
    if (!user) {
        alert("Vui lòng đăng nhập!");
        window.location.href = "login.html";
    } else {
        document.getElementById('userBalance').innerText = Number(user.balance || 0).toLocaleString('vi-VN') + "đ";
        document.getElementById('syntax').innerText = "NAPVIP " + user.username;
    }

    function switchTab(type) {
        document.getElementById('btnQR').classList.toggle('active', type === 'qr');
        document.getElementById('btnCard').classList.toggle('active', type === 'card');
        document.getElementById('panelQR').classList.toggle('active', type === 'qr');
        document.getElementById('panelCard').classList.toggle('active', type === 'card');
    }

    function sendBank() {
        let m = Number(document.getElementById('money').value);
        if (!m || m <= 0) { alert("Vui lòng nhập số tiền!"); return; }
        
        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
        orders.unshift({
            id: 'ORD' + Date.now(),
            username: user.username,
            category: 'deposit', // Phân loại rõ ràng là đơn nạp tiền
            type: "Chuyển khoản QR",
            amount: m,
            details: `BIDV - ${m.toLocaleString('vi-VN')}đ (NV: VI THI HA)`,
            status: "Chờ xử lý",
            time: new Date().toLocaleString('vi-VN')
        });
        localStorage.setItem('viper_orders', JSON.stringify(orders));
        alert("Gửi yêu cầu nạp tiền thành công!");
        window.location.href = "lich-su.html";
    }

    function sendCard() {
        let t = document.getElementById('telco').value;
        let a = Number(document.getElementById('amount').value);
        let p = document.getElementById('pin').value.trim();
        let s = document.getElementById('seri').value.trim();

        if (!p || !s) { alert("Nhập đủ mã thẻ và seri!"); return; }

        let orders = JSON.parse(localStorage.getItem('viper_orders')) || [];
        orders.unshift({
            id: 'ORD' + Date.now(),
            username: user.username,
            category: 'deposit', // Phân loại rõ ràng là đơn nạp tiền
            type: "Nạp Thẻ Cào",
            amount: a,
            details: `${t} - ${a.toLocaleString('vi-VN')}đ`,
            pin: p,
            seri: s,
            status: "Chờ xử lý",
            time: new Date().toLocaleString('vi-VN')
        });
        localStorage.setItem('viper_orders', JSON.stringify(orders));
        alert("Gửi thẻ cào thành công!");
        window.location.href = "lich-su.html";
    }
</script>
</body>
</html>
